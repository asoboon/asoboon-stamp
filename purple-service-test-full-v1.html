<title>ASOBooN PURPLE｜Developing LINE Test Full v1</title>
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#eee2f8;color:#2c2333}.app{max-width:520px;margin:auto;padding:24px 14px}.head,.card{padding:18px;border-radius:20px}.head{background:#5e2d91;color:#fff}.card{margin-top:12px;background:#fff}.msg{padding:12px;border-radius:12px;background:#f0e7f9;font-weight:800;line-height:1.6}.ok{background:#e8f6ed;color:#285d3d}.bad{background:#fff0eb;color:#7f3028}</style>
</head>
<body><main class="app"><section class="head"><b>ASOBooN PURPLE / DEVELOPING</b><h1>LINEサービスメッセージ実験</h1></section><section class="card"><div id="status" class="msg">Developing LIFFを初期化しています…</div></section></main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
(async()=>{'use strict';const s=document.getElementById('status');const set=(t,c='')=>{s.className='msg '+c;s.textContent=t};try{if(!window.liff)throw new Error('LIFF SDKを読み込めませんでした。');await liff.init({liffId:'2009884611-bDgDzGrN'});if(!liff.isInClient())throw new Error('LINEアプリ内ではありません。');if(!liff.isLoggedIn())throw new Error('LINEログイン状態を確認できません。');const t=liff.getAccessToken();if(!t)throw new Error('アクセストークンを取得できません。');set('✓ Developing LIFF 初期化成功','ok')}catch(e){set(String(e?.message||e),'bad')}})();
</script></body></html>

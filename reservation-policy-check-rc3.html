<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>ASOBooN RC3｜予約枠診断</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4efe5;color:#28231c;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.wrap{width:min(900px,calc(100% - 24px));margin:20px auto 60px}.card{background:#fff;border:1px solid #d9ccb5;border-radius:18px;padding:18px;box-shadow:0 8px 28px rgba(0,0,0,.06)}h1{margin:0;color:#0f2b46;font-size:1.35rem}.sub{color:#6b6256;font-size:.8rem;line-height:1.6}.tools{display:grid;grid-template-columns:1fr auto;gap:8px;margin:14px 0}input,button{font:inherit;border-radius:12px;padding:11px}input{border:1px solid #cdbd9e}button{border:0;background:#0f2b46;color:#fff;font-weight:900}.summary{padding:12px;border-radius:12px;background:#fff5d8;font-size:.78rem;line-height:1.65}.list{display:grid;gap:10px;margin-top:14px}.item{border:2px solid #d7c7aa;border-radius:14px;padding:12px;background:#fff}.item.ok{border-color:#4e9b6c;background:#edf8f0}.item.no{opacity:.66}.name{font-weight:950;color:#0f2b46}.meta{margin-top:5px;font-size:.7rem;color:#62594c;line-height:1.55}.badge{display:inline-block;margin-top:7px;padding:4px 8px;border-radius:999px;font-size:.65rem;font-weight:950}.ok .badge{background:#d2edd9;color:#23633d}.no .badge{background:#eee8dd;color:#665d50}.err{margin-top:12px;padding:11px;border-radius:12px;background:#ffe9e5;color:#8b342b;font-size:.76rem}
</style>
<script src="./autocall-config.js"></script><script src="./reservation-policy-rc3.js"></script>
</head>
<body><main class="wrap"><section class="card"><h1>🔎 RC3 予約枠診断</h1><p class="sub">AirWAITの全待ち項目と、指定日にミニアプリが採用する枠を比較します。このページから予約は作成しません。</p><div class="tools"><input id="day" type="date"><button id="load">診断</button></div><div id="summary" class="summary">未取得</div><div id="err" class="err" hidden></div><div id="list" class="list"></div></section></main>
<script>
(()=>{'use strict';const C=window.ASOBOON_RECEPTION_CONFIG||{},P=window.ASOBOON_RESERVATION_POLICY||{},$=id=>document.getElementById(id),URL='https://cl.airwait.jp/WCLP/api/20160600/external/stateless/wait/type/get';function weekday(d){const[y,m,x]=d.split('-').map(Number);return new Date(Date.UTC(y,m-1,x,12)).getUTCDay()}function policyFor(d){return P.exceptions?.[d]||{mode:P.defaultModeByWeekday?.[weekday(d)]}}function time(n){const s=String(n||'').normalize('NFKC');let m=s.match(/(?:^|[^\d])([01]?\d|2[0-3])\s*[:：]\s*([0-5]\d)/);if(m)return`${String(+m[1]).padStart(2,'0')}:${m[2]}`;m=s.match(/(?:^|[^\d])([01]?\d|2[0-3])\s*時\s*([0-5]?\d)\s*分/);if(m)return`${String(+m[1]).padStart(2,'0')}:${String(+m[2]).padStart(2,'0')}`;m=s.match(/(?:^|[^\d])([01]?\d|2[0-3])\s*時\s*半/);return m?`${String(+m[1]).padStart(2,'0')}:30`:''}function blocked(x){const id=String(x.waitTypeId||''),name=String(x.waitTypeName||'').normalize('NFKC').toLowerCase();return(P.blockedWaitTypeIds||[]).map(String).includes(id)||(P.blockedNamePatterns||[]).some(p=>name.includes(String(p).normalize('NFKC').toLowerCase()))}function allowed(x,r){if(blocked(x))return false;if(Array.isArray(r.waitTypeIds))return r.waitTypeIds.map(String).includes(String(x.waitTypeId));const mode=P.modes?.[r.mode];if(!mode)return false;const n=String(x.waitTypeName||'').normalize('NFKC'),t=time(n);return(mode.includeNamePatterns||[]).some(p=>n.includes(String(p)))||(mode.includeTimes||[]).includes(t)}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function run(){const d=$('day').value,r=policyFor(d);$('err').hidden=true;$('list').innerHTML='';$('summary').textContent='取得中…';try{const res=await fetch(`${URL}?key=${encodeURIComponent(C.airwaitApiKey)}`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded; charset=UTF-8'},body:new URLSearchParams({storeId:C.airwaitStoreId}),cache:'no-store'}),j=await res.json(),list=Array.isArray(j?.innerDto?.waitTypeList)?j.innerDto.waitTypeList:[];if(!res.ok||!(j.success===true||String(j?.resultCode?.code)==='0000'))throw new Error(j?.resultCode?.defaultMessage||'取得失敗');const selected=list.filter(x=>allowed(x,r));$('summary').innerHTML=`対象日 <strong>${esc(d)}</strong> / policy <strong>${esc(r.mode||'ID指定')}</strong><br>AirWAIT ${list.length}枠中、ミニアプリ採用 <strong>${selected.length}枠</strong>`;$('list').innerHTML=list.map(x=>{const a=allowed(x,r);return`<article class="item ${a?'ok':'no'}"><div class="name">${esc(x.waitTypeName||'名称なし')}</div><div class="meta">waitTypeId: <strong>${esc(x.waitTypeId)}</strong> / 時刻: ${esc(time(x.waitTypeName)||'判定なし')} / dispFlg: ${esc(x.dispFlg)}</div><span class="badge">${a?'✅ ミニアプリ予約対象':'除外'}</span></article>`}).join('')}catch(e){$('summary').textContent='診断失敗';$('err').hidden=false;$('err').textContent=e.message||String(e)}}const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()),o=Object.fromEntries(p.map(x=>[x.type,x.value]));$('day').value=`${o.year}-${o.month}-${o.day}`;$('load').onclick=run;run()})();
</script></body></html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#6a35a8">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<title>ASOBooN PURPLE｜Developing LINE Test</title>
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:linear-gradient(180deg,#e6d4f7,#fbf7ff 52%,#e0c9f1);color:#2c2333}.app{width:min(100%,520px);margin:auto;padding:calc(env(safe-area-inset-top) + 18px) 14px calc(env(safe-area-inset-bottom) + 30px)}.head{padding:20px 16px;border:3px solid #d6b7f5;border-radius:23px;background:linear-gradient(145deg,#7137ae,#37135f);color:#fff}.head small{display:block;color:#ead8ff;font-size:10px;font-weight:950;letter-spacing:.1em}.head h1{margin:6px 0 0;font-size:23px}.card{margin-top:12px;padding:15px;border:2px solid rgba(91,52,118,.2);border-radius:18px;background:#fff}.msg{padding:11px 12px;border-radius:12px;background:#f0e7f9;color:#583b71;font-size:12px;line-height:1.65;font-weight:850}.ok{background:#e8f6ed;color:#285d3d}.bad{background:#fff0eb;color:#7f3028}.meta{margin-top:10px;padding:10px;border-radius:12px;background:#f7f0fc;font-size:11px;line-height:1.55}.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin-top:10px;border:0;border-radius:12px;background:linear-gradient(180deg,#8b55c1,#5b2c8f);color:#fff;font-weight:1000}.btn:disabled{opacity:.45}.support{margin-top:13px;text-align:center;color:#6f6179;font-size:10px;line-height:1.5}</style>
</head>
<body><main class="app"><section class="head"><small>ASOBooN PURPLE / DEVELOPING</small><h1>LINEサービスメッセージ実験</h1></section><section class="card"><div id="status" class="msg">Developing環境を確認しています…</div><div class="meta">このページをLINE Developersの <b>Developing</b> 内部チャネルのエンドポイントURLに設定してください。Developing用LIFF IDは本番用とは別です。</div><button id="check" class="btn" type="button" disabled>Developing LIFFを確認</button></section><div class="support">本番ミニアプリには接続しません。紫専用テスト用です。</div></main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
(()=>{'use strict';
const DEV_LIFF_ID='';
const status=document.getElementById('status'),btn=document.getElementById('check');
function set(t,c=''){status.className='msg '+c;status.textContent=t}
if(!DEV_LIFF_ID){set('Developing用LIFF IDがまだ未設定です。LINE DevelopersでDevelopingのLIFF IDを確認したら、この紫ページへ設定します。','bad');return}
btn.disabled=false;btn.onclick=async()=>{try{set('Developing LIFFを初期化しています…');await liff.init({liffId:DEV_LIFF_ID});if(!liff.isInClient())throw new Error('LINEミニアプリ内で開いてください。');if(!liff.isLoggedIn())throw new Error('Developing LINEミニアプリのログイン状態を確認できません。');set('✓ Developing専用LIFFとして起動できています。サービスメッセージAPIの接続テストへ進めます。','ok')}catch(e){set(String(e?.message||e),'bad')}};
})();
</script></body></html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#6a35a8">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<title>ASOBooN PURPLE｜サービス通知登録</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:linear-gradient(180deg,#e7d7f6,#faf6fd 55%,#dfcbed);color:#2f2338}.app{width:min(100%,540px);margin:auto;padding:calc(env(safe-area-inset-top) + 18px) 14px calc(env(safe-area-inset-bottom) + 28px)}.hero{padding:19px 17px;border:3px solid #d7b8ef;border-radius:23px;background:linear-gradient(145deg,#7139a9,#351653);color:#fff;box-shadow:0 12px 30px rgba(60,23,102,.23)}.hero small{display:block;font-size:10px;font-weight:950;letter-spacing:.08em;color:#ead8ff}.hero h1{margin:6px 0 0;font-size:23px}.card{margin-top:12px;padding:15px;border:2px solid rgba(93,53,121,.2);border-radius:18px;background:#fff;box-shadow:0 7px 18px rgba(61,34,78,.08)}.status{padding:11px 12px;border-radius:12px;font-size:12px;line-height:1.55;font-weight:850;background:#f0e7f9;color:#583b71}.status.ok{background:#e8f6ed;color:#285d3d}.status.bad{background:#fff0eb;color:#7f3028}.status.warn{background:#fff8df;color:#725d1e}.summary{display:grid;gap:6px;margin-top:11px}.line{display:flex;justify-content:space-between;gap:12px;padding:8px 9px;border-radius:10px;background:#faf7fc;font-size:11px}.line span{color:#74677c}.line strong{color:#342541;text-align:right;word-break:break-word}.steps{display:grid;gap:7px;margin-top:12px}.step{display:flex;gap:9px;align-items:center;padding:9px 10px;border-radius:11px;background:#f2e9fb;color:#604179;font-size:10px;font-weight:900}.step b{display:grid;place-items:center;flex:0 0 24px;width:24px;height:24px;border-radius:50%;background:#6a35a8;color:#fff}.step.done{background:#e8f6ed;color:#285d3d}.step.done b{background:#2e7a52}.step.fail{background:#fff0eb;color:#7f3028}.step.fail b{background:#a8473b}.btn{width:100%;min-height:48px;margin-top:10px;border-radius:13px;border:0;font-weight:1000}.primary{background:linear-gradient(180deg,#8b55c1,#5b2c8f);color:#fff;box-shadow:0 5px 0 #3c1b61}.secondary{background:#fff;color:#4b2d61;border:2px solid #8a66a4}.detail{display:none;margin-top:10px;padding:10px;border-radius:11px;background:#faf7fc;border:1px solid #e5d9ed;color:#6b5b76;font-size:10px;line-height:1.6;white-space:pre-wrap;word-break:break-word}.detail.show{display:block}.note{margin-top:12px;color:#776882;font-size:9px;line-height:1.65}.ver{margin-top:9px;text-align:right;color:#9b89a8;font-size:9px}</style>
</head>
<body><main class="app"><section class="hero"><small>ASOBooN PURPLE / LINE MINI APP</small><h1>呼出通知を登録</h1></section><section class="card"><div id="status" class="status">紫サービス通知の準備を確認しています…</div><div id="summary" class="summary"></div><div class="steps"><div id="s1" class="step"><b>1</b>LINEミニアプリを初期化</div><div id="s2" class="step"><b>2</b>予約情報とLINE認証を確認</div><div id="s3" class="step"><b>3</b>通知サーバーを確認</div><div id="s4" class="step"><b>4</b>サービス通知トークンを登録</div></div><div id="detail" class="detail"></div><button id="retry" class="btn primary" type="button" hidden>再試行する</button><button id="back" class="btn secondary" type="button">← 紫呼出状況へ戻る</button><div class="note">安全設計：LIFFアクセストークンは登録時にメモリ上でのみ使用し、localStorageへ保存しません。Channel Secret・AirWAIT APIキー・サービス通知トークンはこのページには置きません。</div><div class="ver">PURPLE SERVICE REGISTER v1.1.0</div></section></main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="./purple-service-config.js?v=20260906-2"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),CFG=window.ASOBOON_PURPLE_SERVICE_CONFIG||{};let payload=null,busy=false;
const digits=v=>String(v==null?'':v).normalize('NFKC').replace(/\D/g,'');
const clean=v=>String(v==null?'':v).trim();
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const safeError=e=>String(e&&e.message||e||'UNKNOWN_ERROR').replace(/[\r\n\t]+/g,' ').slice(0,500);
function setStatus(t,c=''){$('status').className='status'+(c?' '+c:'');$('status').textContent=t}
function step(id,state='done'){const el=$(id);el.classList.remove('done','fail');el.classList.add(state)}
function detail(t){$('detail').textContent=String(t||'');$('detail').classList.toggle('show',Boolean(t))}
function mergedParams(){const out=new URLSearchParams(location.search);const state=out.get('liff.state');if(state){try{let s=decodeURIComponent(state);const q=s.includes('?')?s.slice(s.indexOf('?')+1):s.replace(/^\?/,'');const sp=new URLSearchParams(q);for(const [k,v] of sp.entries())if(k!=='liff.state')out.set(k,v)}catch(_){}}return out}
function readPayload(){const p=mergedParams();const x={receiptNo:digits(p.get('receiptNo')).slice(0,12),reserveId:digits(p.get('reserveId')).slice(0,12),waitTypeId:digits(p.get('waitTypeId')),waitTypeName:clean(p.get('waitTypeName')).slice(0,100),businessDate:clean(p.get('day')||p.get('businessDate')||p.get('operationalDay')).slice(0,10),source:'purple-service-register-v1.1'};if(!x.receiptNo||!x.reserveId||!/^\d{4}$/.test(x.waitTypeId)||!/^\d{4}-\d{2}-\d{2}$/.test(x.businessDate))throw new Error('受付情報が不足しています。紫呼出状況から開き直してください。');x.reserveId=x.reserveId.padStart(12,'0');return x}
function render(x){$('summary').innerHTML=`<div class="line"><span>受付番号</span><strong>${esc(x.receiptNo)}番</strong></div><div class="line"><span>受付日</span><strong>${esc(x.businessDate||'--')}</strong></div><div class="line"><span>待ち種別</span><strong>${esc(x.waitTypeName||x.waitTypeId)}</strong></div>`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function routePermanentLink(){const p=mergedParams();if(clean(p.get('view'))!=='callstatus')return false;const number=digits(p.get('number')).slice(0,12),date=clean(p.get('date')).slice(0,10);const u=new URL('./purple-callstatus.html?v=20260906-9',location.href);if(number)u.searchParams.set('number',number);if(/^\d{4}-\d{2}-\d{2}$/.test(date))u.searchParams.set('date',date);location.replace(u.href);return true}
function validBackend(){return /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec(?:\?.*)?$/.test(String(CFG.backendUrl||''))}
function jsonp(action,params={},timeout=Number(CFG.requestTimeoutMs||9000)){return new Promise((resolve,reject)=>{if(!validBackend())return reject(new Error('PURPLE_BACKEND_NOT_CONFIGURED'));const cb='__psm_'+Date.now()+'_'+Math.random().toString(36).slice(2);const u=new URL(CFG.backendUrl),s=document.createElement('script');let done=false,t;const finish=(err,v)=>{if(done)return;done=true;clearTimeout(t);try{delete window[cb]}catch{}s.remove();err?reject(err):resolve(v)};window[cb]=v=>finish(null,v);u.searchParams.set('action',action);u.searchParams.set('callback',cb);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,String(v??'')));u.searchParams.set('_',Date.now());s.src=u.href;s.onerror=()=>finish(new Error('PURPLE_BACKEND_GET_FAILED'));document.head.appendChild(s);t=setTimeout(()=>finish(new Error('PURPLE_BACKEND_GET_TIMEOUT')),timeout)})}
function requestId(){try{if(typeof crypto!=='undefined'&&crypto.randomUUID)return'psm_'+crypto.randomUUID()}catch{}return'psm_'+Date.now()+'_'+Math.random().toString(36).slice(2)}
async function postIssue(token){if(!validBackend())throw new Error('PURPLE_BACKEND_NOT_CONFIGURED');const id=requestId();const body={action:'issueServiceToken',requestId:id,...payload,liffAccessToken:token,sendFirstMessage:'FALSE'};await fetch(CFG.backendUrl,{method:'POST',mode:'no-cors',credentials:'omit',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:new URLSearchParams(Object.entries(body).map(([k,v])=>[k,String(v??'')])),cache:'no-store',keepalive:true});for(const ms of (Array.isArray(CFG.statusPollMs)?CFG.statusPollMs:[300,600,1000,1600,2400])){await sleep(Number(ms)||300);try{const r=await jsonp('requestStatus',{requestId:id});if(r&&r.found)return r}catch(_){}}throw new Error('PURPLE_BACKEND_NOT_CONFIRMED')}
function saveSafeResult(r){try{localStorage.setItem(CFG.resultKey||'asoboon_purple_service_message_v1',JSON.stringify({receiptNo:payload.receiptNo,reserveId:payload.reserveId,status:String(r&&r.status||''),remainingCount:Number(r&&r.remainingCount||0),expiresAt:String(r&&r.expiresAt||''),registeredAt:Date.now()}))}catch(_){}}
function goBack(){const u=new URL('./purple-callstatus.html?v=20260906-9',location.href);if(payload&&payload.receiptNo)u.searchParams.set('number',payload.receiptNo);if(payload&&payload.businessDate)u.searchParams.set('date',payload.businessDate);location.replace(u.href)}
async function run(){if(busy)return;busy=true;$('retry').hidden=true;detail('');['s1','s2','s3','s4'].forEach(id=>$(id).classList.remove('done','fail'));try{
  if(!CFG.liffId||!window.liff)throw new Error('LIFF_MODULE_NOT_READY');
  setStatus('LINEミニアプリを初期化しています…');await liff.init({liffId:CFG.liffId});step('s1');
  if(routePermanentLink())return;
  if(!liff.isInClient())throw new Error('LINE_MINI_APP_REQUIRED');if(!liff.isLoggedIn())throw new Error('LINE_LOGIN_REQUIRED');const token=String(liff.getAccessToken()||'');if(!token)throw new Error('LIFF_ACCESS_TOKEN_EMPTY');payload=readPayload();render(payload);step('s2');
  if(!validBackend()){step('s3','fail');throw new Error('PURPLE_BACKEND_NOT_CONFIGURED');}
  setStatus('紫通知サーバーを確認しています…');const h=await jsonp('health');if(!(h&&h.ok))throw new Error(h&&h.error||'PURPLE_BACKEND_HEALTH_FAILED');if(!String(h.version||'').startsWith(String(CFG.backendVersionPrefix||'1.1.')))throw new Error('PURPLE_BACKEND_VERSION_MISMATCH');if(h.channelSecretConfigured!==true)throw new Error('PURPLE_CHANNEL_SECRET_NOT_CONFIGURED');if(h.enabled!==true)throw new Error('PURPLE_SERVICE_DISABLED');step('s3');
  setStatus('サービス通知トークンを安全に登録しています…');const r=await postIssue(token);if(!(r&&r.ok&&r.stored))throw new Error(r&&r.error||'SERVICE_TOKEN_ISSUE_FAILED');step('s4');saveSafeResult(r);setStatus('✓ 呼出通知の登録準備が完了しました。','ok');detail(`状態: ${r.status||'TOKEN_READY'}\n残り送信可能回数: ${Number(r.remainingCount||0)}\n有効期限: ${r.expiresAt||'--'}`);setTimeout(goBack,1300);
}catch(e){const m=safeError(e);console.error(e);setStatus(messageFor(m),['PURPLE_BACKEND_NOT_CONFIGURED','PURPLE_SERVICE_DISABLED'].includes(m)?'warn':'bad');detail(m);$('retry').hidden=false}finally{busy=false}}
function messageFor(m){const map={PURPLE_BACKEND_NOT_CONFIGURED:'紫通知サーバーはまだ未接続です。フロント側は安全停止しています。',LINE_MINI_APP_REQUIRED:'LINEミニアプリ内で開いてください。',LINE_LOGIN_REQUIRED:'LINEのログイン状態を確認できません。',PURPLE_CHANNEL_SECRET_NOT_CONFIGURED:'サーバー側のChannel Secret設定が未完了です。',PURPLE_SERVICE_DISABLED:'紫サービス通知は安全のため停止中です。',PURPLE_SERVICE_BUSY_RETRY:'紫通知サーバーが別処理中です。数秒後に再試行してください。',LIFF_ACCESS_TOKEN_ALREADY_USED:'同じLIFFアクセストークンでの通知トークン再発行を防止しました。LINEミニアプリを開き直して再試行してください。'};return map[m]||m}
$('retry').onclick=run;$('back').onclick=goBack;run();
})();
</script></body></html>

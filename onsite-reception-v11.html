<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#0f2b46">
<title>ASOBooN｜入場受付</title>
<style>html,body{margin:0;min-height:100%;background:#efe1bd;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.loading{padding:28px 18px;text-align:center;color:#0f2b46;font-weight:900}.error{max-width:480px;margin:20px auto;padding:18px;border:2px solid #d7a59e;border-radius:16px;background:#fff0ed;color:#85362e}.error button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:#0f2b46;color:#fff;font-weight:900}</style>
<script src="./autocall-config.js?v=10"></script>
</head>
<body>
<div id="boot" class="loading">入場受付を読み込んでいます…</div>
<script>
(()=>{
'use strict';
const AIRWAIT='https://airwait.jp/WCSP/storeDetail?storeNo=AKR2298124918';
const LOCAL_KEY='asoboon_current_reservation_v3';
const CALL_KEY='asoboon_callstatus_number_v4';
const NOTICE_KEY='asoboon_cancel_notice_v1';
const API='https://cl.airwait.jp/WCLP/api/external/stateless/reservations';
const q=new URLSearchParams(location.search);
if(q.get('from')!=='miniapp-secret'){location.replace(AIRWAIT);return;}
const tag=src=>'<scr'+'ipt src="'+src+'"></scr'+'ipt>';
const fail=message=>{document.body.innerHTML='<div class="error"><strong>入場受付を読み込めませんでした。</strong><br><br>'+String(message||'通信状態を確認してください。')+'<button type="button" onclick="location.reload()">↻ もう一度読み込む</button></div>'};
const receiptKey=v=>String(v??'').normalize('NFKC').replace(/\D/g,'').replace(/^0+(?=\d)/,'');
function readLocal(){try{const r=JSON.parse(localStorage.getItem(LOCAL_KEY)||'null');return r&&r.receiptNo?r:null}catch{return null}}
function clearLocal(rec){try{localStorage.removeItem(LOCAL_KEY)}catch{}try{const x=JSON.parse(localStorage.getItem(CALL_KEY)||'null');if(!x||receiptKey(x.number)===receiptKey(rec?.receiptNo))localStorage.removeItem(CALL_KEY)}catch{try{localStorage.removeItem(CALL_KEY)}catch{}}}
function rememberCancelled(rec){try{localStorage.setItem(NOTICE_KEY,JSON.stringify({receiptNo:String(rec.receiptNo),waitTypeName:String(rec.waitTypeName||'現地受付'),cancelledAt:Date.now()}))}catch{}}
function apiOk(d){return d?.success===true||String(d?.resultCode?.code??'')==='0000'}
async function pageAll(start){
  const C=window.ASOBOON_RECEPTION_CONFIG||{};
  const res=await fetch(`${API}?key=${encodeURIComponent(C.airwaitApiKey||'')}`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded; charset=UTF-8'},body:new URLSearchParams({storeId:C.airwaitStoreId||'',sortStatus:'0',isDesc:'0',start:String(start),limit:'100'}),cache:'no-store',credentials:'omit'});
  if(!res.ok)throw new Error(`AirWAIT HTTP ${res.status}`);
  const d=await res.json();if(!apiOk(d))throw new Error(d?.resultCode?.defaultMessage||'AirWAIT status error');
  return{rows:Array.isArray(d?.innerDto?.reservations)?d.innerDto.reservations:[],count:Number(d?.innerDto?.count||0)};
}
async function findReservation(receiptNo){
  const target=receiptKey(receiptNo);let start=1,total=Infinity,guard=0;
  while(start<=total&&guard++<30){
    const p=await pageAll(start);total=p.count||p.rows.length;
    const hit=p.rows.find(x=>receiptKey(x?.number)===target);if(hit)return hit;
    if(!p.rows.length||start+p.rows.length>total)break;start+=p.rows.length;
  }
  return null;
}
async function reconcileBeforeRender(){
  const rec=readLocal();if(!rec)return;
  try{
    const row=await findReservation(rec.receiptNo);
    const status=row?String(row.status):'';
    if(['0','1','4'].includes(status))return;
    if(status==='3')rememberCancelled(rec);
    clearLocal(rec);
  }catch(error){console.warn('onsite preflight status check failed',error)}
}
(async()=>{
  try{
    await reconcileBeforeRender();
    const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),8000);let response;
    try{response=await fetch('./yoyaku-engine-v10.html?v=10',{cache:'no-store',signal:controller.signal})}finally{clearTimeout(timer)}
    if(!response.ok)throw new Error('受付画面を取得できませんでした。');
    let html=await response.text();
    html=html.replace('<h1 id="heroTitle">入場する回を選んで受付</h1>','<h1 id="heroTitle">入場する回を選ぶ</h1>');
    html=html.replace('<p>回を選ぶ → 人数を入れる → 内容を確認。3ステップで受付できます。</p>','');
    html=html.replace("function isBlocked(x){const id=String(x.waitTypeId||'');if((C.blockedWaitTypeIds||[]).map(String).includes(id))return true;const name=String(x.waitTypeName||'');return (C.blockedNamePatterns||[]).some(p=>name.includes(String(p)))}","function isBlocked(x){const id=String(x.waitTypeId||'');const name=String(x.waitTypeName||''),nameNorm=name.normalize('NFKC');const isTest=/テスト/.test(nameNorm);if(/WEB/i.test(nameNorm))return true;if(isTest){try{window.ASOBOON_ONSITE_TEST_IDS?.add(id)}catch{}return false}const p=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).map(v=>[v.type,v.value]));if(Number(p.hour)*60+Number(p.minute)<570)return true;if((C.blockedWaitTypeIds||[]).map(String).includes(id))return true;return (C.blockedNamePatterns||[]).some(p=>name.includes(String(p)))}");
    html=html.replace("S.closed=h>=Number(C.receptionCloseHour??18)&&h<Number(C.nextDayOpenHour??19);S.dayMode=h>=Number(C.nextDayOpenHour??19)?'tomorrow':'today';S.operationalDay=S.dayMode==='tomorrow'?ymdAdd(p.year,p.month,p.day,1):base;","S.closed=h>=18;S.dayMode=h>=18?'tomorrow':'today';S.operationalDay=h>=18?ymdAdd(p.year,p.month,p.day,1):base;");
    html=html.replace("S.dayMode==='tomorrow'?'19:00から翌日の受付を行っています':'受付状況は自動で更新されます'","S.dayMode==='tomorrow'?'':' '");
    html=html.replace('<section id="closedCard" class="closed" hidden><div class="clock">🕖</div><h2>ただいま受付準備中です</h2><p>次の入場受付は <strong>19:00から</strong> 開始します。<br>19:00以降は、翌日の受付をこの画面から行えます。</p></section>','<section id="closedCard" class="closed" hidden><div class="clock">🌙</div><h2>本日の現地受付は終了しました</h2><p>次回は8:00からテスト枠、9:30から通常枠をご利用いただけます。</p></section>');
    html=html.replace('<section class="card"><div class="step-head"><span class="step-no">1</span><div><h2>入場する回を選ぶ</h2>','<section id="slotCard" class="card"><div class="step-head"><span class="step-no">1</span><div><h2>入場する回を選ぶ</h2>');
    html=html.replace('<div id="slotList" class="slot-list"><div class="msg info">受付枠を読み込んでいます…</div></div></section>','<div id="slotList" class="slot-list"><div class="msg info">受付枠を読み込んでいます…</div></div><button class="btn light" type="button" onclick="location.reload()">↻ 再読み込み</button></section>');
    html=html.replace('<section id="peopleCard" class="card" hidden>\n  <div class="step-head">','<section id="peopleCard" class="card" hidden>\n  <button id="backToSlots" class="btn light" type="button" style="margin-top:0;margin-bottom:11px">← 回を選び直す</button>\n  <div class="step-head">');
    const oldClick="$('slotList').addEventListener('click',e=>{const b=e.target.closest('[data-slot]');if(!b)return;S.slot=S.slots.find(x=>String(x.waitTypeId)===String(b.dataset.slot))||null;renderSlots();$('peopleCard').hidden=!S.slot;$('waiverCard').hidden=!S.slot;updateUi();if(S.slot)setTimeout(()=>$('peopleCard').scrollIntoView({behavior:'smooth',block:'start'}),100)});";
    const newClick="$('slotList').addEventListener('click',e=>{const b=e.target.closest('[data-slot]');if(!b||b.disabled)return;S.slot=S.slots.find(x=>String(x.waitTypeId)===String(b.dataset.slot))||null;renderSlots();if(S.slot){$('slotCard').hidden=true;$('peopleCard').hidden=false;$('waiverCard').hidden=false;updateUi();window.scrollTo({top:0,behavior:'smooth'})}});$('backToSlots').addEventListener('click',()=>{$('slotCard').hidden=false;$('peopleCard').hidden=true;$('waiverCard').hidden=true;setTimeout(()=>$('slotCard').scrollIntoView({behavior:'smooth',block:'start'}),50)});";
    html=html.replace(oldClick,newClick);
    html=html.replace("persist(rec);rec.ledgerSynced=await ensureLedger(rec,4);persist(rec);$('confirmModal').hidden=true;$('receptionFlow').hidden=true;$('successCard').hidden=false;","persist(rec);$('confirmModal').hidden=true;$('receptionFlow').hidden=true;$('successCard').hidden=false;setTimeout(()=>{ensureLedger(rec,2).then(ok=>{rec.ledgerSynced=ok;persist(rec);setSyncMessage(rec,'successSyncMsg')}).catch(()=>{})},0);");
    html=html.replaceAll('href="yobidashi.html"','href="./callstatus.html"');
    const configTag='<scr'+'ipt src="./autocall-config.js?v=10"></scr'+'ipt>';
    html=html.replace(configTag,tag('./reservation-policy-rc3.js?v=20260828-rc3.1')+tag('./onsite-runtime-test-v20.js?v=22')+configTag);
    html=html.replace('</body>',tag('./onsite-test-v14.js?v=14')+tag('./onsite-cancel-v11.js?v=19')+'</body>');
    document.open();document.write(html);document.close();
  }catch(error){fail(error?.name==='AbortError'?'読み込みに時間がかかっています。':error?.message)}
})();
})();
</script>
</body>
</html>

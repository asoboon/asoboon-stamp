<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#6a35a8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ASOBooN PURPLE｜本番コピー環境</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e8dcf6}
#miniappCore{display:block;width:100%;height:100%;border:0;background:#e8dcf6}
#purpleBadge{position:fixed;z-index:2147483647;right:10px;top:max(8px,env(safe-area-inset-top));padding:7px 12px;border:2px solid #fff;border-radius:999px;background:linear-gradient(180deg,#925dcc,#6a35a8);color:#fff;font:1000 11px/1 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;box-shadow:0 6px 18px rgba(62,28,100,.34);pointer-events:none;letter-spacing:.08em}
</style>
<script src="./app/core/app-config.js?v=20260831-1"></script>
<script src="./app/core/business-day.js?v=20260831-3"></script>
</head>
<body>
<div id="purpleBadge">🟣 PURPLE COPY</div>
<iframe id="miniappCore" title="ASOBooN PURPLE 本番コピー"></iframe>
<script>
(()=>{'use strict';
const frame=document.getElementById('miniappCore');
const coreBase=new URL('./home-core.html',location.href);
const reservationUrl=new URL('./purple-reserve.html?v=20260906-2',location.href).href;
const callStatusUrl=new URL('./purple-callstatus.html?v=20260906-2',location.href).href;
const timeGuideUrl=new URL('./purple-timeguide.html?v=20260906-2',location.href).href;
const adminUrl=new URL('./admin.html?v=20260905-6',location.href).href;
const PURPLE_TIME_KEY='asoboon_purple_adventure_time_v1';
let tapTimes=[],businessDay=null,businessError='',syncing=false;
function childUrl(){const u=new URL(coreBase.href);u.search=location.search;u.hash=location.hash;return u.href}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function ensurePurpleStyle(doc){
  if(doc.getElementById('asoboonPurpleCopyStyle'))return;
  const style=doc.createElement('style');style.id='asoboonPurpleCopyStyle';style.textContent=`
:root{--navy:#5b2d87!important;--navy-deep:#351653!important;--forest:#63368d!important;--forest-deep:#3a1d58!important;--brass:#a274c7!important;--brass-light:#d7b8ef!important;--brass-deep:#714397!important;--paper:#eee4f8!important;--paper-light:#fcf8ff!important;--paper-deep:#dcc8ef!important}
html,body{background:linear-gradient(180deg,#e9def6,#f8f4fc 55%,#decbed)!important}
body:before{opacity:.15!important}.home-shell{border-color:rgba(106,53,168,.42)!important;background:linear-gradient(180deg,#fcf8ff,#eee4f8 75%,#dcc8ef)!important}.mode-cap,body.inside .mode-cap{background:radial-gradient(circle at 82% 14%,rgba(228,197,255,.18),transparent 28%),linear-gradient(155deg,#633596,#351653)!important}.title-badge{background:linear-gradient(180deg,#fffaff,#eadcf7)!important;color:#512778!important}.title-badge h1,.title-badge h1 span{color:#512778!important}.subtitle-ribbon,body.inside .subtitle-ribbon{background:linear-gradient(180deg,#925dcc,#6a35a8)!important;color:#fff!important}.sns-tag{background:linear-gradient(180deg,#a66ed4,#7140a5)!important;border-color:#5a2a83!important}.menu-btn{background:rgba(89,42,129,.58)!important;color:#fff!important}.compact-mode-switch,body:not(.inside) .compact-mode-switch,body.inside .compact-mode-switch{border-color:rgba(106,53,168,.24)!important;background:rgba(246,239,252,.94)!important}.compact-mode-btn,body.inside .compact-mode-btn{color:#704b8d!important}.compact-mode-btn.active,body:not(.inside) .compact-mode-btn.active,body.inside .compact-mode-btn.active{color:#fff!important;background:linear-gradient(180deg,#925dcc,#6a35a8)!important;box-shadow:0 3px 9px rgba(83,35,134,.25)!important}
.status-card{background:linear-gradient(180deg,#f7effd,#e7d6f4)!important;border-color:#8758ac!important}.status-label{background:#7844a1!important}.status-main{color:#4e276f!important}.status-sub{color:#705d80!important}.ticket{border-color:#9b70bc!important;background:linear-gradient(155deg,#6c3a96,#40215f)!important;color:#fff!important}.ticket-number{background:#d7b8ef!important;color:#4f2870!important}.route-guide{border-color:rgba(106,53,168,.28)!important;background:linear-gradient(180deg,#fbf7ff,#eee4f8)!important}.route-guide h3{color:#512778!important}.route-item{color:#522c70!important}.route-icon{color:#6a35a8!important}
.page-head,body.inside .page-head{background:linear-gradient(155deg,#633596,#351653)!important;border-color:#b78eda!important}.page-head small{color:#e2c9f4!important}.paper,.availability-card,.reservation-simple-flow,.slot-guide,.parking-map-card,.mini-game-hub,.call-status-launch{border-color:rgba(106,53,168,.24)!important;background:linear-gradient(180deg,#fffaff,#f2e9fa)!important}.paper h3,.availability-head h3,.reservation-simple-head h3,.slot-guide h3,.call-status-launch h3{color:#542b77!important}.live-chip{background:#7b45aa!important}.reservation-main-cta,.reservation-primary,.reservation-call-cta,.call-status-button,.action:not(.secondary),.time-save{border-color:#542879!important;background:linear-gradient(180deg,#a36bd0,#6a35a8)!important;color:#fff!important}.reservation-main-cta strong,.reservation-main-cta small,.reservation-call-cta strong,.reservation-call-cta small,.call-status-button strong,.call-status-button small{color:#fff!important}.action.secondary{border-color:#9b70bc!important;background:linear-gradient(180deg,#fffaff,#e7d7f4)!important;color:#542b77!important}.reservation-start-grid{grid-template-columns:1fr!important}.reservation-start-card.local{display:none!important}.reservation-start-card.web{border-color:rgba(106,53,168,.36)!important;background:linear-gradient(180deg,#fbf7ff,#eee2fa)!important}.reservation-start-card.web span{background:#6a35a8!important}.reservation-start-card.web strong{color:#512778!important}.reservation-critical{border-left-color:#8851b1!important;background:#f5ebfb!important;color:#603c75!important}.asoboon-purple-note{margin:0 0 10px;padding:9px 11px;border-radius:12px;background:#f2e9fb;border:1px solid #d0b5e8;color:#5b3975;font-size:.67rem;line-height:1.55;font-weight:850}
`;doc.head.appendChild(style)
}
function patchReservation(doc){ensurePurpleStyle(doc);const quick=doc.getElementById('reservationQuickLink');if(quick){quick.href=reservationUrl;quick.target='_top';quick.rel='noopener';const time=quick.querySelector('.reservation-quick-time');if(time)time.textContent='紫環境';const strong=quick.querySelector('.reservation-quick-copy strong');if(strong)strong.textContent='LINEで当日予約する';const small=quick.querySelector('.reservation-quick-copy small');if(small)small.textContent='本番Airウェイトへ登録'}const section=doc.querySelector('.reservation-start-section');const title=section?.querySelector('h3');if(title){title.textContent='紫環境の予約テスト';let note=doc.getElementById('asoboonPurpleNote');if(!note){note=doc.createElement('p');note.id='asoboonPurpleNote';note.className='asoboon-purple-note';note.textContent='予約 → LINE呼出通知 → 紫の呼出状況まで、この紫コピー内で検証します。';title.insertAdjacentElement('afterend',note)}}doc.querySelectorAll('.reservation-start-card.local').forEach(el=>el.remove());const web=doc.querySelector('.reservation-start-card.web');if(web&&!web.dataset.purpleBound){web.dataset.purpleBound='1';web.setAttribute('role','link');web.setAttribute('tabindex','0');const label=web.querySelector('span');if(label)label.textContent='LINE予約';const time=web.querySelector('strong');if(time)time.textContent='紫テスト';const go=()=>top.location.href=reservationUrl;web.addEventListener('click',go);web.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}})}}
function bindPurpleRoutes(doc){if(!doc||doc.documentElement.dataset.asoboonPurpleRoutes==='1')return;doc.documentElement.dataset.asoboonPurpleRoutes='1';doc.addEventListener('click',e=>{const target=e.target.closest?.('[data-before-view="call"],[data-open-view="call"],#callStatusLink,#reservationCallLink');if(target){e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation();top.location.href=callStatusUrl;return}const timeTarget=e.target.closest?.('[data-open-view="playtime"],[data-inside-view="playtime"]');if(timeTarget&&doc.body.classList.contains('inside')){e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation();top.location.href=timeGuideUrl}},true)}
function patchNavigation(){try{const win=frame.contentWindow,doc=frame.contentDocument;if(!doc||!win)return;ensurePurpleStyle(doc);if(win.ASOBOON_CONFIG){win.ASOBOON_CONFIG.reservationUrl=reservationUrl;win.ASOBOON_CONFIG.callStatusUrl=callStatusUrl}doc.querySelectorAll('a').forEach(a=>{const href=String(a.getAttribute('href')||'');if(/callstatus\.html/i.test(href)){a.href=callStatusUrl;a.target='_top'}});const call=doc.getElementById('callStatusLink');if(call){call.href=callStatusUrl;call.target='_top'}const rcall=doc.getElementById('reservationCallLink');if(rcall){rcall.href=callStatusUrl;rcall.target='_top'}bindPurpleRoutes(doc);patchReservation(doc)}catch(e){console.warn('purple navigation',e)}}
function syncPurplePlaytime(){try{const doc=frame.contentDocument;if(!doc)return;const main=doc.getElementById('statusMain'),sub=doc.getElementById('statusSub');if(!main||!sub)return;let x=null;try{x=JSON.parse(localStorage.getItem(PURPLE_TIME_KEY)||'null')}catch{}if(x&&x.date===today()){main.textContent=String(x.main||'設定済み');sub.textContent=String(x.sub||'時間ガイドで確認できます')}else{main.textContent='まだ設定されていません';sub.textContent='「何時まであそべる？」から確認できます'}}catch{}}
function bindSecret(){try{const target=frame.contentDocument?.querySelector('.title-badge');if(!target||target.dataset.purpleSecret==='1')return;target.dataset.purpleSecret='1';target.addEventListener('click',()=>{const now=Date.now();tapTimes=tapTimes.filter(t=>now-t<4000);tapTimes.push(now);if(tapTimes.length>=7){tapTimes=[];top.location.href=adminUrl}},{passive:true})}catch{}}
function ensureBusinessBadge(doc){let badge=doc.getElementById('asoboonV2BusinessBadge');if(badge)return badge;const durationSwitch=doc.querySelector('.duration-switch');if(!durationSwitch)return null;badge=doc.createElement('div');badge.id='asoboonV2BusinessBadge';badge.setAttribute('role','status');badge.style.cssText=['margin:0 0 10px','padding:11px 12px','border-radius:13px','border:2px solid rgba(183,142,218,.55)','background:linear-gradient(180deg,#684092,#40245d)','color:#fff7ff','box-shadow:0 4px 0 rgba(0,0,0,.16)','font-size:.72rem','line-height:1.5','font-weight:850'].join(';');durationSwitch.parentNode.insertBefore(badge,durationSwitch);return badge}
function applyBusinessDay(){try{const doc=frame.contentDocument,win=frame.contentWindow;if(!doc||!win)return;const durationSwitch=doc.querySelector('.duration-switch'),badge=ensureBusinessBadge(doc),calc=doc.getElementById('calcBtn');if(businessError&&!businessDay){if(durationSwitch)durationSwitch.style.display='none';if(calc)calc.disabled=true;if(badge){badge.style.background='linear-gradient(180deg,#6a3b31,#43251f)';badge.innerHTML='<strong style="display:block;font-size:.82rem">営業カレンダーを確認できません</strong><span>安全のため利用時間の自動設定を停止しています。</span>'}return}if(!businessDay)return;win.ASOBOON_BUSINESS_DAY=businessDay;if(durationSwitch)durationSwitch.style.display='none';if(businessDay.isClosed){localStorage.removeItem(PURPLE_TIME_KEY);if(calc)calc.disabled=true;if(badge){badge.style.background='linear-gradient(180deg,#6a3b31,#43251f)';badge.innerHTML='<strong style="display:block;font-size:.82rem">本日は休館日です</strong><span>営業カレンダーから自動判定しています。</span>'}return}if(badge){badge.style.background='linear-gradient(180deg,#684092,#40245d)';badge.innerHTML=`<strong style="display:block;font-size:.82rem">本日は「${businessDay.businessType}」</strong><span>利用時間 ${businessDay.durationLabel}${businessDay.closingTime?`｜${businessDay.closingTime}閉館`:''}</span>`}const target=doc.querySelector(`.duration-btn[data-duration="${businessDay.durationMinutes}"]`);if(target&&!target.classList.contains('active'))target.click();if(calc)calc.disabled=false}catch{}}
async function syncBusinessDay(force=false){if(syncing)return;syncing=true;try{const B=window.ASOBOON_BUSINESS_DAY;if(!B?.getCurrent)throw new Error('営業カレンダーを読み込めませんでした');businessDay=await B.getCurrent({force});businessError='';applyBusinessDay()}catch(e){businessDay=null;businessError=String(e?.message||e);applyBusinessDay()}finally{syncing=false}}
frame.addEventListener('load',()=>{patchNavigation();bindSecret();applyBusinessDay();syncPurplePlaytime();syncBusinessDay(false)});frame.src=childUrl();setInterval(()=>{patchNavigation();bindSecret();applyBusinessDay();syncPurplePlaytime()},650);setInterval(()=>syncBusinessDay(false),10*60*1000);window.addEventListener('focus',()=>{syncBusinessDay(false);syncPurplePlaytime()});document.addEventListener('visibilitychange',()=>{if(!document.hidden){syncBusinessDay(false);syncPurplePlaytime()}});window.addEventListener('online',()=>syncBusinessDay(false));
})();
</script>
</body></html>

<body><div id="gatewayBadge">GATEWAY 未設定</div><div id="purpleBadge">🟣 PURPLE COPY v7.1</div><iframe id="miniappCore" title="ASOBooN PURPLE 本番コピー"></iframe>
<script>
(()=>{'use strict';const frame=document.getElementById('miniappCore'),cfg=window.ASOBOON_PURPLE_SERVICE_CONFIG||{},coreBase=new URL('./home-core.html',location.href),reserveChoiceUrl=new URL('./purple-reserve-v5.html?v=20260907-2',location.href).href,onsiteUrl=new URL('./purple-reserve-v5.html?v=20260907-2&method=local',location.href).href,webUrl=new URL('./purple-reserve-v5.html?v=20260907-2&method=web',location.href).href,callStatusUrl=new URL('./purple-callstatus.html?v=20260907-2',location.href).href,timeGuideUrl=new URL('./purple-timeguide.html?v=20260907-2',location.href).href,adminUrl=new URL('./admin.html?v=20260907-2',location.href).href,setupUrl=new URL('./purple-service-setup.html?v=20260907-2',location.href).href,TIME_KEY='asoboon_purple_adventure_time_v2';let tapTimes=[],businessDay=null,syncing=false;const gatewayBadge=document.getElementById('gatewayBadge');if(typeof cfg.validBackend==='function'&&cfg.validBackend(cfg.backendUrl)){gatewayBadge.textContent='GATEWAY 設定済';gatewayBadge.classList.add('ready')}function today(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function childUrl(){const u=new URL(coreBase.href);u.search=location.search;u.hash=location.hash;return u.href}function ensureStyle(doc){if(doc.getElementById('asoboonPurpleCopyStyleV7'))return;const s=doc.createElement('style');s.id='asoboonPurpleCopyStyleV7';s.textContent=`body{background:radial-gradient(circle at 12% 4%,rgba(255,255,255,.48),transparent 24%),linear-gradient(180deg,#e8daf7,#faf6ff 58%,#dfc8f0)!important}.mode-cap{background:radial-gradient(circle at 84% 12%,rgba(231,205,255,.18),transparent 28%),linear-gradient(155deg,#7137ae,#37135f)!important}.title-badge{background:linear-gradient(180deg,#fffaff,#eadcf8)!important;color:#4f2378!important}.subtitle-ribbon,.compact-mode-btn.active,.sns-tag,.menu-btn{background:linear-gradient(180deg,#965fc8,#6a35a8)!important;color:#fff!important}.compact-mode-switch{background:#f2e8fb!important;border-color:rgba(106,53,168,.24)!important}.compact-mode-btn{color:#63398b!important}.ticket{border-color:rgba(106,53,168,.26)!important;background:linear-gradient(180deg,#fff,#f1e7fb)!important}.ticket-number{background:linear-gradient(180deg,#965fc8,#6a35a8)!important;color:#fff!important}.ticket-title{color:#4d266f!important}.route-guide,.paper,.availability-card,.reservation-simple-flow,.call-status-launch,.parking-intro-card,.parking-route-panel,.mini-game-hub{border-color:rgba(106,53,168,.22)!important;background:linear-gradient(180deg,#fffdff,#f4ecfc)!important;box-shadow:0 8px 18px rgba(83,35,134,.09)!important}.route-guide h3,.paper h3,.availability-head h3,.reservation-simple-head h3,.call-status-launch h3,.page-head h2{color:#4d266f!important}.reservation-main-cta,.reservation-call-cta,.call-status-button,.action,.action.secondary{border-color:#6a35a8!important;background:linear-gradient(180deg,#965fc8,#6a35a8)!important;color:#fff!important}.reservation-start-grid{grid-template-columns:1fr 1fr!important}.reservation-start-card{display:grid!important;cursor:pointer!important;min-height:82px!important}.reservation-start-card.web{border-color:#5b6fb1!important;background:linear-gradient(180deg,#f9fbff,#e9edff)!important}.reservation-start-card.local{border-color:#7c42af!important;background:linear-gradient(180deg,#fcf8ff,#eee0fa)!important}.reservation-start-card.web span{background:#425ea8!important}.reservation-start-card.local span{background:#6a35a8!important}.reservation-start-card strong{color:#4f2378!important}.asoboon-purple-note{margin:0 0 10px;padding:9px 10px;border-radius:11px;background:#f2e9fb;border:1px solid #d0b5e8;color:#5b3975;font-size:.67rem;line-height:1.55;font-weight:850}.asoboon-purple-gateway{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 10px;padding:9px 10px;border-radius:11px;background:#eee8f4;border:1px solid #d2c3dd;color:#64566e;font-size:.65rem;font-weight:900}.asoboon-purple-gateway.ready{background:#e8f6ed;border-color:#c6e3d1;color:#2b6541}.asoboon-purple-gateway a{flex:none;padding:5px 8px;border-radius:8px;background:#6a35a8;color:#fff;text-decoration:none;font-size:.6rem}.status-card{border-color:rgba(106,53,168,.28)!important;background:linear-gradient(180deg,#fbf7ff,#efe4fb)!important}.status-main{color:#4f2378!important}`;doc.head.appendChild(s)}function bindCard(card,url,label,time){if(!card)return;card.style.display='grid';card.setAttribute('role','link');card.setAttribute('tabindex','0');const sp=card.querySelector('span');if(sp)sp.textContent=label;const st=card.querySelector('strong');if(st)st.textContent=time;if(card.dataset.purpleBoundV7)return;card.dataset.purpleBoundV7='1';const go=e=>{if(e){e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation()}top.location.href=url};card.addEventListener('click',go,true);card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')go(e)},true)}function patchReservation(doc){ensureStyle(doc);const quick=doc.getElementById('reservationQuickLink');if(quick){quick.href=reserveChoiceUrl;quick.target='_top';const tm=quick.querySelector('.reservation-quick-time');if(tm)tm.textContent='2つから選ぶ';const st=quick.querySelector('.reservation-quick-copy strong');if(st)st.textContent='予約方法を選ぶ';const sm=quick.querySelector('.reservation-quick-copy small');if(sm)sm.textContent='WEB予約 / 現地予約'}const section=doc.querySelector('.reservation-start-section'),title=section?.querySelector('h3');if(title){title.textContent='予約方法';let gate=doc.getElementById('asoboonPurpleGateway');if(!gate){gate=doc.createElement('div');gate.id='asoboonPurpleGateway';gate.className='asoboon-purple-gateway'+(gatewayBadge.classList.contains('ready')?' ready':'');gate.innerHTML=`<span>${gatewayBadge.classList.contains('ready')?'✓ 紫V2 Gateway 設定済':'⚠ 紫V2 Gateway 未設定'}</span><a href="${setupUrl}" target="_top">設定</a>`;title.insertAdjacentElement('afterend',gate)}let note=doc.getElementById('asoboonPurpleNote');if(!note){note=doc.createElement('p');note.id='asoboonPurpleNote';note.className='asoboon-purple-note';note.textContent='WEB予約は一度紫の案内ページを経由してAirウェイト公式画面へ進みます。現地予約は紫V2 Gateway経由です。どちらも紫呼出状況へ戻れます。';gate.insertAdjacentElement('afterend',note)}}bindCard(doc.querySelector('.reservation-start-card.web'),webUrl,'WEB予約','7:00〜');bindCard(doc.querySelector('.reservation-start-card.local'),onsiteUrl,'現地予約','9:30〜')}function bindRoutes(doc){if(!doc||doc.documentElement.dataset.purpleRoutesV7==='1')return;doc.documentElement.dataset.purpleRoutesV7='1';doc.addEventListener('click',e=>{const c=e.target.closest?.('[data-before-view="call"],[data-open-view="call"],#callStatusLink,#reservationCallLink');if(c){e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation();top.location.href=callStatusUrl;return}const t=e.target.closest?.('[data-open-view="playtime"],[data-inside-view="playtime"]');if(t&&doc.body.classList.contains('inside')){e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation();top.location.href=timeGuideUrl}},true)}function patchNavigation(){try{const doc=frame.contentDocument,win=frame.contentWindow;if(!doc||!win)return;ensureStyle(doc);if(win.ASOBOON_CONFIG){win.ASOBOON_CONFIG.reservationUrl=reserveChoiceUrl;win.ASOBOON_CONFIG.callStatusUrl=callStatusUrl}doc.querySelectorAll('a').forEach(a=>{if(/callstatus\.html/i.test(String(a.getAttribute('href')||''))){a.href=callStatusUrl;a.target='_top'}});const c=doc.getElementById('callStatusLink');if(c){c.href=callStatusUrl;c.target='_top'}const rc=doc.getElementById('reservationCallLink');if(rc){rc.href=callStatusUrl;rc.target='_top'}bindRoutes(doc);patchReservation(doc)}catch(e){console.warn('purple home patch',e)}}function syncPlaytime(){try{const doc=frame.contentDocument,main=doc?.getElementById('statusMain'),sub=doc?.getElementById('statusSub');if(!main||!sub)return;let x=null;try{x=JSON.parse(localStorage.getItem(TIME_KEY)||'null')}catch{}if(x&&x.date===today()){main.textContent=String(x.main||'設定済み');sub.textContent=String(x.sub||'紫の時間ガイドで確認できます')}else{main.textContent='まだ設定されていません';sub.textContent='「何時まであそべる？」から確認できます'}}catch{}}function bindSecret(){try{const t=frame.contentDocument?.querySelector('.title-badge');if(!t||t.dataset.purpleSecretV7)return;t.dataset.purpleSecretV7='1';t.addEventListener('click',()=>{const n=Date.now();tapTimes=tapTimes.filter(x=>n-x<4000);tapTimes.push(n);if(tapTimes.length>=7){tapTimes=[];top.location.href=adminUrl}},{passive:true})}catch{}}function ensureBusinessBadge(doc){let b=doc.getElementById('asoboonV2BusinessBadge');if(b)return b;const sw=doc.querySelector('.duration-switch');if(!sw)return null;b=doc.createElement('div');b.id='asoboonV2BusinessBadge';b.style.cssText='margin:0 0 10px;padding:11px 12px;border-radius:13px;border:2px solid rgba(132,82,179,.38);background:linear-gradient(180deg,#6a35a8,#45206d);color:#fff;font-size:.72rem;line-height:1.5;font-weight:850';sw.parentNode.insertBefore(b,sw);return b}function applyBusinessDay(){try{const doc=frame.contentDocument;if(!doc||!businessDay)return;const sw=doc.querySelector('.duration-switch'),b=ensureBusinessBadge(doc),calc=doc.getElementById('calcBtn');if(sw)sw.style.display='none';if(businessDay.isClosed){if(calc)calc.disabled=true;if(b)b.innerHTML='<strong>本日は休館日です</strong>';return}if(b)b.innerHTML=`<strong style="display:block">本日は「${businessDay.businessType}」</strong><span>利用時間 ${businessDay.durationLabel}${businessDay.closingTime?`｜${businessDay.closingTime}閉館`:''}</span>`;const btn=doc.querySelector(`.duration-btn[data-duration="${businessDay.durationMinutes}"]`);if(btn&&!btn.classList.contains('active'))btn.click();if(calc)calc.disabled=false}catch{}}async function syncBusinessDay(force=false){if(syncing)return;syncing=true;try{businessDay=await window.ASOBOON_BUSINESS_DAY?.getCurrent({force});applyBusinessDay()}catch(e){console.warn(e)}finally{syncing=false}}frame.addEventListener('load',()=>{patchNavigation();bindSecret();syncPlaytime();syncBusinessDay(false)});frame.src=childUrl();setInterval(()=>{patchNavigation();bindSecret();syncPlaytime();applyBusinessDay()},700);setInterval(()=>syncBusinessDay(false),10*60*1000);window.addEventListener('focus',()=>{syncPlaytime();syncBusinessDay(false)});document.addEventListener('visibilitychange',()=>{if(!document.hidden){syncPlaytime();syncBusinessDay(false)}});
})();

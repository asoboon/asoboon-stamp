<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#10283f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ASOBooN PURPLE｜本番コピー環境</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#efe1bd}
#miniappCore{display:block;width:100%;height:100%;border:0;background:#efe1bd}
#purpleBadge{position:fixed;z-index:2147483647;right:10px;top:max(8px,env(safe-area-inset-top));padding:5px 9px;border:2px solid #fff;border-radius:999px;background:#6a35a8;color:#fff;font:900 10px/1 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;box-shadow:0 4px 14px rgba(62,28,100,.28);pointer-events:none;letter-spacing:.06em}
</style>
<script src="./app/core/app-config.js?v=20260831-1"></script>
<script src="./app/core/business-day.js?v=20260831-3"></script>
</head>
<body>
<div id="purpleBadge">🟣 PURPLE COPY</div>
<iframe id="miniappCore" title="ASOBooN PURPLE 本番コピー"></iframe>
<script>
(()=>{'use strict';
const frame=document.getElementById('miniappCore');
const coreBase=new URL('./home-core.html',location.href);
const reservationUrl=new URL('./purple-reserve.html?v=20260906-1',location.href).href;
const callStatusUrl=new URL('./purple-callstatus.html?v=20260906-1',location.href).href;
const timeGuideUrl=new URL('./purple-timeguide.html?v=20260906-1',location.href).href;
const adminUrl=new URL('./admin.html?v=20260905-6',location.href).href;
const PURPLE_TIME_KEY='asoboon_purple_adventure_time_v1';
let tapTimes=[],businessDay=null,businessError='',syncing=false;
function childUrl(){const u=new URL(coreBase.href);u.search=location.search;u.hash=location.hash;return u.href}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function ensurePurpleStyle(doc){if(doc.getElementById('asoboonPurpleCopyStyle'))return;const style=doc.createElement('style');style.id='asoboonPurpleCopyStyle';style.textContent=`
.reservation-start-grid{grid-template-columns:1fr!important}.reservation-start-card.local{display:none!important}.asoboon-purple-note{margin:0 0 10px;padding:8px 10px;border-radius:11px;background:#f2e9fb;border:1px solid #d0b5e8;color:#5b3975;font-size:.67rem;line-height:1.55;font-weight:850}.reservation-start-card.web{border-color:rgba(106,53,168,.30)!important;background:linear-gradient(180deg,#fbf7ff,#eee2fa)!important}.reservation-start-card.web span{background:#6a35a8!important}`;doc.head.appendChild(style)}
function patchReservation(doc){ensurePurpleStyle(doc);const quick=doc.getElementById('reservationQuickLink');if(quick){quick.href=reservationUrl;quick.target='_top';quick.rel='noopener';const time=quick.querySelector('.reservation-quick-time');if(time)time.textContent='紫環境';const strong=quick.querySelector('.reservation-quick-copy strong');if(strong)strong.textContent='LINEで当日予約する';const small=quick.querySelector('.reservation-quick-copy small');if(small)small.textContent='本番Airウェイトへ登録'}const section=doc.querySelector('.reservation-start-section');const title=section?.querySelector('h3');if(title){title.textContent='紫環境の予約テスト';let note=doc.getElementById('asoboonPurpleNote');if(!note){note=doc.createElement('p');note.id='asoboonPurpleNote';note.className='asoboon-purple-note';note.textContent='予約 → LINE呼出通知 → 紫の呼出状況まで、この紫コピー内で検証します。';title.insertAdjacentElement('afterend',note)}}doc.querySelectorAll('.reservation-start-card.local').forEach(el=>el.remove());const web=doc.querySelector('.reservation-start-card.web');if(web&&!web.dataset.purpleBound){web.dataset.purpleBound='1';web.setAttribute('role','link');web.setAttribute('tabindex','0');const label=web.querySelector('span');if(label)label.textContent='LINE予約';const time=web.querySelector('strong');if(time)time.textContent='紫テスト';const go=()=>top.location.href=reservationUrl;web.addEventListener('click',go);web.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}})}}
function bindPurpleRoutes(doc){if(!doc||doc.documentElement.dataset.asoboonPurpleRoutes==='1')return;doc.documentElement.dataset.asoboonPurpleRoutes='1';doc.addEventListener('click',e=>{const target=e.target.closest?.('[data-before-view="call"],[data-open-view="call"],#callStatusLink,#reservationCallLink');if(target){e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation();top.location.href=callStatusUrl;return}const timeTarget=e.target.closest?.('[data-open-view="playtime"],[data-inside-view="playtime"]');if(timeTarget&&doc.body.classList.contains('inside')){e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation();top.location.href=timeGuideUrl}},true)}
function patchNavigation(){try{const win=frame.contentWindow,doc=frame.contentDocument;if(!doc||!win)return;if(win.ASOBOON_CONFIG){win.ASOBOON_CONFIG.reservationUrl=reservationUrl;win.ASOBOON_CONFIG.callStatusUrl=callStatusUrl}doc.querySelectorAll('a').forEach(a=>{const href=String(a.getAttribute('href')||'');if(/callstatus\.html/i.test(href)){a.href=callStatusUrl;a.target='_top'}});const call=doc.getElementById('callStatusLink');if(call){call.href=callStatusUrl;call.target='_top'}const rcall=doc.getElementById('reservationCallLink');if(rcall){rcall.href=callStatusUrl;rcall.target='_top'}bindPurpleRoutes(doc);patchReservation(doc)}catch(e){console.warn('purple navigation',e)}}
function syncPurplePlaytime(){try{const doc=frame.contentDocument;if(!doc)return;const main=doc.getElementById('statusMain'),sub=doc.getElementById('statusSub');if(!main||!sub)return;let x=null;try{x=JSON.parse(localStorage.getItem(PURPLE_TIME_KEY)||'null')}catch{}if(x&&x.date===today()){main.textContent=String(x.main||'設定済み');sub.textContent=String(x.sub||'時間ガイドで確認できます')}else{main.textContent='まだ設定されていません';sub.textContent='「何時まであそべる？」から確認できます'}}catch{}}
function bindSecret(){try{const target=frame.contentDocument?.querySelector('.title-badge');if(!target||target.dataset.purpleSecret==='1')return;target.dataset.purpleSecret='1';target.addEventListener('click',()=>{const now=Date.now();tapTimes=tapTimes.filter(t=>now-t<4000);tapTimes.push(now);if(tapTimes.length>=7){tapTimes=[];top.location.href=adminUrl}},{passive:true})}catch{}}
function ensureBusinessBadge(doc){let badge=doc.getElementById('asoboonV2BusinessBadge');if(badge)return badge;const durationSwitch=doc.querySelector('.duration-switch');if(!durationSwitch)return null;badge=doc.createElement('div');badge.id='asoboonV2BusinessBadge';badge.setAttribute('role','status');badge.style.cssText=['margin:0 0 10px','padding:11px 12px','border-radius:13px','border:2px solid rgba(239,210,127,.45)','background:linear-gradient(180deg,#263a34,#172923)','color:#fff7dd','box-shadow:0 4px 0 rgba(0,0,0,.16)','font-size:.72rem','line-height:1.5','font-weight:850'].join(';');durationSwitch.parentNode.insertBefore(badge,durationSwitch);return badge}
function applyBusinessDay(){try{const doc=frame.contentDocument,win=frame.contentWindow;if(!doc||!win)return;const durationSwitch=doc.querySelector('.duration-switch'),badge=ensureBusinessBadge(doc),calc=doc.getElementById('calcBtn');if(businessError&&!businessDay){if(durationSwitch)durationSwitch.style.display='none';if(calc)calc.disabled=true;if(badge){badge.style.background='linear-gradient(180deg,#6a3b31,#43251f)';badge.innerHTML='<strong style="display:block;font-size:.82rem">営業カレンダーを確認できません</strong><span>安全のため利用時間の自動設定を停止しています。</span>'}return}if(!businessDay)return;win.ASOBOON_BUSINESS_DAY=businessDay;if(durationSwitch)durationSwitch.style.display='none';if(businessDay.isClosed){localStorage.removeItem(PURPLE_TIME_KEY);if(calc)calc.disabled=true;if(badge){badge.style.background='linear-gradient(180deg,#6a3b31,#43251f)';badge.innerHTML='<strong style="display:block;font-size:.82rem">本日は休館日です</strong><span>営業カレンダーから自動判定しています。</span>'}return}if(badge){badge.style.background='linear-gradient(180deg,#263a34,#172923)';badge.innerHTML=`<strong style="display:block;font-size:.82rem">本日は「${businessDay.businessType}」</strong><span>利用時間 ${businessDay.durationLabel}${businessDay.closingTime?`｜${businessDay.closingTime}閉館`:''}</span>`}const target=doc.querySelector(`.duration-btn[data-duration="${businessDay.durationMinutes}"]`);if(target&&!target.classList.contains('active'))target.click();if(calc)calc.disabled=false}catch{}}
async function syncBusinessDay(force=false){if(syncing)return;syncing=true;try{const B=window.ASOBOON_BUSINESS_DAY;if(!B?.getCurrent)throw new Error('営業カレンダーを読み込めませんでした');businessDay=await B.getCurrent({force});businessError='';applyBusinessDay()}catch(e){businessDay=null;businessError=String(e?.message||e);applyBusinessDay()}finally{syncing=false}}
frame.addEventListener('load',()=>{patchNavigation();bindSecret();applyBusinessDay();syncPurplePlaytime();syncBusinessDay(false)});frame.src=childUrl();setInterval(()=>{patchNavigation();bindSecret();applyBusinessDay();syncPurplePlaytime()},650);setInterval(()=>syncBusinessDay(false),10*60*1000);window.addEventListener('focus',()=>{syncBusinessDay(false);syncPurplePlaytime()});document.addEventListener('visibilitychange',()=>{if(!document.hidden){syncBusinessDay(false);syncPurplePlaytime()}});window.addEventListener('online',()=>syncBusinessDay(false));
})();
</script>
</body></html>

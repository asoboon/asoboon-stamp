<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#eee4f7}.bar{height:68px;padding:calc(env(safe-area-inset-top) + 7px) 10px 7px;display:flex;align-items:center;gap:9px;background:linear-gradient(145deg,#6a35a8,#3b1769);color:#fff;border-bottom:2px solid #d2b1f1}.back{flex:none;padding:9px 11px;border:1px solid #d8bdf2;border-radius:10px;color:#fff;text-decoration:none;font-size:12px;font-weight:900}.copy{min-width:0}.copy strong{display:block;font-size:14px}.copy small{display:block;margin-top:2px;color:#e6d6f4;font-size:10px}.frame{display:block;width:100%;height:calc(100% - 68px);border:0;background:#efe1bd}</style>

<body>
<div class="bar"><a class="back" href="./staff-test-home.html?v=20260905-5">← 紫HOME</a><div class="copy"><strong>スタッフ検証｜呼出状況 v5</strong><small id="numberLabel">受付番号を読み込み中</small></div></div>
<iframe id="frame" class="frame" title="呼出状況"></iframe>
<script>
(()=>{'use strict';const p=new URLSearchParams(location.search),number=String(p.get('number')||'').replace(/\D/g,''),date=String(p.get('date')||'');function localDate(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}if(number){try{localStorage.setItem('asoboon_callstatus_number_v4',JSON.stringify({date:date||localDate(),number}))}catch{}document.getElementById('numberLabel').textContent=`受付番号 ${number}番`}else document.getElementById('numberLabel').textContent='この端末に保存された受付番号を表示';const u=new URL('./callstatus.html',location.href);u.searchParams.set('staff','1');u.searchParams.set('v','20260905-5');document.getElementById('frame').src=u.href})();
</script>

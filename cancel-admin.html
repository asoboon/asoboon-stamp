<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#10283f"><title>キャンセル確認｜ASOBooN STAFF</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#2d281f;background:#efe2c3;--navy:#102d48;--red:#a74232;--green:#27784f;--line:#d4c09a}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:linear-gradient(180deg,#efe2c3,#f8f0df);padding:max(12px,env(safe-area-inset-top)) 12px calc(30px + env(safe-area-inset-bottom))}main{width:min(100%,620px);margin:auto}.hero,.card{border:2px solid var(--line);border-radius:20px;box-shadow:0 10px 26px rgba(53,38,17,.12)}.hero{padding:17px;background:linear-gradient(155deg,#183b5a,#081d30);color:#fff6dc}.hero small{color:#e4c66f;font-size:.62rem;font-weight:1000;letter-spacing:.12em}.hero h1{margin:5px 0 4px;font-size:1.4rem}.hero p{margin:0;color:#d8d1c3;font-size:.7rem;line-height:1.55}.card{margin-top:11px;padding:14px;background:#fffaf0}.card h2{margin:0;color:var(--navy);font-size:.96rem}.search{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.search input{min-width:0;height:52px;border:2px solid #bda77d;border-radius:12px;background:#fff;padding:0 12px;text-align:center;font-size:1.25rem;font-weight:1000}.search button,.btn{min-height:52px;border:0;border-radius:12px;padding:0 14px;font-weight:1000}.search button{background:var(--navy);color:#fff}.result{margin-top:11px;padding:13px;border-radius:14px;background:#eef3f5;color:#314b58;font-size:.72rem;line-height:1.55}.result strong{display:block;font-size:1rem}.result.ok{background:#e8f6ed;color:#245f3d}.result.bad{background:#fff0ed;color:#85362e}.actions{display:grid;gap:8px;margin-top:10px}.danger{background:#f8dfda;color:#87342d;border:2px solid #d7a099}.secondary{background:#f0e6d1;color:#4c402e;border:1px solid #cdbb98}.note{margin-top:9px;color:#746957;font-size:.65rem;line-height:1.55}.back{display:block;margin-top:14px;text-align:center;color:#5b4a30;font-size:.7rem;font-weight:900;text-decoration:none}</style></head>
<body><main><header class="hero"><small>ASOBooN STAFF</small><h1>キャンセル反映確認</h1><p>受付番号の現在状態をAirウェイトから確認します。取消済み番号はミニアプリ側の保存情報からも削除できます。</p></header>
<section class="card"><h2>受付番号を確認</h2><div class="search"><input id="num" inputmode="numeric" placeholder="例 1254"><button id="check" type="button">確認</button></div><div id="result" class="result">受付番号を入力してください。</div><div id="actions" class="actions" hidden><button id="selfCancel" class="btn danger" type="button" hidden>この端末の本人用URLで取消手続きへ</button><button id="clearLocal" class="btn secondary" type="button" hidden>この端末の保存番号を削除</button></div><div class="note">Airウェイトの正式な取消は元に戻せません。API仕様上、受付番号だけでは安全に取消できないため、本人専用URLまたはAirウェイトスタッフ画面で確定します。この画面は取消後の状態確認を自動で行います。</div></section><a class="back" href="./admin.html">← 管理メニューへ戻る</a></main>
<script>
(()=>{'use strict';const API_KEY='lYwyf5yYCOSpQjg9xAJ9Fp80phVvYDHI',STORE_ID='KR01205179',RES_API='https://cl.airwait.jp/WCLP/api/external/stateless/reservations',CALL_KEY='asoboon_callstatus_number_v4',KEYS=['asoboon_current_reservation_v3','asoboon_current_reservation_v2','asoboon_reservation_rc3_current_v1'];const $=id=>document.getElementById(id);let current='';
function unwrap(x){if(!x||typeof x!=='object')return null;const r=x.reservation&&typeof x.reservation==='object'?x.reservation:x;return {...x,...r}}function localRec(){for(const k of KEYS){try{const r=unwrap(JSON.parse(localStorage.getItem(k)||'null'));if(r?.receiptNo)return {...r,_key:k}}catch{}}return null}function ok(d){return d?.success===true||String(d?.resultCode?.code||'')==='0000'}async function page(start){const r=await fetch(`${RES_API}?key=${encodeURIComponent(API_KEY)}`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded; charset=UTF-8'},body:new URLSearchParams({storeId:STORE_ID,sortStatus:'0',isDesc:'0',start:String(start),limit:'100'}),cache:'no-store',credentials:'omit'});const d=await r.json();if(!r.ok||!ok(d))throw Error('Airウェイトを確認できません');return{count:Number(d?.innerDto?.count||0),rows:d?.innerDto?.reservations||[]}}async function find(n){let s=1,total=Infinity,g=0;while(s<=total&&g++<20){const p=await page(s);total=p.count||p.rows.length;const hit=p.rows.find(x=>String(x.number||'').trim()===n);if(hit)return hit;if(!p.rows.length||s+p.rows.length>total)break;s+=p.rows.length}return null}function clear(n){for(const k of KEYS){try{const r=unwrap(JSON.parse(localStorage.getItem(k)||'null'));if(r&&String(r.receiptNo||'').trim()===n)localStorage.removeItem(k)}catch{}}try{const x=JSON.parse(localStorage.getItem(CALL_KEY)||'null');if(x&&String(x.number||'').trim()===n)localStorage.removeItem(CALL_KEY)}catch{}}function statusLabel(s){return{'0':'待ち中','1':'保留','2':'案内済み','3':'取消','4':'対応中'}[String(s)]||`状態 ${s}`}
async function check(){const n=$('num').value.trim();if(!n)return;current=n;$('result').className='result';$('result').textContent='Airウェイトを確認しています…';$('actions').hidden=true;try{const row=await find(n),r=localRec();if(!row){$('result').textContent='現在の受付一覧では見つかりません。取消直後の場合は反映待ちの可能性があります。';return}const st=String(row.status);$('result').className=`result ${st==='3'?'ok':(st==='0'||st==='1'||st==='4'?'':'bad')}`;$('result').innerHTML=`<strong>${n}番｜${statusLabel(st)}</strong>${row.waitTypeName?String(row.waitTypeName):''}`;$('actions').hidden=false;$('clearLocal').hidden=st!=='3';const own=r&&String(r.receiptNo||'').trim()===n&&r.shortUrl;$('selfCancel').hidden=!(st!=='3'&&own);if(st==='3')clear(n)}catch(e){$('result').className='result bad';$('result').textContent=String(e.message||e)}}
$('check').addEventListener('click',check);$('num').addEventListener('keydown',e=>{if(e.key==='Enter')check()});$('clearLocal').addEventListener('click',()=>{if(!current)return;clear(current);$('result').className='result ok';$('result').textContent=`${current}番の端末保存情報を削除しました。`});$('selfCancel').addEventListener('click',()=>{const r=localRec();if(!r||String(r.receiptNo||'').trim()!==current)return;location.href=`./cancel.html?staff=1&number=${encodeURIComponent(current)}`});setInterval(()=>{if(current)check()},6000);
})();
</script></body></html>

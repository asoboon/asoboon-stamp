<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0f2b46">
<meta name="robots" content="noindex,nofollow">
<title>あなたの呼出状況｜ASOBooN</title>
<style>
:root{--paper:#efe1bd;--cream:#fff8e8;--navy:#0f2b46;--red:#a74232;--red2:#fff0ed;--line:#d8c49b;--shadow:0 12px 30px rgba(42,31,17,.22)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif}
#statusFrame{display:block;width:100%;height:100%;border:0;background:var(--paper)}
body.has-cancel #statusFrame{height:calc(100% - 90px)}
.cancelbar{position:fixed;z-index:20;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;min-height:90px;padding:12px max(12px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:linear-gradient(180deg,rgba(255,248,232,.98),#efe1bd);border-top:2px solid var(--line);box-shadow:0 -8px 24px rgba(42,31,17,.14)}
.cancelbar[hidden]{display:none}.cancelcopy{min-width:0;flex:1}.cancelcopy strong{display:block;color:var(--navy);font-size:.82rem}.cancelcopy small{display:block;margin-top:3px;color:#6d6353;font-size:.62rem;line-height:1.4}.cancelbtn{flex:0 0 auto;min-height:48px;border:2px solid #c78d84;border-radius:13px;padding:10px 14px;background:var(--red2);color:#8b3028;font-weight:950}
.modal{position:fixed;z-index:50;inset:0;display:grid;place-items:end center;padding:12px;background:rgba(5,15,24,.58);backdrop-filter:blur(5px)}.modal[hidden]{display:none}.sheet{width:min(100%,500px);padding:18px;border-radius:22px 22px 15px 15px;background:var(--cream);border:2px solid var(--line);box-shadow:var(--shadow)}.sheet h2{margin:0;color:var(--navy);font-size:1.18rem}.sheet p{margin:8px 0 0;color:#6d6353;font-size:.74rem;line-height:1.65}.warn{margin-top:11px;padding:11px;border-radius:12px;background:var(--red2);color:#7f3028;font-size:.7rem;line-height:1.55;font-weight:850}.actions{display:grid;grid-template-columns:1fr 1.35fr;gap:8px;margin-top:13px}.btn{min-height:50px;border-radius:13px;font-weight:950}.back{border:1px solid #cdbb98;background:#f5ead4;color:#3f382d}.go{border:2px solid #8e332b;background:linear-gradient(180deg,#c95749,#9b352c);color:#fff}.done{position:fixed;z-index:80;inset:0;display:grid;place-items:center;padding:20px;background:linear-gradient(180deg,#e8f5ec,#f7edd8)}.done[hidden]{display:none}.donecard{width:min(100%,430px);padding:24px 18px;border:3px solid #79ad8b;border-radius:24px;background:#fffaf0;text-align:center;box-shadow:var(--shadow)}.check{display:grid;place-items:center;width:66px;height:66px;margin:0 auto 10px;border-radius:50%;background:#d9efdf;color:#27784f;font-size:2rem;font-weight:1000}.done h2{margin:0;color:var(--navy)}.done p{margin:8px 0 0;color:#506258;font-size:.76rem;line-height:1.6}.homebtn{display:block;margin-top:15px;padding:13px;border-radius:13px;background:var(--navy);color:#fff;text-decoration:none;font-weight:950}
.toast{position:fixed;z-index:35;left:50%;bottom:104px;transform:translateX(-50%);width:min(calc(100% - 30px),430px);padding:10px 12px;border-radius:12px;background:#173f32;color:#fff8e8;text-align:center;font-size:.7rem;font-weight:850;box-shadow:var(--shadow)}.toast[hidden]{display:none}
</style>
</head>
<body>
<iframe id="statusFrame" title="ASOBooN 呼出状況"></iframe>
<div id="cancelBar" class="cancelbar" hidden>
  <div class="cancelcopy"><strong>受付を取り消しますか？</strong><small>このミニアプリから受付した番号だけキャンセルできます</small></div>
  <button id="cancelOpen" class="cancelbtn" type="button">受付をキャンセル</button>
</div>
<div id="toast" class="toast" hidden>キャンセルの反映を確認しています…</div>
<div id="cancelModal" class="modal" hidden>
  <div class="sheet">
    <h2>受付をキャンセルしますか？</h2>
    <p>キャンセルすると現在の順番は失われ、元に戻せません。</p>
    <div class="warn">次にAirウェイトの正式な取消画面が開きます。そこで「順番待ちをキャンセルする」→「取り消しをする」で完了です。</div>
    <div class="actions">
      <button id="cancelBack" class="btn back" type="button">やめる</button>
      <button id="cancelGo" class="btn go" type="button">取消画面へ進む</button>
    </div>
  </div>
</div>
<div id="doneView" class="done" hidden>
  <div class="donecard">
    <div class="check">✓</div>
    <h2>キャンセルしました</h2>
    <p>ミニアプリで受付した番号を解除しました。必要であれば新しく受付できます。</p>
    <a class="homebtn" href="./home.html">ミニアプリへ戻る</a>
  </div>
</div>
<script>
(()=>{'use strict';
const frame=document.getElementById('statusFrame');
const CURRENT_KEY='asoboon_current_reservation_v2';
const CALL_KEY='asoboon_callstatus_number_v4';
const PENDING_KEY='asoboon_cancel_pending_v1';
const API_KEY='lYwyf5yYCOSpQjg9xAJ9Fp80phVvYDHI';
const STORE_ID='KR01205179';
const RES_API='https://cl.airwait.jp/WCLP/api/external/stateless/reservations';
let checking=false;
let activeRecord=null;

function localDate(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function readRecord(){try{const x=JSON.parse(localStorage.getItem(CURRENT_KEY)||'null');return x&&x.receiptNo&&x.waitTypeId?x:null}catch(e){return null}}
function readCallNumber(){
  try{
    const x=JSON.parse(localStorage.getItem(CALL_KEY)||'null');
    if(!x||x.date!==localDate())return '';
    return String(x.number||'').trim();
  }catch(e){return ''}
}
function isMiniappReception(r){return !!r&&String(r.source||'')==='asoboon-onsite-live'&&!!r.shortUrl}
function isViewingMiniappReception(r){return isMiniappReception(r)&&readCallNumber()===String(r.receiptNo).trim()}
function syncNumberIfEmpty(r){
  if(!r||readCallNumber())return;
  try{localStorage.setItem(CALL_KEY,JSON.stringify({date:localDate(),number:String(r.receiptNo)}))}catch(e){}
}
function clearOwnedReception(r,{showDone=false}={}){
  const ownedNumber=String(r?.receiptNo||'').trim();
  const shownNumber=readCallNumber();
  try{
    localStorage.removeItem(CURRENT_KEY);
    localStorage.removeItem(PENDING_KEY);
    if(ownedNumber&&shownNumber===ownedNumber)localStorage.removeItem(CALL_KEY);
  }catch(e){}
  activeRecord=null;
  document.body.classList.remove('has-cancel');
  document.getElementById('cancelBar').hidden=true;
  document.getElementById('toast').hidden=true;
  if(showDone)document.getElementById('doneView').hidden=false;
}
function setCancelVisible(on){document.getElementById('cancelBar').hidden=!on;document.body.classList.toggle('has-cancel',!!on)}
function isSuccess(d){return d?.success===true||String(d?.resultCode?.code||'')==='0000'}
async function page(r,start){const res=await fetch(`${RES_API}?key=${encodeURIComponent(API_KEY)}`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded; charset=UTF-8'},body:new URLSearchParams({storeId:STORE_ID,waitTypeId:String(r.waitTypeId),sortStatus:'0',isDesc:'0',start:String(start),limit:'100'}),cache:'no-store',credentials:'omit'});const d=await res.json();if(!isSuccess(d))throw new Error(d?.resultCode?.defaultMessage||'受付状況を確認できません');return{count:Number(d?.innerDto?.count||0),rows:d?.innerDto?.reservations||[]}}
async function findTarget(r){let start=1,rows=[];while(start<=1000){const p=await page(r,start);rows.push(...p.rows);const hit=rows.find(x=>String(x.waitTypeId)===String(r.waitTypeId)&&String(x.number)===String(r.receiptNo));if(hit)return hit;if(rows.length>=p.count||!p.rows.length)break;start+=p.rows.length}return null}
async function refreshState(){
  if(checking)return;
  const r=readRecord();activeRecord=r;
  if(!r){setCancelVisible(false);return}
  syncNumberIfEmpty(r);
  const viewingOwned=isViewingMiniappReception(r);
  checking=true;
  try{
    const row=await findTarget(r);
    if(!row){setCancelVisible(false);return}
    const st=String(row.status);
    if(st==='3'){
      clearOwnedReception(r,{showDone:viewingOwned});
      return;
    }
    if((st==='0'||st==='1')&&viewingOwned){setCancelVisible(true)}else{setCancelVisible(false)}
  }catch(e){setCancelVisible(false)}finally{checking=false}
}

frame.src=`./callstatus-core.html?v=569&wrap=1`;
document.getElementById('cancelOpen').addEventListener('click',()=>{
  activeRecord=readRecord();
  if(!isViewingMiniappReception(activeRecord))return;
  document.getElementById('cancelModal').hidden=false;
});
document.getElementById('cancelBack').addEventListener('click',()=>{document.getElementById('cancelModal').hidden=true});
document.getElementById('cancelGo').addEventListener('click',()=>{
  const r=readRecord();
  if(!isViewingMiniappReception(r))return;
  document.getElementById('cancelModal').hidden=true;
  try{localStorage.setItem(PENDING_KEY,String(Date.now()))}catch(e){}
  document.getElementById('toast').hidden=false;
  const w=window.open(String(r.shortUrl),'_blank','noopener');
  if(!w){location.href=String(r.shortUrl)}
});
window.addEventListener('focus',refreshState);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshState()});
setInterval(refreshState,10000);refreshState();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#123c35">
<title>ASOBooN｜紫 何時まであそべる？</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e8d7ae}
#frame{display:block;width:100%;height:100%;border:0;background:#e8d7ae}
#purpleBadge{position:fixed;z-index:2147483647;right:10px;top:max(8px,env(safe-area-inset-top));padding:5px 9px;border:2px solid #fff;border-radius:999px;background:#6a35a8;color:#fff;font:900 10px/1 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;box-shadow:0 4px 14px rgba(62,28,100,.28);pointer-events:none;letter-spacing:.06em}
</style>
</head>
<body>
<div id="purpleBadge">🟣 PURPLE</div>
<iframe id="frame" title="ASOBooN 紫 何時まであそべる？"></iframe>
<script>
(()=>{'use strict';
const PURPLE_KEY='asoboon_purple_adventure_time_v1';
const PROD_KEY='asoboon-adventure-time';
const PURPLE_HOME='./staff-test-home.html?v=20260906-1&mode=inside';
const frame=document.getElementById('frame');
const params=new URLSearchParams(location.search);
const pad=v=>String(v).padStart(2,'0');
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
function readPurple(){try{const x=JSON.parse(localStorage.getItem(PURPLE_KEY)||'null');return x&&x.date===today()?x:null}catch{return null}}
function patchStorage(w){try{if(w.__ASOBOON_PURPLE_TIME_STORAGE__)return;const proto=w.Storage&&w.Storage.prototype;if(!proto)return;const get=proto.getItem,set=proto.setItem,remove=proto.removeItem;proto.getItem=function(k){return get.call(this,k===PROD_KEY?PURPLE_KEY:k)};proto.setItem=function(k,v){return set.call(this,k===PROD_KEY?PURPLE_KEY:k,v)};proto.removeItem=function(k){return remove.call(this,k===PROD_KEY?PURPLE_KEY:k)};w.__ASOBOON_PURPLE_TIME_STORAGE__=true}catch(e){console.warn('purple time storage patch',e)}}
function patchNavigation(){try{const doc=frame.contentDocument;if(!doc)return;const home=doc.querySelector('.home-link');if(home){home.href=new URL(PURPLE_HOME,location.href).href;home.target='_top';home.textContent='⌂ 紫ホーム'}}catch(e){console.warn('purple time nav patch',e)}}
const saved=readPurple();
const u=new URL('./timeguide.html',location.href);
const queryMinutes=Number(params.get('minutes'));
const queryEntry=String(params.get('entry')||'');
const now=new Date();
const nowText=`${pad(Math.max(10,Math.min(17,now.getHours())))}:${pad(now.getMinutes())}`;
const mins=[0,150,180].includes(queryMinutes)?queryMinutes:(saved&&[0,150,180].includes(Number(saved.duration))?Number(saved.duration):150);
const entry=/^\d{2}:\d{2}$/.test(queryEntry)?queryEntry:(saved&&/^\d{2}:\d{2}$/.test(String(saved.start||''))?String(saved.start):nowText);
u.searchParams.set('minutes',String(mins));
u.searchParams.set('entry',entry);
u.searchParams.set('purple','1');
frame.addEventListener('load',()=>{patchStorage(frame.contentWindow);patchNavigation();setInterval(patchNavigation,900)});
frame.src=u.href;
})();
</script>
</body>
</html>

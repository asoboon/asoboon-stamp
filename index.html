<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#efe1bd">
  <title>ASOBooN</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#efe1bd}
    body{overflow:hidden}
  </style>
  <script>
  (() => {
    'use strict';

    const VALID_SPOTS = new Set(['spot_01','spot_02','spot_03','spot_04']);
    const direct = new URLSearchParams(location.search);

    function decodeRepeatedly(value){
      let out=String(value||'');
      for(let i=0;i<4;i+=1){
        try{
          const next=decodeURIComponent(out);
          if(next===out)break;
          out=next;
        }catch(_){break}
      }
      return out;
    }

    function parseRoute(value){
      const raw=decodeRepeatedly(value).trim();
      if(!raw)return {path:'',params:new URLSearchParams()};

      try{
        if(/^https?:\/\//i.test(raw)){
          const u=new URL(raw);
          return {
            path:u.pathname.replace(/^\/+/, ''),
            params:u.searchParams
          };
        }
      }catch(_){}

      const clean=raw.split('#')[0];
      const q=clean.indexOf('?');

      return {
        path:(q>=0?clean.slice(0,q):clean).replace(/^\/+/, ''),
        params:new URLSearchParams(q>=0?clean.slice(q+1):'')
      };
    }

    const state=parseRoute(direct.get('liff.state')||'');

    function read(name){
      return direct.get(name)||state.params.get(name)||'';
    }

    function go(path,params){
      const u=new URL(path,location.href);
      Object.entries(params||{}).forEach(([key,value])=>{
        if(value!==''&&value!=null){
          u.searchParams.set(key,String(value));
        }
      });
      location.replace(u.href);
    }

    const path=String(state.path||'').toLowerCase();

    const spotValue=String(read('spot')||'').trim();
    const spot=VALID_SPOTS.has(spotValue)?spotValue:'';
    const stampHome=read('stamp')==='home';

    // 独立機能は旧HOMEやスタンプを経由させず即時直行。
    if(path.endsWith('surprise-vote.html')){
      go('./surprise-vote.html',{
        v:read('v')||'20260928-13'
      });
      return;
    }

    if(path.endsWith('event-info.html')){
      go('./event-info.html',{
        v:read('v')||'20260928-13'
      });
      return;
    }

    // スタンプは必要な時だけ専用ページへ。
    if(path.endsWith('stamp.html')||spot||stampHome){
      go('./stamp.html',{
        spot:spot,
        stamp:stampHome?'home':''
      });
      return;
    }

    // home.html の追加パスにも対応。
    if(path.endsWith('home.html')){
      go('./home.html',{
        mode:read('mode'),
        view:read('view')
      });
      return;
    }

    // 通常起動は何も挟まずHOMEへ。
    go('./home.html',{
      mode:read('mode'),
      view:read('view')
    });
  })();
  </script>
</head>
<body></body>
</html>

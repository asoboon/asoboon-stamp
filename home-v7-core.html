<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#f4f0e7">
<title>ASOBooN｜公式LINEミニアプリ</title>
<style>
:root{--orange:#f08026;--blue:#3689cd;--green:#2c7a49;--road:#30363b;--road2:#444c52;--cream:#f4f0e7;--paper:#fbfaf7;--white:#fff;--ink:#22282d;--muted:#737b80;--line:#d9d4ca;--safe-top:max(12px,env(safe-area-inset-top));--safe-bottom:max(18px,env(safe-area-inset-bottom))}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}a{text-decoration:none;color:inherit}button,a{font:inherit;-webkit-tap-highlight-color:transparent}a:focus-visible,button:focus-visible{outline:3px solid #f4b258;outline-offset:3px}.app{width:min(100%,480px);margin:auto;padding:var(--safe-top) 14px calc(var(--safe-bottom) + 28px)}.header{min-height:53px;display:flex;align-items:center;gap:9px;padding:2px 2px 11px}.brand{font-size:1.3rem;font-weight:1000;letter-spacing:-.045em;cursor:default}.brand-note{color:#969087;font-size:.64rem;font-weight:800}.hero{position:relative;overflow:hidden;border-radius:25px;box-shadow:0 16px 34px rgba(30,36,40,.17)}.hero.waiting,.hero.calling{background:var(--road);color:#fff}.hero.none,.hero.guide,.hero.sync{background:var(--paper);color:var(--ink);border:1px solid rgba(70,74,76,.1)}.hero-inner{position:relative;padding:18px 17px 15px}.state-tag{display:inline-flex;min-height:26px;align-items:center;padding:0 9px;border-radius:999px;font-size:.69rem;font-weight:950;letter-spacing:.02em}.waiting .state-tag,.calling .state-tag{background:rgba(255,255,255,.12);color:#fff}.none .state-tag,.guide .state-tag,.sync .state-tag{background:#ece9e2;color:#596066}.wait-main{text-align:center;margin-top:11px}.wait-label{font-size:.78rem;color:rgba(255,255,255,.7);font-weight:900}.wait-count{display:flex;align-items:flex-end;justify-content:center;gap:6px;margin-top:-2px}.wait-count .num{font-size:6.55rem;line-height:.88;letter-spacing:-.09em;font-weight:1000;color:#fff;font-variant-numeric:tabular-nums}.wait-count .unit{padding-bottom:10px;font-size:1.12rem;font-weight:1000}.wait-message{margin-top:7px;font-size:.91rem;font-weight:950}.wait-note{margin-top:3px;font-size:.7rem;line-height:1.45;color:rgba(255,255,255,.67);font-weight:760}.waiting:before,.calling:before{content:"";position:absolute;inset:0;pointer-events:none}.prox-far:before{background:linear-gradient(135deg,rgba(255,255,255,.025),transparent 48%)}.prox-mid:before{background:radial-gradient(circle at 18% 84%,rgba(255,224,173,.11),transparent 22%)}.prox-near:before{background:radial-gradient(circle at 18% 84%,rgba(255,189,103,.18),transparent 24%),radial-gradient(circle at 86% 18%,rgba(255,255,255,.08),transparent 18%)}.prox-arrival:before{background:radial-gradient(circle at 14% 76%,rgba(255,161,70,.28),transparent 26%),radial-gradient(circle at 82% 18%,rgba(255,255,255,.1),transparent 18%)}.highway{position:relative;margin-top:15px;padding-top:30px}.exit-sign{position:absolute;left:8px;top:0;z-index:4;min-width:118px;padding:6px 10px 7px;border-radius:4px;border:2px solid #fff;outline:2px solid var(--green);background:var(--green);color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.17)}.exit-sign strong{display:block;font-size:.79rem;line-height:1.08}.exit-sign small{display:block;margin-top:2px;font-size:.62rem;font-weight:950}.road{position:relative;height:50px;overflow:hidden;border-radius:15px;background:#383f44;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}.road:before{content:"";position:absolute;left:13px;right:13px;top:50%;height:2px;transform:translateY(-50%);background:repeating-linear-gradient(90deg,#fff 0 15px,transparent 15px 29px);opacity:.73}.goal{position:absolute;left:8px;top:50%;width:29px;height:29px;transform:translateY(-50%);z-index:3;display:grid;place-items:center;border-radius:9px;background:#fff}.goal svg{width:18px;height:18px}.goal-glow{position:absolute;left:-8px;top:50%;width:72px;height:72px;transform:translateY(-50%);border-radius:50%;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(255,178,87,.28),rgba(255,178,87,0) 68%)}.prox-near .goal-glow{opacity:.45}.prox-arrival .goal-glow{opacity:.95}.car{position:absolute;right:var(--car-pos,7%);top:50%;width:49px;height:31px;transform:translateY(-50%);z-index:3;transition:right .48s ease}.car svg{display:block;width:100%;height:100%}.headlight{opacity:0}.prox-mid .headlight{opacity:.25}.prox-near .headlight{opacity:.7}.prox-arrival .headlight{opacity:1}.ticket{display:flex;align-items:center;justify-content:space-between;margin-top:10px;color:rgba(255,255,255,.66);font-size:.72rem;font-weight:800}.ticket strong{color:#fff;font-size:.96rem;font-variant-numeric:tabular-nums}.primary{min-height:50px;margin-top:12px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:.86rem;font-weight:1000}.waiting .primary,.calling .primary{background:#fff;color:var(--road)}.none .primary{background:var(--orange);color:#fff}.guide .primary{background:var(--green);color:#fff}.sync .primary{background:var(--road);color:#fff}.detail-link{min-height:39px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.7);font-size:.72rem;font-weight:850}.simple{padding:22px 19px 18px}.simple h1{margin:7px 0 5px;font-size:2rem;line-height:1.06;letter-spacing:-.05em}.simple p{margin:0;color:#626a70;font-size:.82rem;line-height:1.52;font-weight:760}.calling-title{margin-top:14px;text-align:center}.calling-title h1{margin:0;font-size:2.32rem;line-height:1.02;letter-spacing:-.055em}.calling-title p{margin:7px 0 0;color:rgba(255,255,255,.83);font-size:.8rem;font-weight:850}.guide-center{margin:18px 0 2px;text-align:center}.guide-center .big{font-size:2rem;line-height:1.08;font-weight:1000;letter-spacing:-.05em}.guide-center .sub{margin-top:7px;color:#61696e;font-size:.8rem;line-height:1.45;font-weight:820}.section{margin-top:21px}.section-title{margin:0 2px 9px;font-size:.98rem;font-weight:1000}.guide-list{overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.guide-row{position:relative;min-height:61px;display:grid;grid-template-columns:41px 1fr 20px;align-items:center;gap:10px;border-bottom:1px solid var(--line)}.guide-row:last-child{border-bottom:0}.guide-row:before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:3px;border-radius:999px;background:transparent}.guide-row.is-relevant:before{background:var(--green)}.guide-row.is-relevant .guide-copy strong{color:var(--green)}.guide-icon{width:37px;height:37px;display:grid;place-items:center;color:var(--road)}.guide-icon svg{width:23px;height:23px}.guide-copy strong{display:block;font-size:.84rem;line-height:1.15}.guide-copy small{display:block;margin-top:3px;color:var(--muted);font-size:.68rem;font-weight:700}.chip{display:inline-flex;margin-left:6px;padding:2px 6px;border-radius:999px;background:#e7f0ea;color:var(--green);font-size:.58rem;font-weight:950;vertical-align:1px}.chev{font-size:1.15rem;color:#9c978e;text-align:right}.more{min-height:45px;display:flex;align-items:center;justify-content:space-between;color:#666b6e;font-size:.75rem;font-weight:900}.play{margin-top:18px;padding:15px 0 0;border-top:1px solid var(--line)}.play-title{margin:0 2px;font-size:.94rem;font-weight:1000}.play-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.play-item{min-height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:15px;background:rgba(255,255,255,.54)}.play-icon{width:35px;height:35px;display:grid;place-items:center;color:var(--road)}.play-icon svg{width:22px;height:22px}.play-item strong{margin-top:6px;font-size:.7rem}.footer{margin-top:16px;text-align:center;color:#aaa397;font-size:.65rem}.probe{position:fixed;left:-9999px;top:0;width:2px;height:2px;opacity:0;pointer-events:none;border:0}@media(prefers-reduced-motion:reduce){.car{transition:none!important}}
</style>
</head>
<body>
<main class="app">
<header class="header"><div id="brandTap" class="brand">ASOBooN</div><div class="brand-note">川口ハイウェイオアシス</div></header>
<section id="hero" class="hero sync" aria-live="polite"></section>
<section class="section"><h2 class="section-title">ご案内</h2><nav id="guideList" class="guide-list" aria-label="ご案内"></nav><a class="more" href="./home.html?view=faq"><span>その他のご案内</span><span>›</span></a></section>
<section class="play"><h2 class="play-title">ASOBooNで遊ぶ</h2><div class="play-row">
<a class="play-item" href="./boonjump/"><span class="play-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M7 9h10l2 3v6H5v-6l2-3Z" stroke="currentColor" stroke-width="2"/><path d="M8 14h3M9.5 12.5v3M15.5 13.5h.01M17.5 15.5h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><strong>ミニゲーム</strong></a>
<a class="play-item" href="./omikuji.html"><span class="play-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M6 20h12M8 20V9h8v11M7 9h10l-1-4H8L7 9Z" stroke="currentColor" stroke-width="2"/><path d="M12 5V3" stroke="currentColor" stroke-width="2"/></svg></span><strong>おみくじ</strong></a>
<a class="play-item" href="./index.html?stamp=home"><span class="play-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M6 18h12M8 18v-4h8v4M9 14l1-7h4l1 7M9 7h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><strong>スタンプ</strong></a>
</div></section><div class="footer">ASOBooN Official LINE Mini App</div></main>
<iframe id="statusProbe" class="probe" src="./callstatus.html?homeprobe=v7" tabindex="-1" aria-hidden="true"></iframe>
<script>
(()=>{'use strict';
const hero=document.getElementById('hero'),guide=document.getElementById('guideList'),probe=document.getElementById('statusProbe');
const WEB='https://airwait.jp/WCSP/storeDetail?storeNo=AKR2298124918',CALL='./callstatus.html',CALL_KEY='asoboon_callstatus_number_v4';
const ITEMS=[['first','初めての方','利用の流れ','./home.html?view=guide','<circle cx="12" cy="8" r="3"/><path d="M6 20c.4-4 2.4-6 6-6s5.6 2 6 6"/>'],['price','料金','料金・支払い','./home.html?view=guide','<path d="M5 5h14v14H5zM8 9h8M8 13h8M8 17h5"/>'],['entry','入場・退場','再入場について','./setumei.html','<path d="M5 20V4h11v16M9 12h10M16 9l3 3-3 3"/>'],['rules','館内ルール','安全のための案内','./home.html?view=rules','<path d="M7 4h10v16H7zM9 9l1.5 1.5L14 7M9 15h6"/>']];
let lastState='',lastAhead=null,observer=null,firstWaitShown=false,taps=[];
const localDate=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function storedReceipt(){try{const x=JSON.parse(localStorage.getItem(CALL_KEY)||'null');if(x&&x.date===localDate()&&x.number)return String(x.number)}catch{}for(const k of ['asoboon_app_v2_current_reservation','asoboon_current_reservation_v3','asoboon_current_reservation_v2','asoboon_reservation_rc3_current_v1']){try{const x=JSON.parse(localStorage.getItem(k)||'null');const r=x?.reservation||x;if(r?.receiptNo&&(!r.operationalDate||String(r.operationalDate)===localDate()))return String(r.receiptNo)}catch{}}return''}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function prox(n){return n<=3?'arrival':n<=10?'near':n<=20?'mid':'far'}function msg(n){return n<=2?'もうすぐご案内です！':n<=5?'そろそろ準備しよう！':n<=10?'だんだん近づいてきました！':n<=20?'少しずつ順番が近づいています':'まだ少し時間があります'}function pos(n){return n<=0?76:n>=20?7:Math.round(7+(20-n)/20*69)}
function flag(){return '<svg viewBox="0 0 24 24" fill="none"><path d="M7 20V4M8 5h9l-2 3 2 3H8" stroke="#30363B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'}function car(){return '<svg viewBox="0 0 74 42" fill="none"><defs><radialGradient id="hl" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(8 25) rotate(180) scale(20 11)"><stop stop-color="#FFF3C8" stop-opacity=".95"/><stop offset="1" stop-color="#FFF3C8" stop-opacity="0"/></radialGradient></defs><path class="headlight" d="M11 20 0 16v18l12-5Z" fill="url(#hl)"/><path d="M14 29h5l5-13c1-3 4-5 7-5h15c3 0 6 1 8 4l6 9h4c3 0 4 2 4 5v3H14v-3Z" fill="#F8F8F6"/><path d="M28 14h18c2 0 4 1 5 3l4 6H22l4-7c.4-1 1-2 2-2Z" fill="#BFD6E2"/><circle cx="25" cy="31" r="5" fill="#1E252A"/><circle cx="56" cy="31" r="5" fill="#1E252A"/><circle cx="25" cy="31" r="2" fill="#B9C7CE"/><circle cx="56" cy="31" r="2" fill="#B9C7CE"/></svg>'}
function highway(n){return `<div class="highway" aria-hidden="true"><div class="exit-sign"><strong>ASOBooN</strong><small>出口 ←</small></div><div class="road"><span class="goal-glow"></span><span class="goal">${flag()}</span><span class="car" style="--car-pos:${pos(n)}%">${car()}</span></div></div>`}
function guides(relevant=''){guide.innerHTML=ITEMS.map(([k,l,s,h,i])=>`<a class="guide-row${k===relevant?' is-relevant':''}" href="${h}"><span class="guide-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${i}</svg></span><span class="guide-copy"><strong>${l}${k===relevant?'<span class="chip">いま使う</span>':''}</strong><small>${s}</small></span><span class="chev">›</span></a>`).join('')}
function none(){lastState='none';hero.className='hero none';hero.innerHTML=`<div class="simple"><span class="state-tag">受付前</span><h1>受付</h1><p>ASOBooNをご利用の方はこちらから受付してください。</p><a id="reservationQuickLink" class="primary" href="${WEB}" target="_top" rel="noopener noreferrer">受付する</a></div>`;guides()}
function sync(receipt=storedReceipt()){lastState='sync';hero.className='hero sync';hero.innerHTML=`<div class="simple"><span class="state-tag">確認中</span><h1>受付状況を確認しています</h1><p>${receipt?`受付番号 ${esc(receipt)} は確認できています。最新の呼出状況を取得しています。`:'最新の受付状況を確認しています。'}</p><a class="primary" href="${CALL}" target="_top">呼出状況を確認する</a></div>`;guides()}
function waiting(n,receipt){lastState='waiting';lastAhead=n;const p=prox(n),first=localStorage.getItem('asoboon_home_v7_wait_seen')!=='1';hero.className=`hero waiting prox-${p}`;hero.innerHTML=`<div class="hero-inner"><span class="state-tag">呼出待ち</span><div class="wait-main"><div class="wait-label">あなたの前</div><div class="wait-count"><span class="num">${n}</span><span class="unit">組</span></div><div class="wait-message">${msg(n)}</div>${first?'<div class="wait-note">順番になるとLINEでお知らせします。</div>':''}</div>${highway(n)}<div class="ticket"><span>受付番号</span><strong>${esc(receipt||'--')}</strong></div><a id="callStatusLink" class="primary" href="${CALL}" target="_top">呼出状況を見る</a><a class="detail-link" href="${CALL}" target="_top">受付詳細 ›</a></div>`;if(first){localStorage.setItem('asoboon_home_v7_wait_seen','1');firstWaitShown=true}guides()}
function calling(receipt){lastState='calling';hero.className='hero calling prox-arrival';hero.innerHTML=`<div class="hero-inner"><span class="state-tag">ただいま呼出中</span><div class="calling-title"><h1>入場できます！</h1><p>ASOBooN入口へお越しください。</p></div>${highway(0)}<div class="ticket"><span>受付番号</span><strong>${esc(receipt||'--')}</strong></div><a class="primary" href="${CALL}" target="_top">受付番号を表示する</a></div>`;guides('entry')}
function guided(title='ご案内中',instruction='スタッフの案内に従ってください。'){lastState='guide';hero.className='hero guide';hero.innerHTML=`<div class="simple"><span class="state-tag">ご案内中</span><div class="guide-center"><div class="big">${esc(title)}</div><div class="sub">${esc(instruction)}</div></div><a class="primary" href="./setumei.html" target="_top">入場・退場の案内を見る</a></div>`;guides('entry')}
function readCore(){try{const od=probe.contentDocument,inner=od?.getElementById('statusFrame'),d=inner?.contentDocument;if(!d)return;const personal=d.getElementById('personalSection'),receipt=d.getElementById('bigNumber')?.textContent?.trim()||storedReceipt(),title=d.getElementById('statusTitle')?.textContent?.trim()||'',instruction=d.getElementById('statusInstruction')?.textContent?.trim()||'',aText=d.getElementById('aheadCount')?.textContent?.trim()||'',ahead=/^\d+$/.test(aText)?Number(aText):NaN;if(!personal||personal.hidden){if(receipt)sync(receipt);else none();return}if(/入場可能/.test(title)){calling(receipt);return}if(/取消|キャンセル/.test(title)){none();return}if(/受付中|ご案内済|保留|期限/.test(title)){guided(title,instruction);return}if(Number.isFinite(ahead)){waiting(ahead,receipt);return}if(receipt)sync(receipt);else none()}catch(e){if(storedReceipt())sync();else none()}}
function bindProbe(){try{const od=probe.contentDocument,inner=od?.getElementById('statusFrame');if(!inner){setTimeout(bindProbe,500);return}const attach=()=>{try{observer?.disconnect();const d=inner.contentDocument;if(!d?.body){setTimeout(attach,400);return}observer=new MutationObserver(()=>readCore());observer.observe(d.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['hidden','class']});readCore()}catch{}};inner.addEventListener('load',attach);attach()}catch{setTimeout(bindProbe,700)}}
probe.addEventListener('load',bindProbe);sync();setInterval(readCore,2500);document.addEventListener('visibilitychange',()=>{if(!document.hidden)readCore()});window.addEventListener('focus',readCore);
document.getElementById('brandTap').addEventListener('click',()=>{const now=Date.now();taps=taps.filter(t=>now-t<4000);taps.push(now);if(taps.length>=7){taps=[];top.location.href='./admin.html?v=20260905-6'}});
})();
</script>
</body>
</html>

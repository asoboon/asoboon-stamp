name: develop-notification-terminal-rescue-once

on:
  push:
    paths:
      - '.github/workflows/develop-notification-terminal-rescue-once.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Developing notification rescue
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('miniapp-v2/backend/develop-service-message.js')
          s = p.read_text(encoding='utf-8')
          def rep(old,new,count=1):
              global s
              if s.count(old) != count:
                  raise SystemExit(f'expected {count} occurrence(s), got {s.count(old)}: {old[:120]}')
              s = s.replace(old,new)

          rep("VERSION: '2.2.dev5'", "VERSION: '2.3.dev6'")
          rep("    serviceMessageImmediateObservationEnabled: true,\n    serviceMessageReusableUnboundToken: true,",
              "    serviceMessageImmediateObservationEnabled: true,\n    serviceMessageTerminalRescueEnabled: true,\n    serviceMessageReusableUnboundToken: true,")

          old = """  const calling = observation?.isCalling === true || String(observation?.isCalling || '') === '1';\n  if (!businessDate || !receiptNo || String(observation?.status || '') !== '0' || !calling) {\n    return { ok:true, sent:false, reason:'NOT_CALLING', version:SM.VERSION };\n  }"""
          new = """  if (!businessDate || !receiptNo || !isNotificationEligibleAirwait(observation)) {\n    return { ok:true, sent:false, reason:'NOT_NOTIFICATION_ELIGIBLE', version:SM.VERSION };\n  }"""
          rep(old,new)

          old = """    status:'0',\n    isCalling:'1',"""
          new = """    status:String(observation?.status || ''),\n    isCalling:String(observation?.isCalling === true ? '1' : observation?.isCalling || '0'),"""
          rep(old,new)

          old = """    const own = match.row;\n    const retryEvidence = String(rec.status || '') === 'CALL_SEND_RETRY';\n    const callingNow = Boolean(own && String(own.status || '') === '0' && String(own.isCalling || '0') === '1');\n    if (!callingNow && !retryEvidence) continue;"""
          new = """    const own = match.row;\n    const retryEvidence = String(rec.status || '') === 'CALL_SEND_RETRY';\n    const notificationEligible = Boolean(own && isNotificationEligibleAirwait(own));\n    if (!notificationEligible && !retryEvidence) continue;"""
          rep(old,new)

          old = """  const claimed = await env.DB.prepare(`UPDATE v2_service_messages SET status='CALL_SEND_PENDING',last_error='',last_http_status=0,updated_at=?\n    WHERE business_date=? AND reserve_id=? AND notified_at=0\n      AND status IN ('TOKEN_READY','CALL_SEND_RETRY','TEMPLATE_NOT_CONFIGURED','CHANNEL_SECRET_MISSING')`)\n    .bind(Date.now(), rec.business_date, rec.reserve_id).run();"""
          new = """  const claimNow = Date.now();\n  const claimed = await env.DB.prepare(`UPDATE v2_service_messages SET status='CALL_SEND_PENDING',last_error='',last_http_status=0,updated_at=?\n    WHERE business_date=? AND reserve_id=? AND notified_at=0\n      AND status IN ('TOKEN_READY','CALL_SEND_RETRY','TEMPLATE_NOT_CONFIGURED','CHANNEL_SECRET_MISSING')\n      AND (next_retry_at=0 OR next_retry_at<=?)`)\n    .bind(claimNow, rec.business_date, rec.reserve_id, claimNow).run();"""
          rep(old,new)

          anchor = "function assertServiceConfig(env){"
          if s.count(anchor) != 1:
              raise SystemExit('assertServiceConfig anchor mismatch')
          helper = """function isNotificationEligibleAirwait(row){\n  const status=String(row?.status||'');\n  const calling=row?.isCalling===true||String(row?.isCalling||'0')==='1';\n  return (status==='0'&&calling)||status==='2'||status==='4';\n}\n\n"""
          s = s.replace(anchor, helper + anchor)
          p.write_text(s, encoding='utf-8')

          p = Path('miniapp-v2/backend/develop-worker.mjs')
          s = p.read_text(encoding='utf-8')
          old = """    if (!(body?.ok === true && body?.found === true && String(body?.status || '') === '0' && body?.isCalling === true)) return;\n    await sendObservedCallNotification(env, body);"""
          new = """    if (!(body?.ok === true && body?.found === true)) return;\n    await sendObservedCallNotification(env, body);"""
          if s.count(old) != 1:
              raise SystemExit('worker immediate notification gate mismatch')
          s = s.replace(old,new)
          p.write_text(s, encoding='utf-8')
          PY

          node --check miniapp-v2/backend/develop-service-message.js
          node --check miniapp-v2/backend/develop-worker.mjs

      - name: Verify notification policy and retry gate
        run: |
          set -euo pipefail
          grep -F "VERSION: '2.3.dev6'" miniapp-v2/backend/develop-service-message.js
          grep -F 'serviceMessageTerminalRescueEnabled: true' miniapp-v2/backend/develop-service-message.js
          grep -F "return (status==='0'&&calling)||status==='2'||status==='4';" miniapp-v2/backend/develop-service-message.js
          grep -F "reason:'NOT_NOTIFICATION_ELIGIBLE'" miniapp-v2/backend/develop-service-message.js
          grep -F 'notificationEligible = Boolean(own && isNotificationEligibleAirwait(own))' miniapp-v2/backend/develop-service-message.js
          grep -F 'AND (next_retry_at=0 OR next_retry_at<=?)' miniapp-v2/backend/develop-service-message.js
          grep -F "if (!(body?.ok === true && body?.found === true)) return;" miniapp-v2/backend/develop-worker.mjs
          ! grep -Fq "String(body?.status || '') === '0' && body?.isCalling === true" miniapp-v2/backend/develop-worker.mjs
          node <<'NODE'
          const eligible=(row)=>{const status=String(row?.status||'');const calling=row?.isCalling===true||String(row?.isCalling||'0')==='1';return (status==='0'&&calling)||status==='2'||status==='4'};
          const yes=[{status:'0',isCalling:'1'},{status:'0',isCalling:true},{status:'2',isCalling:'0'},{status:'4',isCalling:'0'}];
          const no=[{status:'0',isCalling:'0'},{status:'1',isCalling:'0'},{status:'1',isCalling:'1'},{status:'3',isCalling:'0'},{status:'3',isCalling:'1'},{status:'',isCalling:'1'}];
          for(const x of yes) if(!eligible(x)) throw new Error('must notify '+JSON.stringify(x));
          for(const x of no) if(eligible(x)) throw new Error('must not notify '+JSON.stringify(x));
          NODE

      - name: Commit Developing source only
        run: |
          set -euo pipefail
          git config user.name 'asoboon'
          git config user.email 'asoboon425@gmail.com'
          git add miniapp-v2/backend/develop-service-message.js miniapp-v2/backend/develop-worker.mjs
          git diff --cached --check
          git commit -m 'fix: rescue LINE notification after immediate guidance'
          git push origin HEAD:main

name: purple-verify
on:
  push:
    paths:
      - 'purple-*.html'
      - 'purple-*.js'
      - 'staff-test-home.html'
      - 'admin.html'
      - 'app/backend/ASOBooN_PURPLE_GATEWAY_V2_Code.gs'
      - 'app/backend/ASOBooN_PURPLE_GATEWAY_V21_MarkerPatch.gs'
      - '.github/workflows/purple-verify.yml'
  pull_request:
    paths:
      - 'purple-*.html'
      - 'purple-*.js'
      - 'staff-test-home.html'
      - 'admin.html'
      - 'app/backend/ASOBooN_PURPLE_GATEWAY_V2_Code.gs'
      - 'app/backend/ASOBooN_PURPLE_GATEWAY_V21_MarkerPatch.gs'
      - '.github/workflows/purple-verify.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Purple isolation and safety rules
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys

          purple = [p for p in Path('.').glob('purple-*') if p.is_file()]
          purple += [Path('staff-test-home.html')]
          errors = []

          forbidden = {
              'production call-status storage': 'asoboon_callstatus_number_v4',
              'production time-guide storage': 'asoboon-adventure-time',
              'legacy production LIFF id': '2009888671-57TOefc3',
          }
          for p in purple:
              text = p.read_text(errors='ignore')
              for label, token in forbidden.items():
                  if token in text:
                      errors.append(f'{p}: contains {label}: {token}')
              if re.search(r'airwaitApiKey\s*[:=]', text, re.I):
                  errors.append(f'{p}: browser-side AirWAIT API key field is forbidden')
              if re.search(r'\blYwyf5yYCOSpQjg9xAJ9Fp80phVvYDHI\b', text):
                  errors.append(f'{p}: known AirWAIT API key literal is forbidden')

          call = Path('purple-callstatus.html').read_text(errors='ignore')
          time = Path('purple-timeguide.html').read_text(errors='ignore')
          home = Path('staff-test-home.html').read_text(errors='ignore')
          config = Path('purple-service-config.js').read_text(errors='ignore')
          backend = Path('app/backend/ASOBooN_PURPLE_GATEWAY_V2_Code.gs').read_text(errors='ignore')
          marker_patch = Path('app/backend/ASOBooN_PURPLE_GATEWAY_V21_MarkerPatch.gs').read_text(errors='ignore')
          setup = Path('purple-service-setup.html').read_text(errors='ignore')
          line_link = Path('purple-line-link.html').read_text(errors='ignore')
          reserve = Path('purple-reserve-v5.html').read_text(errors='ignore')

          if 'callstatus-core.html' in call:
              errors.append('purple-callstatus.html must not wrap production callstatus-core.html')
          if "new URL('./timeguide.html'" in time or 'src=\"./timeguide.html' in time:
              errors.append('purple-timeguide.html must not wrap production timeguide.html')
          if 'asoboon_purple_callstatus_number_v2' not in call:
              errors.append('purple call-status v2 storage key missing')
          if 'asoboon_purple_adventure_time_v2' not in time:
              errors.append('purple time-guide v2 storage key missing')
          if 'purple-reserve-v5.html' not in home or 'method=web' not in home:
              errors.append('purple HOME WEB reservation must pass through purple-reserve-v5 method=web')
          if 'purple-callstatus.html' not in home:
              errors.append('purple HOME call-status route is missing')
          if "backendConfigKey:BACKEND_KEY" not in config or "backendVersionPrefix:'2.1.'" not in config:
              errors.append('purple-service-config.js must require hardened gateway v2.1')
          if 'auto-bridge.js' in line_link or 'autoBindingApiUrl' in line_link or 'BRIDGE.queue' in line_link:
              errors.append('purple-line-link.html still contains executable legacy LINE auto-bridge flow')
          if 'purple-service-register.html' not in line_link:
              errors.append('purple-line-link.html must redirect to purple-service-register.html')

          required_backend = [
              'getLastUpdDateStateless', 'TOKEN_ISSUE_PENDING', 'TOKEN_ISSUE_AMBIGUOUS',
              'liffTokenHash', 'CALL_SEND_AMBIGUOUS',
              'AIRWAIT_CREATE_NETWORK_AMBIGUOUS_MANUAL_REVIEW',
              'paidChildren < 0', 'infants < 0'
          ]
          for token in required_backend:
              if token not in backend:
                  errors.append(f'gateway v2.1 safety token missing: {token}')
          if 'AIRWAIT_API_KEY' not in backend or 'PURPLE_LINE_MINIAPP_CHANNEL_SECRET' not in backend:
              errors.append('gateway required Script Property names are missing')
          if re.search(r'AIRWAIT_API_KEY\s*[:=]\s*[\'\"][A-Za-z0-9_-]{16,}', backend):
              errors.append('gateway contains a hard-coded AirWAIT key')

          if 'PG21_WORKER_MARKER_PROP' not in marker_patch or 'PURPLE_V21_WORKER_LAST_MARKER' not in marker_patch:
              errors.append('notification worker must have its own AirWAIT update marker')
          if "h === 'purpleGatewayWorkerV2' || h === 'purpleGatewayWorkerV21'" not in marker_patch:
              errors.append('v2.1 setup must remove the old shared-marker worker trigger')
          if "newTrigger('purpleGatewayWorkerV21')" not in marker_patch:
              errors.append('v2.1 setup must install the marker-isolated worker')
          if 'setupPurpleGatewayV21()' not in setup:
              errors.append('staff setup page must instruct setupPurpleGatewayV21()')

          if 'PURPLE_BACKEND_RESULT_UNKNOWN' not in reserve or 'lockAmbiguous' not in reserve:
              errors.append('reservation UI must fail closed on ambiguous create result')

          for name in ['purple-reserve.html','purple-reserve-v2.html','purple-reserve-v3.html','purple-reserve-v4.html']:
              t = Path(name).read_text(errors='ignore')
              if 'purple-reserve-v5.html' not in t:
                  errors.append(f'{name}: stale entry point does not redirect to v5')
              if 'purple-line-link' in t or 'createReservation({' in t:
                  errors.append(f'{name}: stale executable reservation/LINE flow remains')

          if errors:
              print('PURPLE VERIFY FAILED')
              for e in errors:
                  print('-', e)
              sys.exit(1)
          print('Purple isolation and safety rules passed.')
          PY

      - name: Client JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, sys
          files = [
            'purple-service-config.js', 'purple-reserve-v5.html', 'purple-callstatus.html',
            'purple-timeguide.html', 'purple-service-register.html', 'purple-service-setup.html',
            'purple-line-link.html', 'staff-test-home.html'
          ]
          failed=[]
          for name in files:
              text=Path(name).read_text(errors='ignore')
              scripts=[text] if name.endswith('.js') else re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>', text, flags=re.I)
              for i,code in enumerate(scripts):
                  with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False) as f:
                      f.write(code); tmp=f.name
                  r=subprocess.run(['node','--check',tmp],capture_output=True,text=True)
                  if r.returncode:
                      failed.append(f'{name} script#{i+1}: {r.stderr.strip()}')
          if failed:
              print('\n'.join(failed)); sys.exit(1)
          print('Purple client JavaScript syntax passed.')
          PY

      - name: Apps Script syntax
        run: |
          cat app/backend/ASOBooN_PURPLE_GATEWAY_V2_Code.gs app/backend/ASOBooN_PURPLE_GATEWAY_V21_MarkerPatch.gs > /tmp/purple-gateway-v21.js
          node --check /tmp/purple-gateway-v21.js

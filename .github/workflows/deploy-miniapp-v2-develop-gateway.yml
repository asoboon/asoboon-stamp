name: deploy-miniapp-v2-develop-gateway

on:
  workflow_dispatch:
  push:
    paths:
      - 'miniapp-v2/backend/develop-gateway.js'
      - '.github/workflows/deploy-miniapp-v2-develop-gateway.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 7bb41607cf8c1585e9cf166d1609f8c1
      WORKER_NAME: asoboon-miniapp-v2-develop-gateway
      DB_NAME: asoboon-miniapp-v2-develop-db
      WORKER_URL: https://asoboon-miniapp-v2-develop-gateway.asoboon425.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Detect Cloudflare deployment credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN is not configured. Deployment was safely skipped."
          fi

      - name: Set up Node
        if: steps.credentials.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ensure dedicated Developing D1 database
        if: steps.credentials.outputs.available == 'true'
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          LIST_JSON="$(curl --fail-with-body --silent --show-error -H "$AUTH" "$API?per_page=100")"
          DB_ID="$(printf '%s' "$LIST_JSON" | node -e '
            let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
              const x=JSON.parse(s);
              if(x.success!==true) process.exit(2);
              const rows=Array.isArray(x.result)?x.result:[];
              const r=rows.find(v=>v && v.name===process.env.DB_NAME);
              process.stdout.write(r ? String(r.uuid||"") : "");
            });
          ')"

          if [ -z "$DB_ID" ]; then
            CREATE_JSON="$(curl --fail-with-body --silent --show-error \
              -X POST \
              -H "$AUTH" \
              -H 'Content-Type: application/json' \
              --data "{\"name\":\"${DB_NAME}\"}" \
              "$API")"
            DB_ID="$(printf '%s' "$CREATE_JSON" | node -e '
              let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
                const x=JSON.parse(s);
                if(x.success!==true) process.exit(2);
                process.stdout.write(String(x.result?.uuid||""));
              });
            ')"
          fi

          if [ -z "$DB_ID" ]; then
            echo "Could not resolve D1 database id" >&2
            exit 1
          fi
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"
          echo "Dedicated D1 ready: $DB_NAME"

      - name: Build temporary Wrangler config
        if: steps.credentials.outputs.available == 'true'
        env:
          DB_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          set -euo pipefail
          cat > ./wrangler-v2-develop.tmp.jsonc <<EOF
          {
            "name": "$WORKER_NAME",
            "main": "miniapp-v2/backend/develop-gateway.js",
            "compatibility_date": "2026-09-11",
            "workers_dev": true,
            "vars": {
              "CREATE_ENABLED": "1"
            },
            "d1_databases": [
              {
                "binding": "DB",
                "database_name": "$DB_NAME",
                "database_id": "$DB_ID"
              }
            ]
          }
          EOF

      - name: Deploy Developing gateway with controlled create enabled
        if: steps.credentials.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config ./wrangler-v2-develop.tmp.jsonc

      - name: Remind that AirWAIT secret stays Cloudflare-only
        if: steps.credentials.outputs.available == 'true'
        run: |
          echo "AIRWAIT_API_KEY is intentionally NOT read from GitHub."
          echo "It must exist only as the Cloudflare Worker Secret named AIRWAIT_API_KEY."

      - name: Health check and assert Developing create gate
        if: steps.credentials.outputs.available == 'true'
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            RESPONSE="$(curl --fail --silent --show-error \
              -H 'Origin: https://asoboon.github.io' \
              "$WORKER_URL/?action=health" || true)"
            if [ -n "$RESPONSE" ] && printf '%s' "$RESPONSE" | node -e '
              let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
                const x=JSON.parse(s);
                if(x.ok!==true || x.environment!=="official-develop" || x.createEnabled!==true || x.airwaitKeyConfigured!==true) process.exit(1);
              });
            '; then
              echo "$RESPONSE"
              break
            fi
            if [ "$i" = "5" ]; then exit 1; fi
            sleep 3
          done

      - name: Verify AirWAIT wait types read-only
        if: steps.credentials.outputs.available == 'true'
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            -H 'Origin: https://asoboon.github.io' \
            "$WORKER_URL/?action=waitTypes")"
          printf '%s' "$RESPONSE" | node -e '
            let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
              const x=JSON.parse(s);
              if(x.ok!==true || !Array.isArray(x.waitTypes) || x.waitTypes.length===0){
                console.error("AirWAIT waitTypes verification failed");
                process.exit(1);
              }
              console.log(`AirWAIT waitTypes read-only check passed: ${x.waitTypes.length} types`);
              for(const w of x.waitTypes){
                console.log(`WAIT_TYPE id=${w.waitTypeId} name=${JSON.stringify(w.waitTypeName)} disp=${w.dispFlg} usage=${w.usageDispType}`);
              }
            });
          '

      - name: Deployment status
        if: always()
        run: |
          if [ "${{ steps.credentials.outputs.available }}" = "true" ]; then
            echo "Official Developing gateway deployment path executed with CREATE_ENABLED=1 for controlled test only."
          else
            echo "Cloudflare deployment safely skipped; no production or Review resources were touched."
          fi

# Official Developing only. Review/Published are intentionally untouched.
# Cloudflare D1 bootstrap uses the REST API; AirWAIT secret remains Cloudflare-only.

name: deploy-miniapp-v2-production-gateway

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miniapp-v2-production-gateway
  cancel-in-progress: false

jobs:
  deploy-dark:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: 7bb41607cf8c1585e9cf166d1609f8c1
      WORKER_NAME: asoboon-miniapp-v2-production-gateway
      DB_NAME: asoboon-miniapp-v2-production-db
      WORKER_URL: https://asoboon-miniapp-v2-production-gateway.asoboon425.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Require main branch
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"

      - name: Detect Cloudflare deployment credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::error::CLOUDFLARE_API_TOKEN is required for Production deployment."
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: steps.credentials.outputs.available == 'true'
        with:
          node-version: '22'

      - name: Production security gates
        if: steps.credentials.outputs.available == 'true'
        run: |
          set -euo pipefail
          node --input-type=module --check < miniapp-v2/backend/production-gateway.js
          node --input-type=module --check < miniapp-v2/backend/production-worker.mjs
          node --input-type=module --check < miniapp-v2/backend/production-service-message.js
          node --test tests/asoboon-production-security.test.mjs tests/asoboon-production-worker-security.test.mjs tests/asoboon-production-api-contract.test.mjs
          grep -F 'createReservation:300' miniapp-v2/backend/production-worker.mjs
          grep -F 'AIRWAIT_CREATE_STORENO_TIMEOUT' miniapp-v2/backend/production-gateway.js
          grep -F 'AIRWAIT_OFFICIAL_RESERVATIONS_TIMEOUT' miniapp-v2/backend/production-gateway.js
          grep -F "PRODUCTION_CREATE_ARMED: false" miniapp-v2/backend/production-gateway.js
          grep -F "backendUrl:''" miniapp-v2/production/env.js
          grep -F "receptionCreate:false" miniapp-v2/production/env.js
          ! grep -R -n -F '_develop_v1' miniapp-v2/production miniapp-v2/backend/production-gateway.js miniapp-v2/backend/production-worker.mjs miniapp-v2/backend/production-service-message.js
          ! grep -R -n -F '2009884611' miniapp-v2/production miniapp-v2/backend/production-gateway.js miniapp-v2/backend/production-worker.mjs miniapp-v2/backend/production-service-message.js
          ! grep -R -n -F '2009884612' miniapp-v2/production miniapp-v2/backend/production-gateway.js miniapp-v2/backend/production-worker.mjs miniapp-v2/backend/production-service-message.js
          ! grep -R -n -F 'asoboon-miniapp-v2-develop-gateway' miniapp-v2/production miniapp-v2/backend/production-gateway.js miniapp-v2/backend/production-worker.mjs miniapp-v2/backend/production-service-message.js
          ! grep -R -n -E "DEVELOP_TEST|['\"]0042['\"]" miniapp-v2/backend/production-gateway.js miniapp-v2/backend/production-worker.mjs miniapp-v2/backend/production-service-message.js
          ! grep -R -n -F 'corWclpKeyCd' miniapp-v2/production miniapp-v2/shared

      - name: Install Production browser test dependencies
        if: steps.credentials.outputs.available == 'true'
        run: npm ci

      - name: Install Chromium for Production E2E
        if: steps.credentials.outputs.available == 'true'
        run: npx playwright install --with-deps chromium

      - name: Production browser E2E before deploy
        if: steps.credentials.outputs.available == 'true'
        run: npm run test:miniapp-production

      - name: Ensure dedicated Production D1 database
        if: steps.credentials.outputs.available == 'true'
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          LIST_JSON="$(curl --fail-with-body --silent --show-error -H "$AUTH" "$API?per_page=100")"
          DB_ID="$(printf '%s' "$LIST_JSON" | node -e '
            let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
              const x=JSON.parse(s);
              if(x.success!==true) process.exit(2);
              const rows=Array.isArray(x.result)?x.result:[];
              const r=rows.find(v=>v && v.name===process.env.DB_NAME);
              process.stdout.write(r ? String(r.uuid||"") : "");
            });
          ')"
          if [ -z "$DB_ID" ]; then
            CREATE_JSON="$(curl --fail-with-body --silent --show-error               -X POST -H "$AUTH" -H 'Content-Type: application/json'               --data "{\"name\":\"${DB_NAME}\"}" "$API")"
            DB_ID="$(printf '%s' "$CREATE_JSON" | node -e '
              let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
                const x=JSON.parse(s);
                if(x.success!==true) process.exit(2);
                process.stdout.write(String(x.result?.uuid||""));
              });
            ')"
          fi
          test -n "$DB_ID"
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"
          echo "Dedicated Production D1 ready: $DB_NAME"

      - name: Build locked Production Wrangler config
        if: steps.credentials.outputs.available == 'true'
        env:
          DB_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          set -euo pipefail
          cat > ./wrangler-v2-production.tmp.jsonc <<EOF
          {
            "name": "$WORKER_NAME",
            "main": "./miniapp-v2/backend/production-worker.mjs",
            "compatibility_date": "2026-09-11",
            "workers_dev": true,
            "keep_vars": true,
            "triggers": { "crons": ["* * * * *"] },
            "vars": {
              "CREATE_ENABLED": "0",
              "SERVICE_MESSAGE_TEMPLATE_NAME": "yourturn_s_w_ja",
              "SERVICE_MESSAGE_TEMPLATE_PARAMS_JSON": "{\"turn\":\"{{receiptNo}}\",\"btn1_url\":\"{{callstatusUrl}}\",\"btn2_url\":\"https://miniapp.line.me/2009884613-ELc6kolf?view=entry\"}",
              "SERVICE_MESSAGE_CONFIRM_TEMPLATE_NAME": "waiting_req_d_w_ja",
              "SERVICE_MESSAGE_CONFIRM_TEMPLATE_PARAMS_JSON": "{\"date\":\"{{businessDate}}\",\"count\":\"{{totalPeople}}人\",\"detail\":\"{{slotLabel}}\",\"number\":\"{{receiptNo}}\",\"btn1_url\":\"{{callstatusUrl}}\",\"btn3_url\":\"{{callstatusUrl}}\",\"btn4_url\":\"{{callstatusUrl}}\",\"shop_name\":\"ASOBooN\"}",
              "SERVICE_MESSAGE_CANCEL_TEMPLATE_NAME": "user_cancle_s_ja",
              "SERVICE_MESSAGE_CANCEL_TEMPLATE_PARAMS_JSON": "{\"number\":\"{{receiptNo}}\",\"btn1_url\":\"{{callstatusUrl}}\"}",
              "SERVICE_MESSAGE_AUTO_CANCEL_TEMPLATE_NAME": "auto_cancel_d_ja",
              "SERVICE_MESSAGE_AUTO_CANCEL_TEMPLATE_PARAMS_JSON": "{\"date\":\"{{businessDate}}\",\"detail\":\"{{slotLabel}}\",\"number\":\"{{receiptNo}}\",\"shop_name\":\"ASOBooN\",\"cancel_reason\":\"{{cancelReason}}\",\"btn1_url\":\"{{callstatusUrl}}\"}"
            },
            "d1_databases": [
              {
                "binding": "DB",
                "database_name": "$DB_NAME",
                "database_id": "$DB_ID"
              }
            ]
          }
          EOF
          grep -F '"CREATE_ENABLED": "0"' ./wrangler-v2-production.tmp.jsonc
          ! grep -Fq '"CREATE_ENABLED": "1"' ./wrangler-v2-production.tmp.jsonc

      - name: Deploy locked Production gateway
        if: steps.credentials.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.145.0 deploy --config ./wrangler-v2-production.tmp.jsonc

      - name: Verify Production dark health
        if: steps.credentials.outputs.available == 'true'
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6 7 8; do
            RESPONSE="$(curl --fail --silent --show-error               -H 'Origin: https://asoboon.github.io'               "$WORKER_URL/?action=health&_=${GITHUB_SHA}-${i}" || true)"
            if [ -n "$RESPONSE" ] && printf '%s' "$RESPONSE" | node -e '
              let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                const x=JSON.parse(s);
                if(
                  x.ok!==true ||
                  x.version!=="3.0.prod-complete-dark" ||
                  x.environment!=="official-production" ||
                  x.officialProductionEnabled!==true ||
                  x.productionCreateArmed!==false ||
                  x.createEnabled!==false ||
                  x.createRequiresVerifiedLiff!==true ||
                  !Array.isArray(x.acceptedClientIds) ||
                  !x.acceptedClientIds.includes("2009884613") ||
                  x.lineReceptionOpen!=="09:25" ||
                  x.lineReceptionUsesStoreOnly!==true ||
                  x.operationalCutoffHour!==19 ||
                  x.serviceMessageEnabled!==true ||
                  x.serviceMessageMandatoryBeforeCreate!==true ||
                  x.nativeCancelEnabled!==true ||
                  !Array.isArray(x.apiActions) ||
                  !["crowdRemaining","businessDay","reservationStatus","recoverReservationSession","cancelReservation","surpriseVotePublicStatus","createReservation","requestStatus"].every(v=>x.apiActions.includes(v)) ||
                  !Array.isArray(x.rateLimitScopes) ||
                  !x.rateLimitScopes.includes("create") ||
                  !x.rateLimitScopes.includes("reservationStatus") ||
                  !x.rateLimitScopes.includes("cancelReservation")
                ) process.exit(1);
              });
            '; then
              echo "$RESPONSE"
              echo "Production dark Worker is live with reception creation locked."
              exit 0
            fi
            sleep 3
          done
          echo "Production dark Worker health check failed." >&2
          exit 1

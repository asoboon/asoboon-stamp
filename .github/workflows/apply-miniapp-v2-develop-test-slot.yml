name: apply-miniapp-v2-develop-test-slot

on:
  push:
    paths:
      - '.github/workflows/apply-miniapp-v2-develop-test-slot.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply isolated Developing test-slot support
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {n}: {old[:80]!r}')
              p.write_text(s.replace(old, new, 1))

          backend = 'miniapp-v2/backend/develop-gateway.js'
          replace_once(backend,
              "  VERSION: '1.0.dev1',",
              "  VERSION: '1.1.dev-test-slot',")
          replace_once(backend,
              "  ONSITE_OPEN_MIN: 9 * 60 + 30,",
              "  ONSITE_OPEN_MIN: 9 * 60 + 30,\n  DEVELOP_TEST_WAIT_TYPE_ID: '0042',")
          replace_once(backend,
              "    createEnabled: String(env.CREATE_ENABLED || '0') === '1',",
              "    createEnabled: String(env.CREATE_ENABLED || '0') === '1',\n    developTestWaitTypeId: CFG.DEVELOP_TEST_WAIT_TYPE_ID,")
          replace_once(backend,
              "function enforceReceptionHours(day, mode) {\n  if (day.isClosed) throw apiError('CLOSED_DAY', 400);",
              "function enforceReceptionHours(day, mode, waitTypeId) {\n  // Official Developing only: AirWAIT local test slot 0042 may be exercised outside normal hours.\n  if (waitTypeId === CFG.DEVELOP_TEST_WAIT_TYPE_ID) return;\n  if (day.isClosed) throw apiError('CLOSED_DAY', 400);")
          old_validate = """function validateWaitType(waitTypes, day, mode, waitTypeId) {
  const allowed = SLOT_RULES[day.businessType] || [];
  if (!allowed.includes(waitTypeId)) throw apiError('WAIT_TYPE_NOT_ALLOWED_FOR_DAY', 400);
  const w = waitTypes.find(x => x.waitTypeId === waitTypeId);
  if (!w || w.dispFlg === false) throw apiError('WAIT_TYPE_NOT_AVAILABLE', 400);
  const usage = String(w.usageDispType || '');
  if (usage) {
    const allowedUsage = mode === 'web' ? ['01', '03'] : ['01', '02'];
    if (!allowedUsage.includes(usage)) throw apiError('WAIT_TYPE_MODE_MISMATCH', 400);
  }
  return w;
}"""
          new_validate = """function isStoreReceptionUsage(usage) {
  const u = String(usage || '');
  return !u || ['01', '02', 'KeyALL', 'KeySTORE_RECEPTION_ONLY'].includes(u);
}

function validateWaitType(waitTypes, day, mode, waitTypeId) {
  const isDevelopTest = waitTypeId === CFG.DEVELOP_TEST_WAIT_TYPE_ID;
  const allowed = SLOT_RULES[day.businessType] || [];
  if (!isDevelopTest && !allowed.includes(waitTypeId)) throw apiError('WAIT_TYPE_NOT_ALLOWED_FOR_DAY', 400);
  const w = waitTypes.find(x => x.waitTypeId === waitTypeId);
  if (!w) throw apiError('WAIT_TYPE_NOT_AVAILABLE', 400);
  // Normal LINE MINI App reception intentionally reuses AirWAIT in-store wait types.
  // The Developing test slot may be hidden in AirWAIT (dispFlg=false) and is still testable by explicit ID.
  if (!isDevelopTest && w.dispFlg === false) throw apiError('WAIT_TYPE_NOT_AVAILABLE', 400);
  if (!isStoreReceptionUsage(w.usageDispType)) throw apiError('WAIT_TYPE_MODE_MISMATCH', 400);
  return w;
}"""
          replace_once(backend, old_validate, new_validate)
          replace_once(backend,
              "  enforceReceptionHours(day, mode);",
              "  enforceReceptionHours(day, mode, waitTypeId);")

          envp = 'miniapp-v2/develop/env.js'
          replace_once(envp,
              "  backendEnvironment:'official-develop',",
              "  backendEnvironment:'official-develop',\n  developTestWaitType:Object.freeze({waitTypeId:'0042',label:'入場不可テスト',detail:'Developing専用 / AirWAIT現地受付枠'}),")

          reception = 'miniapp-v2/shared/reception.js'
          old_usage = "function allowedUsage(actual,mode){const usage=String(actual?.usageDispType||'');if(!usage)return true;return mode==='web'?usage==='01'||usage==='03':usage==='01'||usage==='02'}\nfunction buildSlots(waitTypes){const configured=typeof R.slotsFor==='function'?R.slotsFor(S.day?.businessType):[];return configured.map(rule=>{const actual=Array.isArray(waitTypes)?waitTypes.find(x=>String(x.waitTypeId||'')===String(rule.waitTypeId)):null;if(actual&&(actual.dispFlg===false||!allowedUsage(actual,S.mode)))return null;return{...rule,actual}}).filter(Boolean)}\nfunction renderSlots(){const el=$('recSlots');if(!el)return;if(S.day?.isClosed){el.innerHTML='<div class=\"rec-status bad\">本日は休館日です。</div>';return}if(!S.slots.length){el.innerHTML='<div class=\"rec-status warn\">現在選択できる受付枠がありません。</div>';return}el.innerHTML=S.slots.map(s=>`<button type=\"button\" class=\"rec-slot ${S.slot?.waitTypeId===s.waitTypeId?'active':''}\" data-rec-slot=\"${esc(s.waitTypeId)}\"><strong>${esc(s.label)}</strong><small>${esc(s.actual?.waitTypeName||s.detail||'')}</small></button>`).join('')}"
          new_usage = "function developTestRule(){const t=E.developTestWaitType||{};if(E.environment!=='develop'||!t.waitTypeId)return null;return{waitTypeId:String(t.waitTypeId),label:String(t.label||'入場不可テスト'),detail:String(t.detail||'Developing専用テスト枠'),developTest:true}}\nfunction isDevelopTestSlot(s){const t=developTestRule();return Boolean(t&&s&&String(s.waitTypeId)===String(t.waitTypeId))}\nfunction allowedUsage(actual){const usage=String(actual?.usageDispType||'');return !usage||['01','02','KeyALL','KeySTORE_RECEPTION_ONLY'].includes(usage)}\nfunction buildSlots(waitTypes){const configured=[...(typeof R.slotsFor==='function'?R.slotsFor(S.day?.businessType):[])],test=developTestRule();if(test)configured.push(test);return configured.map(rule=>{const actual=Array.isArray(waitTypes)?waitTypes.find(x=>String(x.waitTypeId||'')===String(rule.waitTypeId)):null;if(rule.developTest){if(!actual||!allowedUsage(actual))return null;return{...rule,actual}}if(actual&&(actual.dispFlg===false||!allowedUsage(actual)))return null;return{...rule,actual}}).filter(Boolean)}\nfunction renderSlots(){const el=$('recSlots');if(!el)return;const hasTest=S.slots.some(isDevelopTestSlot);if(S.day?.isClosed&&!hasTest){el.innerHTML='<div class=\"rec-status bad\">本日は休館日です。</div>';return}if(!S.slots.length){el.innerHTML='<div class=\"rec-status warn\">現在選択できる受付枠がありません。</div>';return}el.innerHTML=S.slots.map(s=>`<button type=\"button\" class=\"rec-slot ${S.slot?.waitTypeId===s.waitTypeId?'active':''}\" data-rec-slot=\"${esc(s.waitTypeId)}\"><strong>${esc(s.developTest?'🧪 '+s.label:s.label)}</strong><small>${esc(s.actual?.waitTypeName||s.detail||'')}</small></button>`).join('')}"
          replace_once(reception, old_usage, new_usage)
          replace_once(reception,
              "  const ready=peopleOK&&S.slot&&S.agree&&locationOk()&&!S.day?.isClosed&&!S.busy&&!S.locked&&S.canCreate;",
              "  const testSelected=isDevelopTestSlot(S.slot);const ready=peopleOK&&S.slot&&S.agree&&locationOk()&&(!S.day?.isClosed||testSelected)&&!S.busy&&!S.locked&&S.canCreate;")
          replace_once(reception,
              "    if(day.isClosed){status('本日は休館日です。','bad');S.slots=[];renderSlots();renderForm();return}",
              "    if(day.isClosed)status('本日は休館日です。Developingテスト枠のみ確認できます。','warn')")
          replace_once(reception,
              "    if(S.canCreate)status('LINE本人確認・営業日・Gateway接続を確認しました。受付できます。','ok');\n    else status('受付画面は新HOMEへ統合済みです。安全な新Gatewayの接続・確認が終わるまで、最終確定だけ停止しています。','warn');",
              "    if(S.canCreate&&S.slots.some(isDevelopTestSlot))status('🧪 Developing：AirWAIT現地枠「入場不可テスト」を選んで実受付テストできます。','warn');\n    else if(S.canCreate)status('LINE本人確認・営業日・Gateway接続を確認しました。受付できます。','ok');\n    else status('受付画面は新HOMEへ統合済みです。安全な新Gatewayの接続・確認が終わるまで、最終確定だけ停止しています。','warn');")
          replace_once(reception,
              "window.ASOBOON_V2_RECEPTION=Object.freeze({version:'1.1.0',render,mount});",
              "window.ASOBOON_V2_RECEPTION=Object.freeze({version:'1.2.0-develop-test-slot',render,mount});")
          PY

      - name: Verify only isolated v2 files changed
        run: |
          set -euo pipefail
          git diff --check
          node --check miniapp-v2/shared/reception.js
          node --input-type=module --check < miniapp-v2/backend/develop-gateway.js
          grep -F "DEVELOP_TEST_WAIT_TYPE_ID: '0042'" miniapp-v2/backend/develop-gateway.js
          grep -F "waitTypeId:'0042'" miniapp-v2/develop/env.js
          grep -F "KeySTORE_RECEPTION_ONLY" miniapp-v2/shared/reception.js
          CHANGED="$(git diff --name-only | sort)"
          EXPECTED="$(printf '%s\n' miniapp-v2/backend/develop-gateway.js miniapp-v2/develop/env.js miniapp-v2/shared/reception.js | sort)"
          test "$CHANGED" = "$EXPECTED"

      - name: Commit Developing test-slot support
        run: |
          set -euo pipefail
          git config user.name 'asoboon-ci'
          git config user.email 'asoboon425@gmail.com'
          git add miniapp-v2/backend/develop-gateway.js miniapp-v2/develop/env.js miniapp-v2/shared/reception.js
          git commit -m 'test: wire AirWAIT local slot 0042 into Developing'
          git push origin HEAD:main

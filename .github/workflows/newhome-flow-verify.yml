          grep -F 'let gatewaySchemaReady = null;' miniapp-v2/backend/prepare-develop-test-runtime.mjs
          node miniapp-v2/backend/prepare-develop-test-runtime.mjs
          grep -F 'let gatewaySchemaReady = null;' develop-gateway.runtime.mjs
          grep -F 'if (gatewaySchemaReady) return await gatewaySchemaReady;' develop-gateway.runtime.mjs

      - name: Service notification scan must not starve after 200 rows
        run: |
          set -euo pipefail
          grep -F 'CRON_SCAN_LIMIT: 1200' miniapp-v2/backend/develop-service-message.js
          grep -F 'LIMIT ${SM.CRON_SCAN_LIMIT}' miniapp-v2/backend/develop-service-message.js
          ! grep -Fq 'ORDER BY created_at ASC LIMIT 200' miniapp-v2/backend/develop-service-message.js

      - name: Call status session recovery must not resurrect yesterday
        run: |
          set -euo pipefail
          grep -F 'CALLSTATUS_SESSION_TTL_MS: 12 * 60 * 60 * 1000' miniapp-v2/backend/prepare-develop-test-runtime.mjs
          grep -F 'const targetDate = requestedDate || operationalDate();' miniapp-v2/backend/prepare-develop-test-runtime.mjs
          grep -F 'idx_v2_reservation_sessions_expires' miniapp-v2/backend/prepare-develop-test-runtime.mjs
          grep -F "ORDER BY updated_at DESC LIMIT 1" miniapp-v2/backend/prepare-develop-test-runtime.mjs
          ! grep -Fq 'Date.now() - CFG.CALLSTATUS_SESSION_TTL_MS' miniapp-v2/backend/prepare-develop-test-runtime.mjs

      - name: Developing cache version is consistent
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('miniapp-v2/develop/index.html','utf8');
          const versions=[...html.matchAll(/\?v=([0-9]{8}-[0-9]{2})/g)].map(m=>m[1]);
          if(versions.length<8) throw new Error('missing cache versions');
          if(new Set(versions).size!==1) throw new Error('cache versions differ');
          NODE

name: newhome-flow-verify
on:
  push:
    paths:
      - 'miniapp-v2/**'
      - 'tests/asoboon-develop-reception-lifecycle.test.cjs'
      - '.github/workflows/newhome-flow-verify.yml'
  pull_request:
    paths:
      - 'miniapp-v2/**'
      - 'tests/asoboon-develop-reception-lifecycle.test.cjs'
      - '.github/workflows/newhome-flow-verify.yml'

jobs:
  verify-newhome-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax
        run: |
          set -euo pipefail
          node --check miniapp-v2/shared/reception.js
          node --check miniapp-v2/shared/callstatus.js
          node --check miniapp-v2/shared/business-day.js
          node --check miniapp-v2/backend/develop-worker.mjs
          node --check miniapp-v2/backend/develop-service-message.js
          node --check miniapp-v2/backend/prepare-develop-test-runtime.mjs
          node miniapp-v2/backend/prepare-develop-test-runtime.mjs
          node --input-type=module --check < develop-gateway.runtime.mjs

      - name: Reception lifecycle regression
        run: node --test tests/asoboon-develop-reception-lifecycle.test.cjs

      - name: Reception must terminate or fail closed
        run: |
          set -euo pipefail
          grep -F "const POST_TIMEOUT_MS=45000;" miniapp-v2/shared/reception.js
          grep -F "const GET_TIMEOUT_MS=5000;" miniapp-v2/shared/reception.js
          grep -F "const POLL_DEADLINE_MS=60000;" miniapp-v2/shared/reception.js
          grep -F "const SUBMIT_WATCHDOG_MS=120000;" miniapp-v2/shared/reception.js
          grep -F "const ctrl=new AbortController();" miniapp-v2/shared/reception.js
          grep -F "lockAmbiguous(requestId='')" miniapp-v2/shared/reception.js
          grep -F "CTX.go('callstatus',{replace:true})" miniapp-v2/shared/reception.js
          grep -F "recoverAmbiguous(requestId)" miniapp-v2/shared/reception.js
          grep -F "前回の受付結果を確認しています。新しい受付は行わないでください。" miniapp-v2/shared/reception.js

      - name: Presentation layer must not override reception availability
        run: |
          set -euo pipefail
          grep -F "現在受付できる枠がありません|受付停止中" miniapp-v2/develop/reception-v7.js
          ! grep -Fq "querySelectorAll('.rec-slot').forEach(btn=>{if(btn.hidden)btn.hidden=false})" miniapp-v2/develop/reception-v7.js

      - name: Ambiguous reception must not expose staff-handoff technical copy
        run: |
          set -euo pipefail
          grep -F "if(r?.found&&r?.ambiguous===true)" miniapp-v2/shared/reception.js
          grep -F "受付処理の確認に時間がかかっています。" miniapp-v2/shared/reception.js
          grep -F "前回のテスト受付は確定できませんでした。" miniapp-v2/shared/reception.js
          ! grep -Fq "スタッフ対応が必要" miniapp-v2/shared/reception.js
          ! grep -Fq "ASOBooNスタッフへお声がけください" miniapp-v2/shared/reception.js

      - name: Reception operation id must survive ambiguous retries
        run: |
          set -euo pipefail
          grep -F "PENDING_KEY='asoboon_v2_pending_reception_develop_v1'" miniapp-v2/shared/reception.js
          grep -F 'requestIdFor(body)' miniapp-v2/shared/reception.js
          grep -F 'pendingFingerprint(body)' miniapp-v2/shared/reception.js
          grep -F 'notificationAmbiguous' miniapp-v2/shared/reception.js
          grep -F 'AirWAITへの受付送信は行っていません。' miniapp-v2/shared/reception.js

      - name: Reception POST fallback must not restart polling
        run: |
          set -euo pipefail
          grep -F 'let r;' miniapp-v2/shared/reception.js
          grep -F "r=await fetchWithTimeout(E.backendUrl,options,POST_TIMEOUT_MS" miniapp-v2/shared/reception.js
          ! grep -Fq "return await pollRequest(id);\n  }catch{\n    return await pollRequest(id);" miniapp-v2/shared/reception.js

      - name: Call status must not hang
        run: |
          set -euo pipefail
          grep -F "const REQUEST_TIMEOUT_MS=10000;" miniapp-v2/shared/callstatus.js
          grep -F "signal:ctrl.signal" miniapp-v2/shared/callstatus.js
          grep -F "呼出状況の確認がタイムアウトしました。" miniapp-v2/shared/callstatus.js

      - name: Native cancel must stay inside the LINE miniapp
        run: |
          set -euo pipefail
          grep -F 'id="csCancel"' miniapp-v2/shared/callstatus.js
          grep -F "gatewayPost('cancelReservation'" miniapp-v2/shared/callstatus.js
          grep -F 'async function cancelReservationInMiniapp' miniapp-v2/backend/develop-worker.mjs
          grep -F "/WCSP/cancel/confirm" miniapp-v2/backend/develop-worker.mjs
          grep -F "/WCSP/cancel/complete" miniapp-v2/backend/develop-worker.mjs
          grep -F "const escaped=String(name||'').replace(" miniapp-v2/backend/develop-worker.mjs
          ! grep -F "const escaped=String(name||'').replace(" miniapp-v2/backend/develop-worker.mjs | grep -Fq "async function"
          ! grep -Fq 'airwait.jp' miniapp-v2/shared/callstatus.js
          ! grep -Fq 'openWindow' miniapp-v2/shared/callstatus.js
          ! grep -Fq 'window.open' miniapp-v2/shared/callstatus.js

      - name: Call status must shed background load and herd bursts
        run: |
          set -euo pipefail
          grep -F "const POLL_FAR_MS=180000;" miniapp-v2/shared/callstatus.js
          grep -F "const POLL_MID_MS=60000;" miniapp-v2/shared/callstatus.js
          grep -F "const POLL_FRONT_MS=5000;" miniapp-v2/shared/callstatus.js
          grep -F "const POLL_NEAR_MS=15000;" miniapp-v2/shared/callstatus.js
          grep -F "const POLL_JITTER=0.10;" miniapp-v2/shared/callstatus.js
          grep -F "document.visibilityState!=='visible'" miniapp-v2/shared/callstatus.js
          grep -F "jitter(nextPollMs)" miniapp-v2/shared/callstatus.js
          grep -F "ahead<=1" miniapp-v2/shared/callstatus.js
          grep -F "ahead<=5" miniapp-v2/shared/callstatus.js
          grep -F "ahead<=20" miniapp-v2/shared/callstatus.js

      - name: Call status must reconcile immediately after reception
        run: |
          set -euo pipefail
          grep -F "const POLL_RECONCILE_MS=6000;" miniapp-v2/shared/callstatus.js
          grep -F "const POLL_RECONCILE_MAX=3;" miniapp-v2/shared/callstatus.js
          grep -F "notFoundStreak<=POLL_RECONCILE_MAX?POLL_RECONCILE_MS:POLL_MID_MS" miniapp-v2/shared/callstatus.js
          grep -F "新しい受付を作り直さず" miniapp-v2/shared/callstatus.js
          grep -F "version:'1.8.0-terminal-resolution'" miniapp-v2/shared/callstatus.js

      - name: Reservation status must survive high receipt numbers and closeout
        run: |
          set -euo pipefail
          grep -F "const maxPages = 1000;" miniapp-v2/backend/develop-worker.mjs
          grep -F "start <= 99999 && page < maxPages" miniapp-v2/backend/develop-worker.mjs
          grep -F "start<=99999 && page<1000" miniapp-v2/backend/develop-service-message.js
          grep -F "start <= 99999 && page < 1000" miniapp-v2/backend/prepare-develop-test-runtime.mjs
          grep -F "start<=99999&&page<1000" miniapp-v2/backend/develop-gateway.js
          ! grep -Fq "page<20" miniapp-v2/backend/develop-gateway.js
          ! grep -Fq "page < 20" miniapp-v2/backend/develop-service-message.js
          ! grep -Fq "page < 20" miniapp-v2/backend/prepare-develop-test-runtime.mjs
          grep -F "CALLSTATUS_CLOSE_BY_WAITTYPE" miniapp-v2/backend/develop-worker.mjs
          grep -F "terminalReason:'BUSINESS_DAY_CLOSED'" miniapp-v2/backend/develop-worker.mjs
          grep -F "UPDATE v2_user_day_claims SET wait_type_id=?,updated_at=?" miniapp-v2/backend/develop-worker.mjs
          grep -F "case'closed'" miniapp-v2/shared/callstatus.js
          grep -F "本日の受付は終了しました" miniapp-v2/shared/callstatus.js
          grep -F "if(s==='closed')" miniapp-v2/develop/home-status-v13.js
          grep -F "if(kind==='closed')" miniapp-v2/develop/home-v38.js

      - name: Business calendar must collapse stampedes
        run: |
          set -euo pipefail
          grep -F "action','businessDay'" miniapp-v2/shared/business-day.js
          grep -F "BUSINESS_DAY_CACHE_MS = 30 * 60 * 1000" miniapp-v2/backend/develop-worker.mjs
          grep -F "BUSINESS_DAY_STALE_FALLBACK_MS = 12 * 60 * 60 * 1000" miniapp-v2/backend/develop-worker.mjs
          grep -F "BUSINESS_CALENDAR_READ_TIMEOUT_MS = 5 * 1000" miniapp-v2/backend/develop-worker.mjs
          grep -F "readBusinessDayD1" miniapp-v2/backend/develop-worker.mjs
          grep -F "'business_day:'+date" miniapp-v2/backend/develop-worker.mjs
          grep -F "businessDayInflight" miniapp-v2/backend/develop-worker.mjs
          grep -F "action === 'businessDay'" miniapp-v2/backend/develop-worker.mjs
          grep -F 'getBusinessDayCachedForCreate(env, serverDate)' miniapp-v2/backend/prepare-develop-test-runtime.mjs
          grep -F 'CREATE_BUSINESS_DAY_CACHE_MS = 30 * 60 * 1000' miniapp-v2/backend/prepare-develop-test-runtime.mjs
          grep -F 'CREATE_BUSINESS_DAY_STALE_FALLBACK_MS = 12 * 60 * 60 * 1000' miniapp-v2/backend/prepare-develop-test-runtime.mjs
          grep -F 'parseBusinessDayCacheRow' miniapp-v2/backend/prepare-develop-test-runtime.mjs
          grep -F "STALE_CACHE_MS=12*60*60*1000" miniapp-v2/shared/business-day.js
          grep -F "BUSINESS_DAY_HOME_TIMEOUT')),12000" miniapp-v2/develop/home-v38.js

      - name: Reception slot IDs must match AirWAIT channel
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const code=fs.readFileSync('miniapp-v2/shared/app-rules.js','utf8');
          const ctx={window:{}};vm.createContext(ctx);vm.runInContext(code,ctx);
          const r=ctx.window.ASOBOON_V2_RULES;
          const ids=(type,mode)=>Array.from(r.slotsFor(type,mode),x=>x.waitTypeId);
          const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
          if(!same(ids('土日祝日','web'),['0029','0031','0033'])) throw new Error('weekend LINE slot IDs mismatch');
          if(!same(ids('土日祝日','onsite'),['0029','0031','0033'])) throw new Error('weekend onsite slot IDs mismatch');
          if(!same(ids('平日特定日','web'),['0035','0037'])) throw new Error('special weekday LINE slot IDs mismatch');
          if(!same(ids('平日特定日','onsite'),['0035','0037'])) throw new Error('special weekday onsite slot IDs mismatch');
          if(!same(ids('平日','web'),['0023','0025'])) throw new Error('regular weekday LINE slot IDs mismatch');
          const home=fs.readFileSync('miniapp-v2/develop/home-v38.js','utf8');
          if(home.includes('本日は現地受付です')) throw new Error('weekday HOME must not force onsite reception');
          if(home.includes('平日の混雑目安は現在準備中です')) throw new Error('weekday crowd must not remain in prepared-only state');
          if(!home.includes("'平日':Object.freeze(['0024','0027'])")) throw new Error('weekday crowd online-pool IDs missing from HOME');
          const worker=fs.readFileSync('miniapp-v2/backend/develop-worker.mjs','utf8');
          if(!worker.includes("['0024','0027','0030','0032','0034','0036','0038']")) throw new Error('online-pool crowd slot IDs missing from Worker');
          if(Number(r.operationalCutoffHour)!==19) throw new Error('operational cutoff must be 19');
          NODE
          grep -F "const allowed = SLOT_RULES[mode]?.[day.businessType] || [];" miniapp-v2/backend/develop-gateway.js
          grep -F "if (!w || w.dispFlg === false) throw apiError('WAIT_TYPE_NOT_AVAILABLE', 400);" miniapp-v2/backend/develop-gateway.js

      - name: Developing defaults to store reception slots and keeps 0042 behind explicit dev mode
        run: |
          set -euo pipefail
          grep -F "'平日': Object.freeze(['0023', '0025'])" miniapp-v2/backend/develop-gateway.js
          ! grep -Fq "WEB_NOT_AVAILABLE_FOR_REGULAR_WEEKDAY" miniapp-v2/backend/develop-gateway.js
          grep -F "const DEVELOP_LINE_ONLY=E.environment==='develop';" miniapp-v2/shared/reception.js
          grep -F "get('dev')==='0042'" miniapp-v2/shared/reception.js
          grep -F "const TEST_WAIT_TYPE_ID='0042';" miniapp-v2/develop/reception-anywhere-v22.js
          grep -F "get('dev')==='0042'" miniapp-v2/develop/reception-anywhere-v22.js
          grep -F "section.className='v22-dev-test';" miniapp-v2/develop/reception-anywhere-v22.js
          grep -F "DEVELOPING ONLY" miniapp-v2/develop/reception-anywhere-v22.js
          grep -F "本番ミニアプリには表示されません。" miniapp-v2/develop/reception-anywhere-v22.js
          grep -F "Developingテスト" miniapp-v2/develop/reception-anywhere-v22.js
          grep -F ".v22-dev-test{" miniapp-v2/develop/reception-v7.css
          ! grep -Fq "現在地の確認は不要です" miniapp-v2/develop/reception-anywhere-v22.js
          node miniapp-v2/backend/prepare-develop-test-runtime.mjs
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('develop-gateway.runtime.mjs','utf8');
          const bypass=s.indexOf("if (waitTypeId === CFG.DEVELOP_TEST_WAIT_TYPE_ID) return;");
          if(bypass<0) throw new Error('Developing test bypass missing');
          if(!s.includes("'平日': Object.freeze(['0023', '0025'])")) throw new Error('regular weekday LINE slots missing from runtime');
          if(!s.includes("if (!w) throw apiError('WAIT_TYPE_NOT_AVAILABLE', 400);")) throw new Error('Developing test wait type must exist');
          if(!s.includes("if (w.dispFlg === false) throw apiError('WAIT_TYPE_NOT_AVAILABLE', 400);")) throw new Error('customer slots must still respect dispFlg');
          if(!s.includes("waitTypeId !== CFG.DEVELOP_TEST_WAIT_TYPE_ID) validateLocation(p)")) throw new Error('Developing test must not require location');
          if(!s.includes("DEVELOP_TEST_AMBIGUOUS_RECYCLE_MS: 30 * 1000")) throw new Error('Developing test ambiguous recycle missing');
          NODE

      - name: AirWAIT read pressure must be bounded
        run: |
          set -euo pipefail
          grep -F 'CALLSTATUS_AIRWAIT_CACHE_MS = 5 * 1000' miniapp-v2/backend/prepare-develop-test-runtime.mjs
          grep -F 'CALLSTATUS_AIRWAIT_TIMEOUT_MS = 8 * 1000' miniapp-v2/backend/prepare-develop-test-runtime.mjs
          grep -F 'callstatusAirwaitInflight' miniapp-v2/backend/prepare-develop-test-runtime.mjs
          grep -F 'CREATE_WAIT_TYPES_CACHE_MS = 5 * 1000' miniapp-v2/backend/prepare-develop-test-runtime.mjs
          grep -F 'const wt = await getWaitTypesForCreate(env);' miniapp-v2/backend/prepare-develop-test-runtime.mjs
          grep -F 'const wt = await getWaitTypesForCreate(env);' develop-gateway.runtime.mjs
          grep -F 'getWaitTypes(env, { force:true })' develop-gateway.runtime.mjs

      - name: AirWAIT create errors must preserve structured result codes
        run: |
          set -euo pipefail
          grep -F "const hasDefinitiveAirwaitError = d?.success === false && resultCode && resultCode !== '0000';" miniapp-v2/backend/develop-gateway.js
          grep -F "throw airwaitResultError(resultCode, { httpStatus:res.status, message:airwaitResultMessage(d) });" miniapp-v2/backend/develop-gateway.js
          grep -F 'AIRWAIT_CREATE_HTTP_' miniapp-v2/backend/develop-gateway.js
          grep -F '_RC_' miniapp-v2/backend/develop-gateway.js
          grep -F "'1000': 'AIRWAIT_INPUT_ERROR'" miniapp-v2/backend/develop-gateway.js
          grep -F "'3201': 'AIRWAIT_UNREGISTERED_DATA'" miniapp-v2/backend/develop-gateway.js
          grep -F "'3509': 'AIRWAIT_PRINTER_NOT_FOUND'" miniapp-v2/backend/develop-gateway.js
          grep -F "STORE_NO: 'AKR2298124918'" miniapp-v2/backend/develop-gateway.js
          grep -F "resultCode === '3201'" miniapp-v2/backend/develop-gateway.js
          grep -F "storeNo: CFG.STORE_NO" miniapp-v2/backend/develop-gateway.js
          grep -F "createIdentifier: usedStoreNoFallback ? 'storeNo-fallback' : 'storeId'" miniapp-v2/backend/develop-gateway.js
          node miniapp-v2/backend/prepare-develop-test-runtime.mjs
          grep -F "const hasDefinitiveAirwaitError = d?.success === false && resultCode && resultCode !== '0000';" develop-gateway.runtime.mjs
          grep -F "STORE_NO: 'AKR2298124918'" develop-gateway.runtime.mjs
          grep -F "storeNo: CFG.STORE_NO" develop-gateway.runtime.mjs

      - name: Crowd display must stay independent from LINE reception slots
        run: |
          set -euo pipefail
          grep -F "['0024','0027','0030','0032','0034','0036','0038']" miniapp-v2/backend/develop-worker.mjs
          grep -F "'平日':Object.freeze(['0024','0027'])" miniapp-v2/develop/home-v38.js
          grep -F "'平日特定日':Object.freeze(['0036','0038'])" miniapp-v2/develop/home-v38.js
          grep -F "'土日祝日':Object.freeze(['0030','0032','0034'])" miniapp-v2/develop/home-v38.js
          grep -F "'平日': Object.freeze(['0023', '0025'])" miniapp-v2/backend/develop-gateway.js
          grep -F "'平日特定日': Object.freeze(['0035', '0037'])" miniapp-v2/backend/develop-gateway.js
          grep -F "'土日祝日': Object.freeze(['0029', '0031', '0033'])" miniapp-v2/backend/develop-gateway.js

      - name: LINE reception must use store-only AirWAIT slots with no outbound AirWAIT links
        run: |
          set -euo pipefail
          grep -F "'土日祝日': Object.freeze(['0029', '0031', '0033'])" miniapp-v2/backend/develop-gateway.js
          grep -F "'平日特定日': Object.freeze(['0035', '0037'])" miniapp-v2/backend/develop-gateway.js
          grep -F "'平日': Object.freeze(['0023', '0025'])" miniapp-v2/backend/develop-gateway.js
          grep -F "u === '02' || u === 'KeySTORE_RECEPTION_ONLY'" miniapp-v2/backend/develop-gateway.js
          ! grep -F "handoffRequired:true" miniapp-v2/backend/develop-gateway.js
          ! grep -F "recOfficialOpen" miniapp-v2/shared/reception.js
          ! grep -F "airwait.jp/WCSP" miniapp-v2/shared/reception.js
          ! grep -F "airwait.jp/WCSP" miniapp-v2/shared/callstatus.js

      - name: Sequential same-day reception only recycles terminal previous claim
        run: |
          set -euo pipefail
          grep -F 'releaseTerminalPreviousClaim(env, createPayload, body)' miniapp-v2/backend/develop-worker.mjs
          grep -F "if (!own || !['2','3'].includes(String(own.status || ''))) return false;" miniapp-v2/backend/develop-worker.mjs
          grep -F 'DELETE FROM v2_user_day_claims' miniapp-v2/backend/develop-worker.mjs
          grep -F "DELETE FROM v2_request_results WHERE request_id=?" miniapp-v2/backend/develop-worker.mjs
          ! grep -Fq 'releaseCanceledDevelopTestClaim' miniapp-v2/backend/develop-worker.mjs
          ! grep -Fq "await incrementAttempt(env, hash, serverDate)" miniapp-v2/backend/develop-gateway.js
          ! grep -Fq "try { await incrementAttempt(env, hash, serverDate); }" miniapp-v2/backend/prepare-develop-test-runtime.mjs
          node miniapp-v2/backend/prepare-develop-test-runtime.mjs
          ! grep -Fq "await incrementAttempt(env, hash, serverDate)" develop-gateway.runtime.mjs
          ! grep -Fq "UPDATE v2_user_attempts" miniapp-v2/backend/develop-worker.mjs

      - name: Stale create must fail ambiguous instead of reopening create
        run: |
          set -euo pipefail
          grep -F "STALE_CREATE_INFLIGHT_MS: 2 * 60 * 1000" miniapp-v2/backend/prepare-develop-test-runtime.mjs
          grep -F 'STALE_CREATE_INFLIGHT_REQUIRES_MANUAL_REVIEW' miniapp-v2/backend/prepare-develop-test-runtime.mjs

      - name: Receipt matching tolerates omitted AirWAIT prefix without crossing F and T
        run: |
          set -euo pipefail
          node <<'NODE'
          const parts=v=>{
            const k=String(v||'').normalize('NFKC').toUpperCase().replace(/[\s\-ー]/g,'');
            const m=k.match(/^([FT]?)(\d+)$/);
            return m?{prefix:m[1],digits:m[2].replace(/^0+(?=\d)/,'')}:null;
          };
          const same=(a,b)=>{
            const x=parts(a),y=parts(b);
            if(!x||!y||!x.digits||!y.digits||x.digits!==y.digits)return false;
            if(x.prefix&&y.prefix&&x.prefix!==y.prefix)return false;
            return true;
          };
          const equivalent=[['F000123','F123'],['T000123','T123'],['F000123','123'],['T000123','123'],['000123','123'],['Ｆ０００１２３','123']];
          for(const [a,b] of equivalent) if(!same(a,b)) throw new Error(`must match ${a} ${b}`);
          const different=[['F123','T123'],['F123','124'],['T123','F124'],['ABC123','123'],['','123']];
          for(const [a,b] of different) if(same(a,b)) throw new Error(`must not match ${a} ${b}`);
          NODE
          grep -F 'function ticketParts' miniapp-v2/backend/develop-worker.mjs
          grep -F 'function ticketParts' miniapp-v2/backend/develop-service-message.js
          grep -F 'function ticketParts' miniapp-v2/backend/prepare-develop-test-runtime.mjs

      - name: Receipt selection must prefer exact identity and fail ambiguous compatible matches
        run: |
          set -euo pipefail
          grep -F 'function selectTicketMatch' miniapp-v2/backend/develop-worker.mjs
          grep -F 'function selectTicketMatch' miniapp-v2/backend/develop-service-message.js
          grep -F 'function selectTicketMatch' miniapp-v2/backend/prepare-develop-test-runtime.mjs
          node <<'NODE'
          const parts=v=>{const k=String(v||'').normalize('NFKC').toUpperCase().replace(/[\s\-ー]/g,'');const m=k.match(/^([FT]?)(\d+)$/);return m?{prefix:m[1],digits:m[2].replace(/^0+(?=\d)/,'')}:null};
          const id=v=>{const p=parts(v);return p?p.prefix+p.digits:''};
          const same=(a,b)=>{const x=parts(a),y=parts(b);if(!x||!y||x.digits!==y.digits)return false;if(x.prefix&&y.prefix&&x.prefix!==y.prefix)return false;return true};
          const pick=(rows,target)=>{const exact=rows.filter(r=>id(r.number)===id(target));if(exact.length===1)return exact[0];if(exact.length>1)return null;const loose=rows.filter(r=>same(r.number,target));return loose.length===1?loose[0]:null};
          if(pick([{number:'F123'},{number:'T123'}],'123')!==null) throw new Error('prefixless ambiguous receipt must not auto-select');
          if(pick([{number:'F123'},{number:'T123'}],'F123')?.number!=='F123') throw new Error('exact prefix must win');
          if(pick([{number:'F123'}],'123')?.number!=='F123') throw new Error('single compatible prefix may reconcile');
          NODE

      - name: LINE token issuance must be one per LIFF access token
        run: |
          set -euo pipefail
          grep -F 'v2_service_liff_token_usage' miniapp-v2/backend/develop-service-message.js
          grep -F 'LIFF_NOTIFICATION_TOKEN_ALREADY_CLAIMED_REOPEN_MINIAPP' miniapp-v2/backend/develop-service-message.js
          grep -F 'const tokenHash = await sha256Hex(liffAccessToken);' miniapp-v2/backend/develop-service-message.js
          grep -F "status='BOUND'" miniapp-v2/backend/develop-service-message.js
          grep -F 'channelTokenCache' miniapp-v2/backend/develop-service-message.js
          grep -F "const definitiveBound = String(usage.status || '') === 'BOUND';" miniapp-v2/backend/develop-service-message.js
          grep -F "serviceMessageFreshActionReopenRequired: true" miniapp-v2/backend/develop-service-message.js
          grep -F '同じ日にもう一度受付できます。新しい受付のLINE通知を準備するため' miniapp-v2/backend/develop-worker.mjs

      - name: LINE notification must survive retries and terminal-state rescue
        run: |
          set -euo pipefail
          grep -F "VERSION: '2.4.dev7'" miniapp-v2/backend/develop-service-message.js
          grep -F 'adoptReusableNotificationClaim' miniapp-v2/backend/develop-service-message.js
          grep -F 'serviceMessageReusableUnboundToken: true' miniapp-v2/backend/develop-service-message.js
          grep -F 'sendObservedCallNotification' miniapp-v2/backend/develop-service-message.js
          grep -F 'sendObservedCallNotification' miniapp-v2/backend/develop-worker.mjs
          grep -F 'queueObservedCallNotification' miniapp-v2/backend/develop-worker.mjs
          grep -F "retryEvidence = String(rec.status || '') === 'CALL_SEND_RETRY'" miniapp-v2/backend/develop-service-message.js
          grep -F 'serviceMessageImmediateObservationEnabled: true' miniapp-v2/backend/develop-service-message.js
          grep -F 'serviceMessageTerminalRescueEnabled: true' miniapp-v2/backend/develop-service-message.js
          grep -F 'function isNotificationEligibleAirwait' miniapp-v2/backend/develop-service-message.js
          grep -F "return (status==='0'&&calling)||status==='2'||status==='4';" miniapp-v2/backend/develop-service-message.js
          grep -F "reason:'NOT_NOTIFICATION_ELIGIBLE'" miniapp-v2/backend/develop-service-message.js
          grep -F 'notificationEligible = Boolean(own && isNotificationEligibleAirwait(own))' miniapp-v2/backend/develop-service-message.js
          grep -F 'AND (next_retry_at=0 OR next_retry_at<=?)' miniapp-v2/backend/develop-service-message.js
          grep -F "if (!(body?.ok === true && body?.found === true)) return;" miniapp-v2/backend/develop-worker.mjs
          ! grep -Fq "String(body?.status || '') === '0' && body?.isCalling === true" miniapp-v2/backend/develop-worker.mjs
          node <<'NODE'
          const eligible=(row)=>{const status=String(row?.status||'');const calling=row?.isCalling===true||String(row?.isCalling||'0')==='1';return (status==='0'&&calling)||status==='2'||status==='4'};
          const yes=[{status:'0',isCalling:'1'},{status:'0',isCalling:true},{status:'2',isCalling:'0'},{status:'4',isCalling:'0'}];
          const no=[{status:'0',isCalling:'0'},{status:'1',isCalling:'0'},{status:'1',isCalling:'1'},{status:'3',isCalling:'0'},{status:'3',isCalling:'1'},{status:'',isCalling:'1'}];
          for(const x of yes) if(!eligible(x)) throw new Error('must notify '+JSON.stringify(x));
          for(const x of no) if(eligible(x)) throw new Error('must not notify '+JSON.stringify(x));
          NODE

      - name: Gateway schema initialization must be memoized per isolate

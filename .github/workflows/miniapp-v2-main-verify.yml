name: miniapp-v2-main-verify
on:
  push:
    paths:
      - 'miniapp-v2/**'
      - '.github/workflows/miniapp-v2-main-verify.yml'
  pull_request:
    paths:
      - 'miniapp-v2/**'
      - '.github/workflows/miniapp-v2-main-verify.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Browser JavaScript syntax
        run: |
          set -euo pipefail
          find miniapp-v2/develop miniapp-v2/shared -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Worker module syntax
        run: |
          set -euo pipefail
          node --input-type=module --check < miniapp-v2/backend/develop-gateway.js
          node --check miniapp-v2/backend/develop-service-message.js
          node --check miniapp-v2/backend/develop-worker.mjs
      - name: Lock infant pricing rule
        run: |
          set -euo pipefail
          node <<'NODE'
          global.window = {};
          require('./miniapp-v2/shared/app-rules.js');
          const price = window.ASOBOON_V2_RULES.priceFor;
          const cases = [
            [{adult:1,child:0,infant:0}, 600],
            [{adult:1,child:0,infant:1}, 1500],
            [{adult:1,child:0,infant:2}, 1500],
            [{adult:1,child:0,infant:3}, 1500],
            [{adult:1,child:1,infant:0}, 1500],
            [{adult:1,child:1,infant:1}, 1500],
            [{adult:1,child:1,infant:2}, 1500],
            [{adult:1,child:2,infant:1}, 2400],
            [{adult:2,child:0,infant:1}, 2100]
          ];
          for (const [input, expected] of cases) {
            const actual = price(input);
            if (actual !== expected) throw new Error(`price mismatch ${JSON.stringify(input)} => ${actual}, expected ${expected}`);
          }
          NODE
      - name: Lock play-time guide calculations
        run: |
          set -euo pipefail
          node <<'NODE'
          global.window={ASOBOON_V2_BUSINESS_DAY:{}};
          require('./miniapp-v2/shared/timeguide.js');
          const calc=window.ASOBOON_V2_TIMEGUIDE.calculate;
          const day=(businessType,durationMinutes,durationLabel,closingTime,isClosed=false)=>({ok:true,businessType,durationMinutes,durationLabel,closingTime,isClosed});
          const cases=[
            [day('平日',0,'時間制限なし','17:00'),'10:00','17:00',false],
            [day('平日特定日',180,'3時間','17:00'),'13:30','16:30',false],
            [day('平日特定日',180,'3時間','17:00'),'16:00','17:00',true],
            [day('土日祝日',150,'2時間30分','18:00'),'10:00','12:30',false],
            [day('土日祝日',150,'2時間30分','18:00'),'15:00','17:30',false],
            [day('土日祝日',150,'2時間30分','18:00'),'16:00','18:00',true]
          ];
          for(const [d,entry,end,limited] of cases){
            const r=calc(d,entry);
            if(!r.ok||r.endTime!==end||Boolean(r.limitedByClose)!==limited)throw new Error(`${d.businessType} ${entry} => ${JSON.stringify(r)}, expected ${end}`);
          }
          if(calc(day('平日',0,'時間制限なし','17:00'),'09:59').ok)throw new Error('before-opening entry must be rejected');
          if(calc(day('休館',null,'休館日',null,true),'10:00').ok)throw new Error('closed day must be rejected');
          NODE
          ! grep -Fq '.getDay(' miniapp-v2/shared/timeguide.js
          grep -F 'D.getCurrent({force})' miniapp-v2/shared/timeguide.js
          grep -F 'Math.min(entry+duration,close)' miniapp-v2/shared/timeguide.js
      - name: Block legacy and Purple LIFF dependencies
        run: |
          set -euo pipefail
          ! grep -R -n -F '2009888671-57TOefc3' miniapp-v2
          ! grep -R -n -F '2011467470-Gk5C3lWf' miniapp-v2
      - name: Block browser-side AirWAIT access and key header
        run: |
          set -euo pipefail
          ! grep -R -n -F 'cl.airwait.jp' miniapp-v2/develop miniapp-v2/shared
          ! grep -R -n -F 'corWclpKeyCd' miniapp-v2/develop miniapp-v2/shared
      - name: Block old HOME dependencies
        run: |
          set -euo pipefail
          ! grep -R -n -E '(\.\./)+home\.html|/home\.html|home-core\.html|callstatus-core\.html' miniapp-v2
      - name: Confirm Developing identity is isolated
        run: |
          set -euo pipefail
          grep -F "channelId:'2009884611'" miniapp-v2/develop/env.js
          grep -F "liffId:'2009884611-bDgDzGrN'" miniapp-v2/develop/env.js
          grep -F "endpoint:'https://asoboon.github.io/asoboon-stamp/miniapp-v2/develop/'" miniapp-v2/develop/env.js
      - name: Confirm controlled create gate pairing
        run: |
          set -euo pipefail
          grep -F 'createRequiresVerifiedLiff' miniapp-v2/shared/reception.js
          grep -F '受付結果を確認しています。新しい受付は行わないでください。' miniapp-v2/shared/reception.js
          grep -F "CHANNEL_ID: '2009884611'" miniapp-v2/backend/develop-gateway.js
          grep -F "CREATE_ENABLED || '0'" miniapp-v2/backend/develop-gateway.js

          if grep -Fq 'receptionCreate:true' miniapp-v2/develop/env.js; then
            grep -F '"CREATE_ENABLED": "1"' .github/workflows/deploy-miniapp-v2-develop-gateway.yml
            echo 'Developing create test is intentionally enabled on both client and gateway deployment gates.'
          else
            grep -F 'receptionCreate:false' miniapp-v2/develop/env.js
            grep -F '"CREATE_ENABLED": "0"' .github/workflows/deploy-miniapp-v2-develop-gateway.yml
            echo 'Developing create is safely disabled on both client and gateway deployment gates.'
          fi
      - name: Lock mandatory LINE notification fail-close
        run: |
          set -euo pipefail
          grep -F 'serviceMessageMandatoryBeforeCreate: true' miniapp-v2/backend/develop-service-message.js
          grep -F 'const baseCreateEnabled = body?.createEnabled === true;' miniapp-v2/backend/develop-worker.mjs
          grep -F 'body.serviceMessageMandatoryBeforeCreate === true && body.serviceMessageReady !== true' miniapp-v2/backend/develop-worker.mjs
          grep -F 'body.createEnabled = false;' miniapp-v2/backend/develop-worker.mjs
          grep -F "'LINE_NOTIFICATION_NOT_READY'" miniapp-v2/backend/develop-worker.mjs
          grep -F 'prepareReservationNotification(env, createPayload)' miniapp-v2/backend/develop-worker.mjs
      - name: Lock sequential same-day reception and fresh LINE action boundary
        run: |
          set -euo pipefail
          grep -F "VERSION: '2.4.dev7'" miniapp-v2/backend/develop-service-message.js
          grep -F 'serviceMessageFreshActionReopenRequired: true' miniapp-v2/backend/develop-service-message.js
          grep -F "const definitiveBound = String(usage.status || '') === 'BOUND';" miniapp-v2/backend/develop-service-message.js
          grep -F 'releaseTerminalPreviousClaim(env, createPayload, body)' miniapp-v2/backend/develop-worker.mjs
          grep -F "if (!own || !['2','3'].includes(String(own.status || ''))) return false;" miniapp-v2/backend/develop-worker.mjs
          grep -F '同じ日にもう一度受付できます。新しい受付のLINE通知を準備するため' miniapp-v2/backend/develop-worker.mjs
          grep -F 'let r;' miniapp-v2/shared/reception.js
          grep -F "r=await fetchWithTimeout(E.backendUrl,options,POST_TIMEOUT_MS" miniapp-v2/shared/reception.js
      - name: Lock reception reads independently
        run: |
          set -euo pipefail
          grep -F 'Promise.allSettled([lineTask,dayTask,gatewayTask])' miniapp-v2/shared/reception.js
          grep -F "S.slots=buildSlots(S.waitTypes)" miniapp-v2/shared/reception.js
          grep -F "S.day&&typeof R.slotsFor" miniapp-v2/shared/reception.js
          grep -F '営業区分</small><strong>取得できません' miniapp-v2/shared/reception.js
          grep -F '「入場不可テスト」は表示確認できますが、受付確定は安全のため停止しています。' miniapp-v2/shared/reception.js
          grep -F "S.day&&S.agree" miniapp-v2/shared/reception.js
      - name: Lock call status as a first-class Developing route
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const html=fs.readFileSync('miniapp-v2/develop/index.html','utf8');
          const scripts=[...html.matchAll(/<script src="([^"]+\.js\?v=[^"]+)"/g)].map(m=>m[1]);
          const appSrc=scripts.find(s=>s.includes('./app-stable-')||s.includes('app-newhome-shell-')||s.includes('../shared/app.js'));
          if(!appSrc) throw new Error('Active Developing app script not found');
          const appPath=path.normalize(path.join('miniapp-v2/develop',appSrc.split('?')[0]));
          const app=fs.readFileSync(appPath,'utf8');
          for(const needle of ["if(view==='callstatus')return callstatusPage()","callstatusModule()?.mount?.","callstatusModule()?.watchReception?."]){
            if(!app.includes(needle)) throw new Error('Active app missing callstatus invariant: '+needle);
          }
          NODE
          grep -F 'render:pageHtml' miniapp-v2/shared/callstatus.js
          grep -F 'mount:mountCallstatus' miniapp-v2/shared/callstatus.js
          grep -F 'watchReception' miniapp-v2/shared/callstatus.js
          ! grep -Fq 'observer.observe(document.documentElement' miniapp-v2/shared/callstatus.js
          grep -F "CACHE_KEY='asoboon_v2_current_reservation_develop_v1'" miniapp-v2/shared/callstatus.js
          grep -F "CALL_KEY='asoboon_v2_callstatus_develop_v1'" miniapp-v2/shared/callstatus.js
      - name: Lock play-time guide as a first-class Developing route
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const html=fs.readFileSync('miniapp-v2/develop/index.html','utf8');
          const scripts=[...html.matchAll(/<script src="([^"]+\.js\?v=[^"]+)"/g)].map(m=>m[1]);
          const appSrc=scripts.find(s=>s.includes('./app-stable-')||s.includes('app-newhome-shell-')||s.includes('../shared/app.js'));
          if(!appSrc) throw new Error('Active Developing app script not found');
          const appPath=path.normalize(path.join('miniapp-v2/develop',appSrc.split('?')[0]));
          const app=fs.readFileSync(appPath,'utf8');
          for(const needle of ["if(view==='timeguide')return timePage()","timeguideModule()?.mount?."]){
            if(!app.includes(needle)) throw new Error('Active app missing timeguide invariant: '+needle);
          }
          NODE
          grep -F 'window.ASOBOON_V2_TIMEGUIDE=Object.freeze' miniapp-v2/shared/timeguide.js
          grep -F "OPENING_TIME='10:00'" miniapp-v2/shared/timeguide.js
          grep -F 'day.closingTime' miniapp-v2/shared/timeguide.js
          grep -F 'day.durationMinutes' miniapp-v2/shared/timeguide.js
      - name: Lock Developing module and app load order
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('miniapp-v2/develop/index.html','utf8');
          const scripts=[...html.matchAll(/<script src="([^"]+\.js\?v=[^"]+)"/g)].map(m=>m[1]);
          const appSrc=scripts.find(s=>s.includes('./app-stable-')||s.includes('app-newhome-shell-')||s.includes('../shared/app.js'));
          if(!appSrc) throw new Error('Active Developing app script not found');
          const call=html.indexOf('../shared/callstatus.js');
          const time=html.indexOf('../shared/timeguide.js');
          const app=html.indexOf(appSrc);
          if(call<0||time<0||app<0||call>app||time>app) throw new Error('Developing feature modules must load before active app');
          const router=html.indexOf('./router-v7.js');
          if(router>=0&&app>router) throw new Error('Optional router must load after active app');
          if(appSrc.includes('./app-stable-')&&router>=0) throw new Error('Stable Developing app must own navigation without router-v7.js');
          if(!html.includes('../shared/timeguide.css')) throw new Error('timeguide.css must be loaded');
          const versions=[...html.matchAll(/\?v=([0-9]{8}-[0-9]{2})/g)].map(m=>m[1]);
          if(versions.length<8) throw new Error('Developing assets must carry cache versions');
          if(new Set(versions).size!==1) throw new Error('Developing asset cache versions must be consistent');
          NODE

      - name: Lock Developing HOME ownership mode
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const html=fs.readFileSync('miniapp-v2/develop/index.html','utf8');
          const scripts=[...html.matchAll(/<script src="([^"]+\.js\?v=[^"]+)"/g)].map(m=>m[1]);
          const stableSrc=scripts.find(s=>s.includes('./app-stable-'));
          if(stableSrc){
            if(!html.includes('./home-v37.js')) throw new Error('Stable Developing mode must load home-v37.js');
            if(html.includes('./router-v7.js')) throw new Error('Stable Developing mode must not load router-v7.js');
            if(html.includes('./transition-v33.js')||html.includes('./transition-v33.css')) throw new Error('Stable Developing mode must not load legacy route transition lock');
            if(/class="[^"]*v33-boot/.test(html)) throw new Error('Stable Developing mode must not boot with v33-boot interaction lock');
            if(html.includes('../shared/app.js')||html.includes('./app-newhome-shell-')||html.includes('./new-home-v')) throw new Error('Stable Developing mode must have one app owner');
            const app=fs.readFileSync(path.normalize(path.join('miniapp-v2/develop',stableSrc.split('?')[0])),'utf8');
            if(app.includes("if(!state.liffReady&&state.inClient)return")) throw new Error('Stable app must never block navigation on LIFF readiness');
            if(!app.includes('LIFF_INIT_TIMEOUT')||!app.includes('6000')) throw new Error('Stable app must bound LIFF initialization');
            if(!app.includes("[data-v7-view],[data-pv7-view],[data-view],#backBtn")) throw new Error('Stable app must own all internal navigation selectors');
            if(!app.includes("window.addEventListener('popstate',()=>{readRoute();render()});")) throw new Error('Stable app must render popstate even during boot');
            if(!app.includes('let appEventsBound=false')) throw new Error('Stable app must bind navigation events once');
            process.exit(0);
          }
          const appSrc=scripts.find(s=>s.includes('./app-newhome-shell-'));
          const homeSrc=scripts.find(s=>s.includes('./new-home-v'));
          if(!appSrc||!homeSrc) throw new Error('No supported Developing HOME owner found');
          const resolve=s=>path.normalize(path.join('miniapp-v2/develop',s.split('?')[0]));
          const app=fs.readFileSync(resolve(appSrc),'utf8');
          const home=fs.readFileSync(resolve(homeSrc),'utf8');
          if(!app.includes('id="newHomeHost"')) throw new Error('Dedicated HOME host missing');
          if(!home.includes('host.innerHTML=shell()')) throw new Error('new HOME must render only inside dedicated host');
          NODE

  develop-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Click every Developing HOME route under LIFF failures
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/asoboon-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          npm run test:miniapp-develop -- --reporter=line --workers=1

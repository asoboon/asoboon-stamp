name: miniapp-v2-main-verify
on:
  push:
    paths:
      - 'miniapp-v2/**'
      - '.github/workflows/miniapp-v2-main-verify.yml'
  pull_request:
    paths:
      - 'miniapp-v2/**'
      - '.github/workflows/miniapp-v2-main-verify.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Browser JavaScript syntax
        run: |
          set -euo pipefail
          find miniapp-v2/develop miniapp-v2/shared -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Worker module syntax
        run: |
          set -euo pipefail
          node --input-type=module --check < miniapp-v2/backend/develop-gateway.js
          node --check miniapp-v2/backend/develop-service-message.js
          node --check miniapp-v2/backend/develop-worker.mjs
      - name: Lock infant pricing rule
        run: |
          set -euo pipefail
          node <<'NODE'
          global.window = {};
          require('./miniapp-v2/shared/app-rules.js');
          const price = window.ASOBOON_V2_RULES.priceFor;
          const cases = [
            [{adult:1,child:0,infant:0}, 600],
            [{adult:1,child:0,infant:1}, 1500],
            [{adult:1,child:0,infant:2}, 1500],
            [{adult:1,child:0,infant:3}, 1500],
            [{adult:1,child:1,infant:0}, 1500],
            [{adult:1,child:1,infant:1}, 1500],
            [{adult:1,child:1,infant:2}, 1500],
            [{adult:1,child:2,infant:1}, 2400],
            [{adult:2,child:0,infant:1}, 2100]
          ];
          for (const [input, expected] of cases) {
            const actual = price(input);
            if (actual !== expected) throw new Error(`price mismatch ${JSON.stringify(input)} => ${actual}, expected ${expected}`);
          }
          NODE
      - name: Lock play-time guide calculations
        run: |
          set -euo pipefail
          node <<'NODE'
          global.window={ASOBOON_V2_BUSINESS_DAY:{}};
          require('./miniapp-v2/shared/timeguide.js');
          const calc=window.ASOBOON_V2_TIMEGUIDE.calculate;
          const day=(businessType,durationMinutes,durationLabel,closingTime,isClosed=false)=>({ok:true,businessType,durationMinutes,durationLabel,closingTime,isClosed});
          const cases=[
            [day('平日',0,'時間制限なし','17:00'),'10:00','17:00',false],
            [day('平日特定日',180,'3時間','17:00'),'13:30','16:30',false],
            [day('平日特定日',180,'3時間','17:00'),'16:00','17:00',true],
            [day('土日祝日',150,'2時間30分','18:00'),'10:00','12:30',false],
            [day('土日祝日',150,'2時間30分','18:00'),'15:00','17:30',false],
            [day('土日祝日',150,'2時間30分','18:00'),'16:00','18:00',true]
          ];
          for(const [d,entry,end,limited] of cases){
            const r=calc(d,entry);
            if(!r.ok||r.endTime!==end||Boolean(r.limitedByClose)!==limited)throw new Error(`${d.businessType} ${entry} => ${JSON.stringify(r)}, expected ${end}`);
          }
          if(calc(day('平日',0,'時間制限なし','17:00'),'09:59').ok)throw new Error('before-opening entry must be rejected');
          if(calc(day('休館',null,'休館日',null,true),'10:00').ok)throw new Error('closed day must be rejected');
          NODE
          ! grep -Fq '.getDay(' miniapp-v2/shared/timeguide.js
          grep -F 'D.getCurrent({force})' miniapp-v2/shared/timeguide.js
          grep -F 'Math.min(entry+duration,close)' miniapp-v2/shared/timeguide.js
      - name: Block legacy and Purple LIFF dependencies
        run: |
          set -euo pipefail
          ! grep -R -n -F '2009888671-57TOefc3' miniapp-v2
          ! grep -R -n -F '2011467470-Gk5C3lWf' miniapp-v2
      - name: Block browser-side AirWAIT access and key header
        run: |
          set -euo pipefail
          ! grep -R -n -F 'cl.airwait.jp' miniapp-v2/develop miniapp-v2/shared
          ! grep -R -n -F 'corWclpKeyCd' miniapp-v2/develop miniapp-v2/shared
      - name: Block old HOME dependencies
        run: |
          set -euo pipefail
          ! grep -R -n -E '(\.\./)+home\.html|/home\.html|home-core\.html|callstatus-core\.html' miniapp-v2
      - name: Confirm Developing identity is isolated
        run: |
          set -euo pipefail
          grep -F "channelId:'2009884611'" miniapp-v2/develop/env.js
          grep -F "liffId:'2009884611-bDgDzGrN'" miniapp-v2/develop/env.js
          grep -F "endpoint:'https://asoboon.github.io/asoboon-stamp/miniapp-v2/develop/'" miniapp-v2/develop/env.js
      - name: Confirm controlled create gate pairing
        run: |
          set -euo pipefail
          grep -F 'createRequiresVerifiedLiff' miniapp-v2/shared/reception.js
          grep -F '受付結果を確認しています。新しい受付は行わないでください。' miniapp-v2/shared/reception.js
          grep -F "CHANNEL_ID: '2009884611'" miniapp-v2/backend/develop-gateway.js
          grep -F "CREATE_ENABLED || '0'" miniapp-v2/backend/develop-gateway.js

          if grep -Fq 'receptionCreate:true' miniapp-v2/develop/env.js; then
            grep -F '"CREATE_ENABLED": "1"' .github/workflows/deploy-miniapp-v2-develop-gateway.yml
            echo 'Developing create test is intentionally enabled on both client and gateway deployment gates.'
          else
            grep -F 'receptionCreate:false' miniapp-v2/develop/env.js
            grep -F '"CREATE_ENABLED": "0"' .github/workflows/deploy-miniapp-v2-develop-gateway.yml
            echo 'Developing create is safely disabled on both client and gateway deployment gates.'
          fi
      - name: Lock mandatory LINE notification fail-close
        run: |
          set -euo pipefail
          grep -F 'serviceMessageMandatoryBeforeCreate: true' miniapp-v2/backend/develop-service-message.js
          grep -F 'const baseCreateEnabled = body?.createEnabled === true;' miniapp-v2/backend/develop-worker.mjs
          grep -F 'body.serviceMessageMandatoryBeforeCreate === true && body.serviceMessageReady !== true' miniapp-v2/backend/develop-worker.mjs
          grep -F 'body.createEnabled = false;' miniapp-v2/backend/develop-worker.mjs
          grep -F "'LINE_NOTIFICATION_NOT_READY'" miniapp-v2/backend/develop-worker.mjs
          grep -F 'prepareReservationNotification(env, createPayload)' miniapp-v2/backend/develop-worker.mjs
      - name: Lock call status as a first-class Developing route
        run: |
          set -euo pipefail
          grep -F "if(view==='callstatus')return callstatusPage()" miniapp-v2/shared/app.js
          grep -F "callstatusModule()?.mount?." miniapp-v2/shared/app.js
          grep -F "callstatusModule()?.watchReception?." miniapp-v2/shared/app.js
          grep -F 'render:pageHtml' miniapp-v2/shared/callstatus.js
          grep -F 'mount:mountCallstatus' miniapp-v2/shared/callstatus.js
          grep -F 'watchReception' miniapp-v2/shared/callstatus.js
          ! grep -Fq 'observer.observe(document.documentElement' miniapp-v2/shared/callstatus.js
          grep -F "CACHE_KEY='asoboon_v2_current_reservation_develop_v1'" miniapp-v2/shared/callstatus.js
          grep -F "CALL_KEY='asoboon_v2_callstatus_develop_v1'" miniapp-v2/shared/callstatus.js
      - name: Lock play-time guide as a first-class Developing route
        run: |
          set -euo pipefail
          grep -F "if(view==='timeguide')return timePage()" miniapp-v2/shared/app.js
          grep -F "timeguideModule()?.mount?." miniapp-v2/shared/app.js
          grep -F 'window.ASOBOON_V2_TIMEGUIDE=Object.freeze' miniapp-v2/shared/timeguide.js
          grep -F "OPENING_TIME='10:00'" miniapp-v2/shared/timeguide.js
          grep -F 'day.closingTime' miniapp-v2/shared/timeguide.js
          grep -F 'day.durationMinutes' miniapp-v2/shared/timeguide.js
      - name: Lock Developing module script order before router
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('miniapp-v2/develop/index.html','utf8');
          const call=html.indexOf('../shared/callstatus.js');
          const time=html.indexOf('../shared/timeguide.js');
          const app=html.indexOf('../shared/app.js');
          if(call<0||time<0||app<0||call>app||time>app) throw new Error('Developing feature modules must load before app.js');
          if(!html.includes('../shared/timeguide.css')) throw new Error('timeguide.css must be loaded');
          if(!html.includes('v=20260911-10')) throw new Error('Developing cache version not bumped');
          NODE

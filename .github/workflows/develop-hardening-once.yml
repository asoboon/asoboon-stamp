name: develop-hardening-once

on:
  push:
    paths:
      - '.github/scripts/develop-hardening-20260912-v3.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Developing hardening patch
        run: |
          set -euo pipefail
          python .github/scripts/develop-hardening-20260912-v3.py
          node --check miniapp-v2/backend/develop-service-message.js
          node --check miniapp-v2/backend/develop-worker.mjs
          node --check miniapp-v2/shared/callstatus.js
          node miniapp-v2/backend/prepare-develop-test-runtime.mjs
          node --input-type=module --check < develop-gateway.runtime.mjs

      - name: Commit source patch only
        run: |
          set -euo pipefail
          rm -f develop-gateway.runtime.mjs
          git restore .github/workflows/deploy-miniapp-v2-develop-gateway.yml .github/workflows/newhome-flow-verify.yml
          git config user.name 'asoboon'
          git config user.email 'asoboon425@gmail.com'
          git add miniapp-v2/backend/develop-service-message.js miniapp-v2/backend/develop-worker.mjs miniapp-v2/backend/prepare-develop-test-runtime.mjs miniapp-v2/shared/callstatus.js miniapp-v2/develop/index.html
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'harden: close notification and ticket race gaps'
          git push origin HEAD:main

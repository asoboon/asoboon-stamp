name: tmp-multi-entry-patch
on:
  push:
    paths:
      - '.github/workflows/tmp-multi-entry-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: |
          set -euo pipefail
          node scripts/tmp-multi-entry-patch.mjs
          node --check miniapp-v2/backend/develop-service-message.js
          node --check miniapp-v2/backend/develop-worker.mjs
          node --check miniapp-v2/shared/reception.js
          git diff --check
      - name: Commit source changes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add miniapp-v2/backend/develop-service-message.js miniapp-v2/backend/develop-worker.mjs miniapp-v2/shared/reception.js miniapp-v2/develop/index.html
          git commit -m 'fix: allow sequential same-day reception' 
          git push origin HEAD:main

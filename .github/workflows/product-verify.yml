name: product-verify
on:
  push:
    paths:
      - 'product/**'
      - '.github/workflows/product-verify.yml'
  pull_request:
    paths:
      - 'product/**'
      - '.github/workflows/product-verify.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret-pattern scan
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          patterns = [
              re.compile(r"airwaitApiKey\s*[:=]\s*['\"][^'\"]{12,}['\"]"),
              re.compile(r"STAFF_KEY\s*[:=]\s*['\"][A-Za-z0-9_-]{16,}['\"]"),
          ]
          bad = []
          for path in Path('product').rglob('*'):
              if not path.is_file() or path.suffix.lower() in {'.md', '.png', '.jpg', '.jpeg', '.webp'}:
                  continue
              text = path.read_text(errors='ignore')
              if any(p.search(text) for p in patterns):
                  bad.append(str(path))
          if bad:
              print('Possible hard-coded secret:', *bad, sep='\n- ')
              sys.exit(1)
          print('Secret-pattern scan passed.')
          PY
      - name: JavaScript syntax check
        run: |
          node --check product/secure-airwait-client.js
          node --check product/customer/app.js
          node --check product/staff/app.js
          node --check product/staff/hardening.js

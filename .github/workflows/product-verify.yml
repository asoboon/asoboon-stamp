name: product-verify
on:
  push:
    paths:
      - 'product/**'
      - 'reservation-policy-rc3.js'
      - 'yoyaku-reservation-rc3.js'
      - 'yoyaku-reservation-rc3-patch.js'
      - 'yoyaku-location-gate-rc3.js'
      - 'yoyaku-reservation-rc3.html'
      - 'yoyaku-test.html'
      - '.github/workflows/product-verify.yml'
  pull_request:
    paths:
      - 'product/**'
      - 'reservation-policy-rc3.js'
      - 'yoyaku-reservation-rc3.js'
      - 'yoyaku-reservation-rc3-patch.js'
      - 'yoyaku-location-gate-rc3.js'
      - 'yoyaku-reservation-rc3.html'
      - 'yoyaku-test.html'
      - '.github/workflows/product-verify.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret-pattern scan
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          patterns = [
              re.compile(r"airwaitApiKey\s*[:=]\s*['\"][^'\"]{12,}['\"]"),
              re.compile(r"STAFF_KEY\s*[:=]\s*['\"][A-Za-z0-9_-]{16,}['\"]"),
          ]
          bad = []
          for path in Path('product').rglob('*'):
              if not path.is_file() or path.suffix.lower() in {'.md', '.png', '.jpg', '.jpeg', '.webp'}:
                  continue
              text = path.read_text(errors='ignore')
              if any(p.search(text) for p in patterns):
                  bad.append(str(path))
          if bad:
              print('Possible hard-coded secret:', *bad, sep='\n- ')
              sys.exit(1)
          print('Secret-pattern scan passed.')
          PY
      - name: JavaScript syntax check
        run: |
          set -e
          while IFS= read -r -d '' file; do
            echo "checking $file"
            node --check "$file"
          done < <(find product -type f -name '*.js' -print0)
          node --check reservation-policy-rc3.js
          node --check yoyaku-reservation-rc3.js
          node --check yoyaku-reservation-rc3-patch.js
          node --check yoyaku-location-gate-rc3.js
      - name: Apps Script syntax check
        run: |
          set -e
          find product -type f -name '*.gs' -print0 | sort -z | xargs -0 cat > /tmp/product-apps-script.js
          node --check /tmp/product-apps-script.js

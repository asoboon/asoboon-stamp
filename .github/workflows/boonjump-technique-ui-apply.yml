name: BOONJUMP Technique UI Apply

on:
  push:
    branches:
      - agent/boonjump-technique-ui-v741
    paths:
      - .github/workflows/boonjump-technique-ui-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/boonjump-technique-ui-v741

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply technique UI patch
        run: python tools/apply_boonjump_technique_ui.py

      - name: Syntax and contract checks
        run: |
          node --check boonjump/sw.js
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, sys, json
          s=Path('boonjump/index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          for i,code in enumerate(scripts):
              if not code.strip():
                  continue
              f=Path(f'/tmp/inline-{i}.js')
              f.write_text(code)
              r=subprocess.run(['node','--check',str(f)])
              if r.returncode:
                  sys.exit(r.returncode)
          json.loads(Path('boonjump/manifest.webmanifest').read_text())
          css=Path('boonjump/technique-ui-v741.css')
          assert css.is_file()
          text=css.read_text()
          assert '.technique-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))' in text
          assert "const AIR_COMMAND_FIXED_COUNT=10;" in s
          assert "const AIR_COMMAND_SECONDS=3;" in s
          assert "supportId:normalizeSupportId(attempt&&attempt.supportId)" in s
          assert "airCommandCorrect:Math.max(0,Math.min(10" in s
          assert "APP_VERSION = '7.4.1'" in s
          assert "2026-08-17-technique-ui-v741" in s
          print('syntax/static QA PASS')
          PY

      - name: Commit patched BOONJUMP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add boonjump/index.html boonjump/sw.js boonjump/manifest.webmanifest boonjump/technique-ui-v741.css
          git diff --cached --quiet && exit 0
          git commit -m "Improve BOONJUMP technique selection UI"
          git push origin HEAD:agent/boonjump-technique-ui-v741

name: deploy-miniapp-v2-review-gateway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'miniapp-v2/review/**'
      - 'miniapp-v2/backend/review-gateway.js'
      - '.github/workflows/deploy-miniapp-v2-review-gateway.yml'

permissions:
  contents: read

concurrency:
  group: miniapp-v2-review-gateway
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 7bb41607cf8c1585e9cf166d1609f8c1
      WORKER_NAME: asoboon-miniapp-v2-review-gateway
      DB_NAME: asoboon-miniapp-v2-review-db
      WORKER_URL: https://asoboon-miniapp-v2-review-gateway.asoboon425.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Review safety checks
        run: |
          set -euo pipefail
          node --input-type=module --check < miniapp-v2/backend/review-gateway.js
          grep -F "reviewWritesAirwait:false" miniapp-v2/backend/review-gateway.js
          ! grep -Fq 'AIRWAIT_API_KEY' miniapp-v2/backend/review-gateway.js
          grep -F "liffId:'2009884613-ELc6kolf'" miniapp-v2/review/env.js
          grep -F "environment:'review'" miniapp-v2/review/env.js
          grep -F "storageNamespace:'review'" miniapp-v2/review/env.js
      - name: Ensure Review D1 database
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          LIST="$(curl --fail-with-body --silent --show-error -H "$AUTH" "$API?per_page=100")"
          DB_ID="$(printf '%s' "$LIST" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);const r=(x.result||[]).find(v=>v?.name===process.env.DB_NAME);process.stdout.write(r?.uuid||"")})')"
          if [ -z "$DB_ID" ]; then
            CREATED="$(curl --fail-with-body --silent --show-error -X POST -H "$AUTH" -H 'Content-Type: application/json' --data "{\"name\":\"${DB_NAME}\"}" "$API")"
            DB_ID="$(printf '%s' "$CREATED" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);process.stdout.write(x.result?.uuid||"")})')"
          fi
          test -n "$DB_ID"
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"
      - name: Build Review Wrangler config
        env:
          DB_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          cat > wrangler-v2-review.tmp.jsonc <<EOF2
          {
            "name": "$WORKER_NAME",
            "main": "./miniapp-v2/backend/review-gateway.js",
            "compatibility_date": "2026-09-11",
            "workers_dev": true,
            "d1_databases": [{"binding":"DB","database_name":"$DB_NAME","database_id":"$DB_ID"}]
          }
          EOF2
      - name: Deploy Review gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.145.0 deploy --config ./wrangler-v2-review.tmp.jsonc
      - name: Verify Review health
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            BODY="$(curl --fail --silent --show-error -H 'Origin: https://asoboon.github.io' "$WORKER_URL/?action=health&_=$i" || true)"
            if printf '%s' "$BODY" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s||"{}");if(!(x.ok===true&&x.environment==="official-review"&&x.reviewSimulation===true&&x.reviewWritesAirwait===false&&x.createEnabled===true))process.exit(1)})'; then
              echo "$BODY"
              exit 0
            fi
            sleep 2
          done
          exit 1

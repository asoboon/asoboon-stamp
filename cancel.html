<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><meta name="theme-color" content="#0f2b46"><meta name="robots" content="noindex,nofollow,noarchive"><title>受付をキャンセル｜ASOBooN</title>
<style>
:root{--navy:#0f2b46;--red:#a74232;--red2:#fff0ed;--green:#27784f;--line:#d8c49b;--muted:#6d6353;--gold:#c79a42;--shadow:0 16px 38px rgba(49,36,18,.17)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;color:#2f291f}body{background:radial-gradient(circle at 12% 3%,rgba(255,255,255,.78),transparent 24%),linear-gradient(180deg,#eadab7,#f8efdd 56%,#e5d1a7)}button,a,input{font:inherit}button,a{-webkit-tap-highlight-color:transparent}.app{width:min(100%,520px);margin:auto;padding:max(12px,env(safe-area-inset-top)) 12px calc(34px + env(safe-area-inset-bottom))}.hero{padding:18px 16px;border:3px solid var(--gold);border-radius:24px;color:#fff7df;background:linear-gradient(155deg,var(--navy),#061a2b);box-shadow:var(--shadow)}.hero small{color:#e6c775;font-size:.64rem;font-weight:1000;letter-spacing:.12em}.hero h1{margin:6px 0 5px;font-size:1.55rem}.hero p{margin:0;color:#ded5c1;font-size:.76rem;line-height:1.6;font-weight:750}.card{margin-top:12px;padding:16px;border:2px solid var(--line);border-radius:20px;background:rgba(255,250,240,.98);box-shadow:var(--shadow)}.card h2{margin:0;color:var(--navy);font-size:1.05rem}.ticket{margin-top:12px;padding:14px;border-radius:16px;background:#e9f6ee;border:2px solid #82b596;text-align:center}.ticket small{display:block;color:#4d6e5b;font-size:.66rem;font-weight:850}.ticket strong{display:block;margin-top:4px;color:var(--navy);font-size:2.7rem;line-height:1;font-weight:1000}.ticket span{display:block;margin-top:5px;color:#496355;font-size:.68rem}.warn{margin-top:12px;padding:12px;border-left:5px solid var(--red);border-radius:12px;background:var(--red2);color:#7e3029;font-size:.73rem;line-height:1.6;font-weight:850}.check{display:flex;align-items:flex-start;gap:10px;margin-top:13px;padding:12px;border:1px solid #d9c7a7;border-radius:13px;background:#fff}.check input{width:24px;height:24px;flex:0 0 24px;margin:0;accent-color:var(--red)}.check span{font-size:.73rem;line-height:1.55;font-weight:850}.hold{position:relative;overflow:hidden;width:100%;min-height:62px;margin-top:12px;border:2px solid #8e332b;border-radius:15px;color:#fff;background:linear-gradient(180deg,#c95749,#9b352c);font-weight:1000;touch-action:none}.hold:disabled{opacity:.42}.hold::before{content:"";position:absolute;inset:0 auto 0 0;width:calc(var(--progress,0) * 1%);background:rgba(255,255,255,.22)}.hold span{position:relative;z-index:1}.verify{width:100%;min-height:56px;margin-top:10px;border:2px solid #1e5c43;border-radius:14px;background:linear-gradient(180deg,#e9f8ef,#bfe5ce);color:#174a35;font-weight:1000}.verify:disabled{opacity:.5}.msg{margin-top:10px;padding:10px 11px;border-radius:11px;font-size:.7rem;line-height:1.5}.msg.info{background:#edf5ff;color:#315a78}.msg.ok{background:#e8f6ed;color:#245f3d}.msg.bad{background:#fff0ed;color:#85362e}.help{margin-top:10px;color:var(--muted);font-size:.66rem;line-height:1.55}.links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.links a{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:13px;text-decoration:none;font-size:.72rem;font-weight:950}.home{background:var(--navy);color:#fff}.status{background:#f0e5cd;color:#4a3b27;border:1px solid #cfbc98}@media(max-width:380px){.links{grid-template-columns:1fr}}
</style></head>
<body><main class="app"><header class="hero"><small>ASOBooN / RESERVATION</small><h1>受付をキャンセル</h1><p>この端末で作った受付だけ、入力なしでキャンセル手続きへ進めます。</p></header><section class="card"><h2>キャンセルする受付</h2><div id="ticket" class="ticket" hidden><small>この端末の受付</small><strong id="ticketNo">--</strong><span id="ticketType"></span></div><div id="message" class="msg info">受付情報を確認しています…</div><div class="warn"><strong>重要：</strong>Airウェイト画面でキャンセルを完了したあと、この画面へ戻って「キャンセル完了を確認する」を押してください。確認が取れるまでミニアプリの受付番号は削除しません。</div><label id="agreeRow" class="check" hidden><input id="agree" type="checkbox"><span>「キャンセル後は同じ受付番号に戻せない」ことを確認しました。</span></label><button id="hold" class="hold" type="button" disabled style="--progress:0"><span>1.5秒長押ししてAirウェイトへ</span></button><button id="verify" class="verify" type="button" hidden>✓ キャンセル完了を確認する</button><div class="help">本人用URLの入力は不要です。受付時にミニアプリが保存したAirウェイトURLを自動で使います。</div><div class="links"><a class="status" href="./callstatus.html">呼出状況へ戻る</a><a class="home" href="./home.html">ミニアプリHOME</a></div></section></main>
<script src="./autocall-config.js?v=10"></script>
<script>
(()=>{'use strict';
const KEYS=['asoboon_app_v2_current_reservation','asoboon_current_reservation_v3','asoboon_current_reservation_v2','asoboon_reservation_rc3_current_v1'];
const CALL_KEY='asoboon_callstatus_number_v4',PENDING_KEY='asoboon_cancel_pending_v3',$=id=>document.getElementById(id);
const RES_API='https://cl.airwait.jp/WCLP/api/external/stateless/reservations';
let record=null,holding=false,start=0,raf=0,checking=false;
function unwrap(x){if(!x||typeof x!=='object')return null;const r=x.reservation&&typeof x.reservation==='object'?x.reservation:x;return {...x,...r}}
function parse(k){try{return unwrap(JSON.parse(localStorage.getItem(k)||'null'))}catch{return null}}
function airwaitUrl(v){try{const u=new URL(String(v||''));return u.protocol==='https:'&&/(^|\.)airwait\.jp$/i.test(u.hostname)?u.href:''}catch{return''}}
function read(){for(const k of KEYS){const r=parse(k);if(r?.receiptNo&&airwaitUrl(r.shortUrl))return {...r,_key:k}}return null}
function readPending(){try{return JSON.parse(localStorage.getItem(PENDING_KEY)||'null')}catch{return null}}
function savePending(r){try{localStorage.setItem(PENDING_KEY,JSON.stringify({...r,cancelStagedAt:Date.now()}))}catch{}}
function clearPending(){try{localStorage.removeItem(PENDING_KEY)}catch{}}
function clear(r){const n=String(r?.receiptNo||'').trim();for(const k of KEYS){try{const x=parse(k);if(x&&String(x.receiptNo||'').trim()===n)localStorage.removeItem(k)}catch{}}try{const x=JSON.parse(localStorage.getItem(CALL_KEY)||'null');if(x&&String(x.number||'').trim()===n)localStorage.removeItem(CALL_KEY)}catch{}clearPending()}
function stage(){if(!record)return'';const url=airwaitUrl(record.shortUrl);if(!url)return'';savePending(record);return url}
function ready(){$('hold').disabled=!record||!$('agree').checked}
function showPending(){const p=readPending();const same=!!(record&&p&&String(p.receiptNo||'')===String(record.receiptNo||''));$('verify').hidden=!same;if(same){$('message').className='msg info';$('message').textContent='Airウェイトでキャンセル操作後、この画面に戻って完了確認を押してください。'}}
function openAirwait(){const url=stage();if(!url)return;$('message').className='msg info';$('message').textContent='Airウェイトのキャンセル画面へ移動します。ミニアプリの受付番号はまだ削除しません。';$('verify').hidden=false;setTimeout(()=>location.href=url,180)}
function down(e){if($('hold').disabled)return;e.preventDefault();holding=true;start=performance.now();const tick=n=>{if(!holding)return;const p=Math.min(100,(n-start)/1500*100);$('hold').style.setProperty('--progress',p.toFixed(1));if(p>=100){holding=false;$('hold').style.setProperty('--progress','0');openAirwait();return}raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick)}
function up(){holding=false;cancelAnimationFrame(raf);$('hold').style.setProperty('--progress','0')}
function cfg(){const c=window.ASOBOON_RECEPTION_CONFIG||{};return{key:String(c.airwaitApiKey||''),storeId:String(c.airwaitStoreId||'')}}
function apiOk(d){return d?.success===true||String(d?.resultCode?.code||'')==='0000'}
async function page(startAt){const c=cfg();if(!c.key||!c.storeId)throw new Error('Airウェイト接続設定を確認できません。');const res=await fetch(`${RES_API}?key=${encodeURIComponent(c.key)}`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded; charset=UTF-8'},body:new URLSearchParams({storeId:c.storeId,sortStatus:'0',isDesc:'0',start:String(startAt),limit:'100'}),cache:'no-store',credentials:'omit'});const d=await res.json();if(!res.ok||!apiOk(d))throw new Error(d?.resultCode?.defaultMessage||'Airウェイトを確認できません。');return{count:Number(d?.innerDto?.count||0),rows:Array.isArray(d?.innerDto?.reservations)?d.innerDto.reservations:[]}}
async function findReservation(){const no=String(record?.receiptNo||'').trim(),waitType=String(record?.waitTypeId||'').trim();let startAt=1,total=Infinity,guard=0;while(startAt<=total&&guard++<30){const p=await page(startAt);total=p.count||p.rows.length;const hits=p.rows.filter(x=>String(x?.number??x?.receiptNo??'').trim()===no);const exact=hits.find(x=>!waitType||String(x?.waitTypeId||'')===waitType)||hits[0];if(exact)return exact;if(!p.rows.length||startAt+p.rows.length>total)break;startAt+=p.rows.length}return null}
async function verifyCancellation(){if(checking||!record)return;checking=true;$('verify').disabled=true;$('verify').textContent='確認中…';$('message').className='msg info';$('message').textContent='Airウェイトのキャンセル状態を確認しています…';try{const row=await findReservation();if(row&&String(row.status)==='3'){clear(record);$('message').className='msg ok';$('message').textContent='キャンセル完了を確認しました。ミニアプリの受付番号も削除しました。';$('ticket').hidden=true;$('agreeRow').hidden=true;$('hold').hidden=true;$('verify').hidden=true;record=null;return}if(!row){$('message').className='msg bad';$('message').textContent='キャンセル完了を確認できませんでした。受付番号を削除せず保持しています。'}else{$('message').className='msg bad';$('message').textContent='Airウェイトではまだキャンセル完了になっていません。キャンセル操作を完了してから、もう一度確認してください。'}}catch(e){$('message').className='msg bad';$('message').textContent='キャンセル状態を確認できませんでした。受付番号は削除していません。通信状態をご確認ください。'}finally{checking=false;$('verify').disabled=false;$('verify').textContent='✓ キャンセル完了を確認する'}}
record=read();if(record){$('ticket').hidden=false;$('ticketNo').textContent=String(record.receiptNo);$('ticketType').textContent=String(record.waitTypeName||'受付');$('agreeRow').hidden=false;$('message').className='msg ok';$('message').textContent='キャンセル対象を確認しました。URL入力は不要です。'}else{$('message').className='msg bad';$('message').textContent='この端末に、ミニアプリから作成したキャンセル可能な受付がありません。受付番号やURLの入力は求めません。'}
$('agree').addEventListener('change',ready);$('hold').addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(n=>$('hold').addEventListener(n,up));$('verify').addEventListener('click',verifyCancellation);window.addEventListener('pageshow',showPending);window.addEventListener('focus',showPending);ready();showPending();
})();
</script></body></html>

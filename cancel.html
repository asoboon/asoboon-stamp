<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><meta name="theme-color" content="#0f2b46"><meta name="robots" content="noindex,nofollow,noarchive"><title>受付をキャンセル｜ASOBooN</title>
<style>
:root{--navy:#0f2b46;--red:#a74232;--red2:#fff0ed;--green:#27784f;--line:#d8c49b;--muted:#6d6353;--gold:#c79a42;--shadow:0 16px 38px rgba(49,36,18,.17)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;color:#2f291f}body{background:radial-gradient(circle at 12% 3%,rgba(255,255,255,.78),transparent 24%),linear-gradient(180deg,#eadab7,#f8efdd 56%,#e5d1a7)}button,a,input{font:inherit}button,a{-webkit-tap-highlight-color:transparent}.app{width:min(100%,520px);margin:auto;padding:max(12px,env(safe-area-inset-top)) 12px calc(34px + env(safe-area-inset-bottom))}.hero{padding:18px 16px;border:3px solid var(--gold);border-radius:24px;color:#fff7df;background:linear-gradient(155deg,var(--navy),#061a2b);box-shadow:var(--shadow)}.hero small{color:#e6c775;font-size:.64rem;font-weight:1000;letter-spacing:.12em}.hero h1{margin:6px 0 5px;font-size:1.55rem}.hero p{margin:0;color:#ded5c1;font-size:.76rem;line-height:1.6;font-weight:750}.card{margin-top:12px;padding:16px;border:2px solid var(--line);border-radius:20px;background:rgba(255,250,240,.98);box-shadow:var(--shadow)}.card h2{margin:0;color:var(--navy);font-size:1.05rem}.ticket{margin-top:12px;padding:14px;border-radius:16px;background:#e9f6ee;border:2px solid #82b596;text-align:center}.ticket small{display:block;color:#4d6e5b;font-size:.66rem;font-weight:850}.ticket strong{display:block;margin-top:4px;color:var(--navy);font-size:2.7rem;line-height:1;font-weight:1000}.ticket span{display:block;margin-top:5px;color:#496355;font-size:.68rem}.warn{margin-top:12px;padding:12px;border-left:5px solid var(--red);border-radius:12px;background:var(--red2);color:#7e3029;font-size:.73rem;line-height:1.6;font-weight:850}.check{display:flex;align-items:flex-start;gap:10px;margin-top:13px;padding:12px;border:1px solid #d9c7a7;border-radius:13px;background:#fff}.check input{width:24px;height:24px;flex:0 0 24px;margin:0;accent-color:var(--red)}.check span{font-size:.73rem;line-height:1.55;font-weight:850}.hold{position:relative;overflow:hidden;width:100%;min-height:62px;margin-top:12px;border:2px solid #8e332b;border-radius:15px;color:#fff;background:linear-gradient(180deg,#c95749,#9b352c);font-weight:1000;touch-action:none}.hold:disabled{opacity:.42}.hold::before{content:"";position:absolute;inset:0 auto 0 0;width:calc(var(--progress,0) * 1%);background:rgba(255,255,255,.22)}.hold span{position:relative;z-index:1}.msg{margin-top:10px;padding:10px 11px;border-radius:11px;font-size:.7rem;line-height:1.5}.msg.info{background:#edf5ff;color:#315a78}.msg.ok{background:#e8f6ed;color:#245f3d}.msg.bad{background:#fff0ed;color:#85362e}.help{margin-top:10px;color:var(--muted);font-size:.66rem;line-height:1.55}.links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.links a{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:13px;text-decoration:none;font-size:.72rem;font-weight:950}.home{background:var(--navy);color:#fff}.status{background:#f0e5cd;color:#4a3b27;border:1px solid #cfbc98}@media(max-width:380px){.links{grid-template-columns:1fr}}
</style></head>
<body><main class="app"><header class="hero"><small>ASOBooN / RESERVATION</small><h1>受付をキャンセル</h1><p>この端末で作った受付だけ、入力なしでキャンセル手続きへ進めます。</p></header><section class="card"><h2>キャンセルする受付</h2><div id="ticket" class="ticket" hidden><small>この端末の受付</small><strong id="ticketNo">--</strong><span id="ticketType"></span></div><div id="message" class="msg info">受付情報を確認しています…</div><div class="warn"><strong>重要：</strong>ミニアプリ側の受付番号は先に削除されます。そのあとAirウェイト画面で正式なキャンセルを完了してください。</div><label id="agreeRow" class="check" hidden><input id="agree" type="checkbox"><span>「キャンセル後は同じ受付番号に戻せない」ことを確認しました。</span></label><button id="hold" class="hold" type="button" disabled style="--progress:0"><span>1.5秒長押ししてキャンセルへ</span></button><div class="help">本人用URLの入力は不要です。受付時にミニアプリが保存したAirウェイトURLを自動で使います。</div><div class="links"><a class="status" href="./callstatus.html">呼出状況へ戻る</a><a class="home" href="./home.html">ミニアプリHOME</a></div></section></main>
<script>
(()=>{'use strict';const KEYS=['asoboon_current_reservation_v3','asoboon_current_reservation_v2','asoboon_reservation_rc3_current_v1'],CALL_KEY='asoboon_callstatus_number_v4',PENDING_KEY='asoboon_cancel_pending_v2',$=id=>document.getElementById(id);let record=null,holding=false,start=0,raf=0;
function unwrap(x){if(!x||typeof x!=='object')return null;const r=x.reservation&&typeof x.reservation==='object'?x.reservation:x;return {...x,...r}}function parse(k){try{return unwrap(JSON.parse(localStorage.getItem(k)||'null'))}catch{return null}}function airwaitUrl(v){try{const u=new URL(String(v||''));return u.protocol==='https:'&&/(^|\.)airwait\.jp$/i.test(u.hostname)?u.href:''}catch{return''}}function read(){for(const k of KEYS){const r=parse(k);if(r?.receiptNo&&airwaitUrl(r.shortUrl))return {...r,_key:k}}return null}function clear(r){const n=String(r?.receiptNo||'').trim();for(const k of KEYS){try{const x=parse(k);if(x&&String(x.receiptNo||'').trim()===n)localStorage.removeItem(k)}catch{}}try{const x=JSON.parse(localStorage.getItem(CALL_KEY)||'null');if(x&&String(x.number||'').trim()===n)localStorage.removeItem(CALL_KEY)}catch{}}
function stage(){if(!record)return'';const url=airwaitUrl(record.shortUrl);if(!url)return'';try{localStorage.setItem(PENDING_KEY,JSON.stringify({...record,cancelStagedAt:Date.now()}))}catch{}clear(record);return url}function ready(){$('hold').disabled=!record||!$('agree').checked}function open(){const url=stage();if(!url)return;$('message').className='msg ok';$('message').textContent='ミニアプリの受付番号を削除しました。Airウェイトのキャンセル画面へ移動します。';setTimeout(()=>location.href=url,180)}function down(e){if($('hold').disabled)return;e.preventDefault();holding=true;start=performance.now();const tick=n=>{if(!holding)return;const p=Math.min(100,(n-start)/1500*100);$('hold').style.setProperty('--progress',p.toFixed(1));if(p>=100){holding=false;$('hold').style.setProperty('--progress','0');open();return}raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick)}function up(){holding=false;cancelAnimationFrame(raf);$('hold').style.setProperty('--progress','0')}
record=read();if(record){$('ticket').hidden=false;$('ticketNo').textContent=String(record.receiptNo);$('ticketType').textContent=String(record.waitTypeName||'受付');$('agreeRow').hidden=false;$('message').className='msg ok';$('message').textContent='キャンセル対象を確認しました。URL入力は不要です。'}else{$('message').className='msg bad';$('message').textContent='この端末に、ミニアプリから作成したキャンセル可能な受付がありません。受付番号やURLの入力は求めません。'}$('agree').addEventListener('change',ready);$('hold').addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(n=>$('hold').addEventListener(n,up));ready();
})();
</script></body></html>

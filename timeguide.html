<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#15191d" />
  <title>ASOBooN 何時まであそべる？</title>

  <style>
    :root {
      --yellow: #f5bd22;
      --yellow-light: #ffe16d;
      --orange: #f27a24;
      --red: #d94236;
      --ink: #171a1d;
      --panel: #242b32;
      --white: #ffffff;
      --muted: #d9e0e5;
      --safe-top: max(24px, env(safe-area-inset-top));
      --safe-bottom: max(24px, env(safe-area-inset-bottom));
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #111418;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
      color: var(--white);
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior: none;
    }

    button,
    input {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 4px solid #ffffff;
      outline-offset: 3px;
    }

    .screen {
      min-height: 100vh;
      min-height: 100dvh;
      padding: var(--safe-top) 12px var(--safe-bottom);
      background:
        radial-gradient(circle at 50% -8%, rgba(245, 189, 34, .34), transparent 31%),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 64px 64px,
        linear-gradient(0deg, rgba(255,255,255,.03) 1px, transparent 1px) 0 0 / 64px 64px,
        linear-gradient(180deg, #3d454d 0%, #222930 44%, #101419 100%);
    }

    .screen::before,
    .screen::after {
      content: "";
      position: fixed;
      left: 0;
      right: 0;
      height: 18px;
      z-index: 10;
      background: repeating-linear-gradient(135deg, var(--yellow) 0 22px, #171a1d 22px 44px);
      box-shadow: 0 4px 12px rgba(0,0,0,.34);
      pointer-events: none;
    }

    .screen::before { top: 0; }
    .screen::after { bottom: 0; transform: rotate(180deg); }

    .panel {
      width: min(100%, 680px);
      margin: 0 auto;
      display: grid;
      gap: 14px;
      padding: clamp(15px, 3vw, 26px);
      border: 5px solid #0d1013;
      border-radius: 30px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.14), transparent 28%),
        linear-gradient(180deg, rgba(77,86,95,.98), rgba(27,32,38,.98));
      box-shadow:
        inset 0 0 0 3px rgba(255,255,255,.08),
        0 16px 0 rgba(0,0,0,.23),
        0 30px 60px rgba(0,0,0,.42);
    }

    .header { text-align: center; }

    .header small {
      display: block;
      color: var(--yellow);
      font-size: clamp(.68rem, 1.8vw, .86rem);
      font-weight: 900;
      letter-spacing: .16em;
    }

    .header h1 {
      margin: 4px 0 4px;
      font-size: clamp(1.85rem, 7vw, 3rem);
      line-height: 1.05;
      font-weight: 1000;
    }

    .header p {
      margin: 0;
      color: var(--muted);
      font-size: clamp(.88rem, 2.8vw, 1.05rem);
      font-weight: 800;
      line-height: 1.45;
    }

    .step-card {
      padding: 15px;
      border: 3px solid rgba(255,255,255,.16);
      border-radius: 24px;
      background: rgba(8,11,15,.74);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.04), 0 12px 24px rgba(0,0,0,.22);
    }

    .step-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin: 0 0 12px;
      color: var(--yellow-light);
      font-size: clamp(1.05rem, 3.6vw, 1.4rem);
      font-weight: 1000;
    }

    .step-number {
      display: inline-grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--yellow);
      color: var(--ink);
      font-size: .95rem;
      box-shadow: 0 4px 0 rgba(0,0,0,.25);
    }

    .time-input-wrap {
      position: relative;
      width: min(100%, 440px);
      margin: 0 auto;
    }

    .time-input-wrap::after {
      content: "タップして時刻を選ぶ";
      display: block;
      margin-top: 8px;
      color: #ffffff;
      text-align: center;
      font-size: clamp(.78rem, 2.5vw, .95rem);
      font-weight: 900;
    }

    .time-input {
      display: block;
      width: 100%;
      min-height: 88px;
      padding: 8px 18px;
      border: 5px solid #111418;
      border-radius: 22px;
      background: linear-gradient(180deg, #ffffff, #dfe4e8);
      color: var(--ink);
      text-align: center;
      font-size: clamp(2.7rem, 14vw, 5rem);
      font-weight: 1000;
      font-variant-numeric: tabular-nums;
      letter-spacing: .02em;
      box-shadow: 0 8px 0 rgba(0,0,0,.30), 0 14px 26px rgba(0,0,0,.20);
      cursor: pointer;
    }

    .time-input::-webkit-calendar-picker-indicator {
      width: 34px;
      height: 34px;
      padding: 8px;
      border-radius: 50%;
      background-color: var(--yellow);
      cursor: pointer;
    }

    .minute-badge {
      width: fit-content;
      margin: 12px auto 0;
      padding: 7px 13px;
      border: 2px solid rgba(255,255,255,.24);
      border-radius: 999px;
      background: #2f3740;
      color: #ffffff;
      font-size: clamp(.82rem, 2.6vw, .98rem);
      font-weight: 900;
    }

    .minute-badge strong { color: var(--yellow-light); }

    .adjust-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1.25fr;
      gap: 8px;
      width: min(100%, 480px);
      margin: 12px auto 0;
    }

    .adjust-row button {
      min-height: 50px;
      border: 2px solid rgba(255,255,255,.26);
      border-radius: 14px;
      background: linear-gradient(180deg, #4b545d, #2b3239);
      color: #ffffff;
      font-size: clamp(.86rem, 2.8vw, 1rem);
      font-weight: 1000;
      box-shadow: 0 5px 0 rgba(0,0,0,.26);
      cursor: pointer;
    }

    .adjust-row button:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 rgba(0,0,0,.26);
    }

    .adjust-row .now-button {
      border-color: #ffffff;
      background: linear-gradient(180deg, var(--yellow-light), var(--yellow));
      color: var(--ink);
    }

    .duration-wrap {
      display: grid;
      justify-items: center;
      gap: 5px;
      margin-top: 14px;
    }

    .duration-label {
      color: rgba(255,255,255,.72);
      font-size: .78rem;
      font-weight: 900;
      letter-spacing: .08em;
    }

    .duration-switch {
      width: min(100%, 360px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 5px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 13px;
      background: rgba(7,10,13,.58);
    }

    .duration-switch button {
      min-height: 44px;
      border: 1px solid transparent;
      border-radius: 9px;
      color: #dce1e5;
      background: #343b42;
      font-size: .9rem;
      font-weight: 1000;
      cursor: pointer;
    }

    .duration-switch button[aria-pressed="true"] {
      color: var(--ink);
      border-color: #fff;
      background: linear-gradient(180deg, var(--yellow-light), var(--yellow));
      box-shadow: 0 4px 0 rgba(0,0,0,.24);
    }

    .result-card {
      position: relative;
      overflow: hidden;
      padding: clamp(18px, 4vw, 28px) 12px;
      border: 5px solid var(--yellow-light);
      border-radius: 28px;
      background:
        radial-gradient(circle at 50% -10%, rgba(255,225,109,.22), transparent 45%),
        linear-gradient(180deg, #292f35, #0e1115);
      text-align: center;
      box-shadow:
        inset 0 0 0 3px rgba(255,255,255,.08),
        0 12px 0 rgba(0,0,0,.25),
        0 18px 34px rgba(0,0,0,.34),
        0 0 34px rgba(245,189,34,.18);
    }

    .result-card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(105deg, transparent 0 38%, rgba(255,255,255,.12) 48%, transparent 58%) -145% 0 / 75% 100% no-repeat;
      animation: sheen 3.2s ease-in-out infinite;
    }

    .result-label,
    .result-time,
    .result-sub,
    .result-note {
      position: relative;
      z-index: 1;
    }

    .result-label {
      color: #ffffff;
      font-size: clamp(1rem, 3.4vw, 1.35rem);
      font-weight: 1000;
    }

    .result-time {
      display: block;
      margin: 4px auto 5px;
      color: var(--yellow-light);
      font-size: clamp(5.2rem, 24vw, 9rem);
      font-weight: 1000;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.05em;
      line-height: .95;
      text-shadow: 0 8px 0 rgba(0,0,0,.35), 0 0 34px rgba(245,189,34,.30);
      white-space: nowrap;
    }

    .result-sub {
      color: #ffffff;
      font-size: clamp(1.15rem, 4vw, 1.65rem);
      font-weight: 1000;
    }

    .result-note {
      margin: 8px 0 0;
      color: #dce2e7;
      font-size: clamp(.78rem, 2.4vw, .98rem);
      font-weight: 800;
    }

    .current-strip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 11px 14px;
      border: 2px solid rgba(255,255,255,.18);
      border-radius: 16px;
      background: rgba(7,10,13,.48);
      color: #dbe0e4;
      font-size: clamp(.84rem, 2.6vw, 1rem);
      font-weight: 900;
    }

    .current-strip time {
      color: #ffffff;
      font-size: clamp(1.4rem, 5vw, 2rem);
      font-weight: 1000;
      font-variant-numeric: tabular-nums;
    }

    .error-message {
      margin: 8px 0 0;
      color: #ffd6d1;
      text-align: center;
      font-size: .88rem;
      font-weight: 900;
    }

    @media (max-width: 360px) {
      .screen { padding-left: 7px; padding-right: 7px; }
      .panel { padding: 12px 9px; gap: 10px; border-radius: 24px; }
      .step-card { padding: 12px 9px; }
      .time-input { min-height: 76px; padding-left: 8px; padding-right: 8px; }
      .adjust-row { gap: 5px; }
      .adjust-row button { min-height: 46px; font-size: .78rem; }
      .result-card { padding-left: 6px; padding-right: 6px; }
    }

    @media (max-height: 720px) and (orientation: portrait) {
      .panel { gap: 8px; padding-top: 10px; padding-bottom: 10px; }
      .header p { display: none; }
      .step-card { padding-top: 10px; padding-bottom: 10px; }
      .step-title { margin-bottom: 8px; }
      .time-input { min-height: 68px; }
      .minute-badge { margin-top: 8px; padding-top: 5px; padding-bottom: 5px; }
      .adjust-row { margin-top: 8px; }
      .adjust-row button { min-height: 42px; }
      .duration-wrap { margin-top: 10px; }
      .result-card { padding-top: 12px; padding-bottom: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }

    @keyframes sheen {
      0%, 55% { background-position: -145% 0; }
      85%, 100% { background-position: 245% 0; }
    }
  </style>
</head>

<body>
  <main class="screen" aria-label="何時まで遊べるかを確認する画面">
    <div class="panel">
      <header class="header">
        <small>ASOBooN TIME GUIDE</small>
        <h1>何時まであそべる？</h1>
        <p>入場した時刻を選ぶだけで、お帰り時間をすぐ確認できます</p>
      </header>

      <section class="step-card" aria-labelledby="entry-title">
        <h2 class="step-title" id="entry-title">
          <span class="step-number">1</span>
          入場した時刻を選ぶ
        </h2>

        <div class="time-input-wrap">
          <input
            class="time-input"
            id="entry-time"
            type="time"
            step="60"
            inputmode="numeric"
            aria-label="入場した時刻"
          />
        </div>

        <div class="minute-badge">分は <strong>1分単位</strong> で選べます</div>
        <p class="error-message" id="error-message" hidden>時刻を選んでください</p>

        <div class="adjust-row" aria-label="入場時刻の微調整">
          <button type="button" id="minus-minute">−1分</button>
          <button type="button" id="plus-minute">＋1分</button>
          <button type="button" class="now-button" id="set-now">現在時刻</button>
        </div>

        <div class="duration-wrap">
          <div class="duration-label">利用時間</div>
          <div class="duration-switch" role="group" aria-label="利用時間を選択">
            <button type="button" data-minutes="150" aria-pressed="true">2時間30分</button>
            <button type="button" data-minutes="180" aria-pressed="false">3時間</button>
          </div>
        </div>
      </section>

      <section class="result-card" aria-live="polite" aria-labelledby="result-title">
        <div class="result-label" id="result-title">お帰り時間</div>
        <time class="result-time" id="leave-time">--:--</time>
        <div class="result-sub">まで遊べます</div>
        <p class="result-note" id="result-note">入場時刻を選ぶと自動で計算します</p>
      </section>

      <div class="current-strip" aria-live="off">
        <span>いまの時刻</span>
        <time id="current-time">--:--</time>
      </div>
    </div>
  </main>

  <script>
    (() => {
      "use strict";

      const DURATION_STORAGE_KEY = "asoboon-guide-duration";
      const ENTRY_STORAGE_KEY = "asoboon-guide-entry-time";

      const entryTime = document.getElementById("entry-time");
      const leaveTime = document.getElementById("leave-time");
      const currentTime = document.getElementById("current-time");
      const resultNote = document.getElementById("result-note");
      const errorMessage = document.getElementById("error-message");
      const minusMinute = document.getElementById("minus-minute");
      const plusMinute = document.getElementById("plus-minute");
      const setNowButton = document.getElementById("set-now");
      const durationButtons = [...document.querySelectorAll(".duration-switch button")];

      let durationMinutes = 150;

      const pad = (number) => String(number).padStart(2, "0");
      const formatTime = (date) => `${pad(date.getHours())}:${pad(date.getMinutes())}`;
      const durationText = (minutes) => minutes === 180 ? "3時間" : "2時間30分";

      function safeSave(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch (error) {
          console.warn("設定を保存できませんでした。", error);
        }
      }

      function safeRead(key) {
        try {
          return localStorage.getItem(key);
        } catch (error) {
          console.warn("設定を読み込めませんでした。", error);
          return null;
        }
      }

      function isValidTime(value) {
        const match = String(value || "").match(/^(\d{2}):(\d{2})$/);
        if (!match) return false;
        const hour = Number(match[1]);
        const minute = Number(match[2]);
        return hour >= 0 && hour <= 23 && minute >= 0 && minute <= 59;
      }

      function parseTime(value) {
        if (!isValidTime(value)) return null;
        const [hour, minute] = value.split(":").map(Number);
        const date = new Date();
        date.setHours(hour, minute, 0, 0);
        return date;
      }

      function readInitialDuration() {
        const queryValue = Number(new URLSearchParams(location.search).get("minutes"));
        if (queryValue === 150 || queryValue === 180) return queryValue;

        const stored = Number(safeRead(DURATION_STORAGE_KEY));
        return stored === 180 ? 180 : 150;
      }

      function readInitialEntryTime() {
        const queryValue = new URLSearchParams(location.search).get("entry");
        if (isValidTime(queryValue)) return queryValue;

        const stored = safeRead(ENTRY_STORAGE_KEY);
        if (isValidTime(stored)) return stored;

        return formatTime(new Date());
      }

      function updateResult() {
        const entry = parseTime(entryTime.value);
        if (!entry) {
          leaveTime.textContent = "--:--";
          leaveTime.removeAttribute("datetime");
          resultNote.textContent = "入場時刻を選ぶと自動で計算します";
          errorMessage.hidden = false;
          return;
        }

        errorMessage.hidden = true;
        const leave = new Date(entry.getTime() + durationMinutes * 60 * 1000);
        const entryText = formatTime(entry);
        const leaveText = formatTime(leave);
        const crossesDay = leave.getDate() !== entry.getDate();

        leaveTime.textContent = leaveText;
        leaveTime.setAttribute("datetime", leaveText);
        leaveTime.setAttribute("aria-label", `${leaveText}まで遊べます`);
        resultNote.textContent = `${entryText}入場・${durationText(durationMinutes)}利用${crossesDay ? "（翌日）" : ""}`;
        safeSave(ENTRY_STORAGE_KEY, entryText);
      }

      function setEntryFromDate(date) {
        entryTime.value = formatTime(date);
        updateResult();
      }

      function shiftEntryTime(deltaMinutes) {
        const base = parseTime(entryTime.value) || new Date();
        base.setMinutes(base.getMinutes() + deltaMinutes);
        setEntryFromDate(base);
      }

      function setDuration(minutes) {
        durationMinutes = minutes === 180 ? 180 : 150;
        safeSave(DURATION_STORAGE_KEY, String(durationMinutes));

        durationButtons.forEach((button) => {
          button.setAttribute(
            "aria-pressed",
            String(Number(button.dataset.minutes) === durationMinutes)
          );
        });

        updateResult();
      }

      function updateCurrentTime() {
        const now = new Date();
        currentTime.textContent = formatTime(now);
        currentTime.setAttribute("datetime", now.toISOString());
      }

      entryTime.addEventListener("input", updateResult);
      entryTime.addEventListener("change", updateResult);
      minusMinute.addEventListener("click", () => shiftEntryTime(-1));
      plusMinute.addEventListener("click", () => shiftEntryTime(1));
      setNowButton.addEventListener("click", () => setEntryFromDate(new Date()));

      durationButtons.forEach((button) => {
        button.addEventListener("click", () => setDuration(Number(button.dataset.minutes)));
      });

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) updateCurrentTime();
      });

      durationMinutes = readInitialDuration();
      entryTime.value = readInitialEntryTime();
      setDuration(durationMinutes);
      updateCurrentTime();
      setInterval(updateCurrentTime, 1000);
    })();
  </script>
</body>
</html>

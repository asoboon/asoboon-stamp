<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#15191d" />
  <title>ASOBooN お帰り時間案内</title>

  <style>
    :root {
      --yellow: #f5bd22;
      --yellow-light: #ffe16d;
      --red: #d94236;
      --red-dark: #8d211b;
      --ink: #171a1d;
      --steel: #454d55;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111418;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
      color: var(--white);
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior: none;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    [hidden] { display: none !important; }

    .clock-screen {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding:
        max(25px, env(safe-area-inset-top))
        18px
        max(25px, env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 50% -10%, rgba(245, 189, 34, .32), transparent 31%),
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px) 0 0 / 72px 72px,
        linear-gradient(0deg, rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 72px 72px,
        linear-gradient(180deg, #343b42 0%, #22272d 45%, #101317 100%);
    }

    .clock-screen::before,
    .clock-screen::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 24px;
      background: repeating-linear-gradient(135deg, var(--yellow) 0 22px, #171a1d 22px 44px);
      box-shadow: 0 4px 12px rgba(0,0,0,.34);
      pointer-events: none;
    }

    .clock-screen::before { top: 0; }
    .clock-screen::after { bottom: 0; transform: rotate(180deg); }

    .panel {
      width: min(calc(100vw - 36px), 798px);
      height: calc(100dvh - 50px);
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto auto;
      gap: clamp(10px, 1.35dvh, 17px);
      padding: clamp(18px, 2.5dvh, 28px) clamp(18px, 4vw, 32px);
      border: 5px solid #0d1013;
      border-radius: 34px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.14), transparent 28%),
        linear-gradient(180deg, rgba(77,86,95,.98), rgba(27,32,38,.98));
      box-shadow:
        inset 0 0 0 3px rgba(255,255,255,.08),
        0 16px 0 rgba(0,0,0,.23),
        0 30px 60px rgba(0,0,0,.42);
    }

    .header {
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      min-height: 44px;
    }

    .brand {
      display: grid;
      gap: 3px;
      font-weight: 900;
    }

    .brand small {
      color: var(--yellow);
      font-size: clamp(.68rem, 1.8vw, .88rem);
      letter-spacing: .17em;
    }

    .brand strong {
      color: #fff;
      font-size: clamp(1.05rem, 3.2vw, 1.45rem);
      line-height: 1.2;
    }

    .time-flow {
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto auto;
      align-content: center;
      justify-items: center;
      gap: clamp(10px, 1.45dvh, 17px);
      text-align: center;
    }

    .entry-hero {
      position: relative;
      overflow: hidden;
      width: min(100%, 720px);
      padding: clamp(16px, 2.1dvh, 24px) clamp(12px, 2.2vw, 20px) clamp(18px, 2.5dvh, 28px);
      border: 6px solid var(--yellow-light);
      border-radius: 30px;
      background:
        radial-gradient(circle at 50% -8%, rgba(255,225,109,.24), transparent 42%),
        linear-gradient(180deg, rgba(34,38,43,.99), rgba(10,12,16,.99));
      box-shadow:
        inset 0 0 0 4px rgba(255,255,255,.08),
        0 0 0 8px rgba(217,66,54,.16),
        0 18px 36px rgba(0,0,0,.40),
        0 0 42px rgba(245,189,34,.20);
      animation: warningFrame 1.35s ease-in-out infinite;
    }

    .entry-hero::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, transparent 0 42%, rgba(255,255,255,.20) 48%, transparent 54%) -130% 0 / 70% 100% no-repeat,
        linear-gradient(180deg, rgba(217,66,54,.18), transparent 20%);
      animation: warningSweep 2.3s linear infinite;
    }

    .warning-lights {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      gap: clamp(10px, 2.4vw, 18px);
      margin-bottom: clamp(9px, 1.2dvh, 14px);
    }

    .warning-lights span {
      width: clamp(14px, 2.5vw, 20px);
      height: clamp(14px, 2.5vw, 20px);
      border: 3px solid rgba(255,255,255,.8);
      border-radius: 50%;
      background: var(--red);
      box-shadow:
        0 0 0 4px rgba(217,66,54,.16),
        0 0 18px rgba(255,72,62,.62);
      animation: warningLamp 1s steps(1, end) infinite;
    }

    .warning-lights span:nth-child(even) {
      animation-delay: .5s;
    }

    .entry-label {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 22px;
      margin-bottom: 10px;
      border: 3px solid #111418;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--yellow-light), var(--yellow));
      color: var(--ink);
      box-shadow: 0 5px 0 rgba(0,0,0,.23);
      font-size: clamp(1.08rem, 3.9vw, 1.58rem);
      font-weight: 1000;
      line-height: 1.15;
    }

    .entry-time {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      max-width: 100%;
      text-align: center;
      color: var(--yellow-light);
      font-size: clamp(9.8rem, 34vw, 16.2rem);
      font-weight: 1000;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
      letter-spacing: -.045em;
      line-height: .88;
      white-space: nowrap;
      text-shadow:
        0 9px 0 rgba(0,0,0,.38),
        0 0 28px rgba(245,189,34,.30),
        0 0 58px rgba(245,189,34,.25),
        0 0 74px rgba(217,66,54,.18);
      animation: clockUrgency 1.2s ease-in-out infinite;
    }

    .entry-sub {
      position: relative;
      z-index: 1;
      margin-top: 12px;
      padding: 10px 16px;
      border-top: 3px solid rgba(255,255,255,.20);
      color: #ffffff;
      font-size: clamp(1.35rem, 4.7vw, 2.15rem);
      font-weight: 1000;
      line-height: 1.18;
      text-shadow: 0 3px 0 rgba(0,0,0,.28);
    }

    .time-connector {
      position: relative;
      width: min(74%, 430px);
      height: 24px;
    }

    .time-connector::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 5px;
      border-radius: 999px;
      background: repeating-linear-gradient(90deg, var(--yellow) 0 18px, rgba(255,255,255,.18) 18px 31px);
      box-shadow: 0 0 14px rgba(245,189,34,.34);
      transform: translateY(-50%);
      animation: connectorMove 1s linear infinite;
    }

    .time-connector::after {
      content: "";
      position: absolute;
      right: -1px;
      top: 50%;
      width: 17px;
      height: 17px;
      border-top: 6px solid var(--yellow);
      border-right: 6px solid var(--yellow);
      transform: translateY(-50%) rotate(45deg);
    }

    .now-card {
      width: min(100%, 430px);
      padding: 10px 18px 12px;
      border: 2px solid rgba(255,255,255,.24);
      border-radius: 18px;
      background: rgba(7,10,13,.55);
      box-shadow: inset 0 0 18px rgba(0,0,0,.20);
    }

    .now-card span {
      display: block;
      color: #dbe0e4;
      font-size: clamp(.86rem, 2.7vw, 1.08rem);
      font-weight: 900;
      line-height: 1.1;
    }

    .now-card time {
      display: block;
      margin-top: 4px;
      color: #ffffff;
      font-size: clamp(2.7rem, 9.5vw, 4.2rem);
      font-weight: 1000;
      font-variant-numeric: tabular-nums;
      line-height: .95;
      letter-spacing: -.04em;
    }

    .switch-wrap {
      display: grid;
      justify-items: center;
      gap: 5px;
    }

    .switch-label {
      color: rgba(255,255,255,.66);
      font-size: clamp(.68rem, 1.7vw, .82rem);
      font-weight: 900;
      letter-spacing: .08em;
    }

    .switch {
      width: min(100%, 360px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 5px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 13px;
      background: rgba(7,10,13,.58);
    }

    .switch button {
      min-height: clamp(38px, 4.2dvh, 46px);
      border: 1px solid transparent;
      border-radius: 9px;
      color: #dce1e5;
      background: #343b42;
      font-size: clamp(.76rem, 2.1vw, .94rem);
      font-weight: 1000;
      cursor: pointer;
    }

    .switch button[aria-pressed="true"] {
      color: var(--ink);
      border-color: #fff;
      background: linear-gradient(180deg, var(--yellow-light), var(--yellow));
      box-shadow: 0 5px 0 rgba(0,0,0,.24);
    }

    .tap-note {
      width: min(100%, 660px);
      min-height: clamp(66px, 8dvh, 88px);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px 18px;
      border: 4px solid #ffffff;
      border-radius: 22px;
      background: linear-gradient(180deg, var(--yellow-light), var(--yellow));
      color: var(--ink);
      text-align: center;
      font-size: clamp(1.25rem, 4.2vw, 1.95rem);
      font-weight: 1000;
      line-height: 1.18;
      box-shadow:
        0 8px 0 rgba(0,0,0,.24),
        0 15px 26px rgba(0,0,0,.26),
        0 0 24px rgba(245,189,34,.22);
      animation: tapPulse 1.5s ease-in-out infinite;
    }

    .tap-note::before {
      content: "👆";
      font-size: 1.35em;
      line-height: 1;
    }

    @media (orientation: portrait) and (max-height: 1050px) {
      .panel {
        gap: 8px;
        padding-top: 16px;
        padding-bottom: 18px;
      }
      .header { min-height: 36px; }
      .entry-hero { padding-top: 10px; padding-bottom: 14px; }
      .entry-time { font-size: clamp(8.9rem, 31.5vw, 14.5rem); }
      .time-flow { gap: 7px; }
      .time-connector { height: 18px; }
      .now-card time { font-size: clamp(2.5rem, 8.7vw, 3.9rem); }
      .switch button { min-height: 38px; }
      .tap-note { min-height: 64px; }
    }

    .rotate-message { display: none; }

    @media (orientation: landscape) {
      .panel { display: none; }
      .rotate-message {
        display: grid;
        place-items: center;
        width: min(86vw, 680px);
        min-height: 54vh;
        padding: 40px;
        border: 5px solid var(--yellow);
        border-radius: 28px;
        background: #22282e;
        color: #fff;
        text-align: center;
        font-size: clamp(1.5rem, 4vw, 2.5rem);
        font-weight: 1000;
        line-height: 1.5;
        box-shadow: 0 22px 48px rgba(0,0,0,.42);
      }
    }

    @keyframes pulse {
      0%, 100% { opacity: .62; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-2px); }
    }

    @keyframes tapPulse {
      0%, 100% {
        transform: scale(1);
        filter: brightness(1);
      }
      50% {
        transform: scale(1.018);
        filter: brightness(1.08);
      }
    }




    @keyframes warningFrame {
      0%, 100% {
        border-color: var(--yellow-light);
        box-shadow:
          inset 0 0 0 4px rgba(255,255,255,.08),
          0 0 0 8px rgba(217,66,54,.14),
          0 18px 36px rgba(0,0,0,.40),
          0 0 34px rgba(245,189,34,.18);
      }
      50% {
        border-color: #ffffff;
        box-shadow:
          inset 0 0 0 4px rgba(255,255,255,.12),
          0 0 0 10px rgba(217,66,54,.30),
          0 18px 36px rgba(0,0,0,.40),
          0 0 56px rgba(255,70,60,.34);
      }
    }

    @keyframes warningSweep {
      to { background-position: 240% 0, 0 0; }
    }

    @keyframes warningLamp {
      0%, 49% {
        opacity: 1;
        filter: brightness(1.55);
      }
      50%, 100% {
        opacity: .25;
        filter: brightness(.65);
      }
    }

    @keyframes clockUrgency {
      0%, 100% {
        transform: scale(1);
        filter: brightness(1);
      }
      50% {
        transform: scale(1.025);
        filter: brightness(1.22);
      }
    }

    @keyframes connectorMove {
      to { background-position-x: 31px; }
    }

    .guide-shell {
      position: fixed;
      inset: 0;
      z-index: 5;
      background: #111418;
    }

    .guide-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #111418;
    }

    .manual-back {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      right: 10px;
      z-index: 15;
      min-height: 46px;
      padding: 8px 15px;
      border: 2px solid #111418;
      border-radius: 999px;
      color: #171a1d;
      background: var(--yellow);
      box-shadow: 0 5px 0 rgba(0,0,0,.25);
      font-size: .82rem;
      font-weight: 1000;
    }
  </style>
</head>

<body>
  <section class="clock-screen" id="clock-screen" aria-label="お帰り時間のご案内">
    <div class="panel">
      <header class="header">
        <div class="brand">
          <small>ASOBooN TIME GUIDE</small>
          <strong>お帰り時間のご案内</strong>
        </div>
      </header>

      <main class="time-flow">
        <div class="entry-hero">
          <div class="warning-lights" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <div class="entry-label">入場時刻</div>
          <time class="entry-time" id="entry-time">--:--</time>
          <div class="entry-sub">おかえりの時間です</div>
        </div>

        <div class="time-connector" aria-hidden="true"></div>

        <div class="now-card" aria-live="polite">
          <span>現在時刻</span>
          <time id="current-time">--:--</time>
        </div>
      </main>

      <div class="switch-wrap">
        <div class="switch-label">利用時間の設定</div>
        <div class="switch" role="group" aria-label="利用時間を選択">
          <button type="button" data-minutes="150" aria-pressed="true">2時間30分</button>
          <button type="button" data-minutes="180" aria-pressed="false">3時間</button>
        </div>
      </div>

      <p class="tap-note">画面をタッチして<br />利用案内を表示</p>
    </div>

    <div class="rotate-message">
      iPadを縦向きにして<br />ご利用ください
    </div>
  </section>

  <section class="guide-shell" id="guide-shell" hidden>
    <button class="manual-back" id="manual-back" type="button">時間画面へ戻る</button>
    <iframe
      class="guide-frame"
      id="guide-frame"
      src="./jounaisetumei.html"
      title="ASOBooN ご利用案内"
    ></iframe>
  </section>

  <script>
    (() => {
      const IDLE_MS = 30 * 1000;

      const clockScreen = document.getElementById("clock-screen");
      const guideShell = document.getElementById("guide-shell");
      const guideFrame = document.getElementById("guide-frame");
      const manualBack = document.getElementById("manual-back");
      const currentTime = document.getElementById("current-time");
      const entryTime = document.getElementById("entry-time");
      const durationButtons = [...document.querySelectorAll(".switch button")];

      let durationMinutes = Number(localStorage.getItem("asoboon-guide-duration")) || 150;
      let idleTimer = null;

      const pad = (number) => String(number).padStart(2, "0");
      const formatTime = (date) => `${pad(date.getHours())}:${pad(date.getMinutes())}`;

      function updateClock() {
        const now = new Date();
        const entered = new Date(now.getTime() - durationMinutes * 60 * 1000);
        currentTime.textContent = formatTime(now);
        entryTime.textContent = formatTime(entered);
      }

      function setDuration(minutes) {
        durationMinutes = minutes === 180 ? 180 : 150;
        localStorage.setItem("asoboon-guide-duration", String(durationMinutes));

        durationButtons.forEach((button) => {
          button.setAttribute(
            "aria-pressed",
            String(Number(button.dataset.minutes) === durationMinutes)
          );
        });

        updateClock();
      }

      function showClock() {
        clearTimeout(idleTimer);
        guideShell.hidden = true;
        clockScreen.hidden = false;
        updateClock();
      }

      function resetIdleTimer() {
        if (guideShell.hidden) return;
        clearTimeout(idleTimer);
        idleTimer = setTimeout(showClock, IDLE_MS);
      }

      function showGuide() {
        clockScreen.hidden = true;
        guideShell.hidden = false;
        resetIdleTimer();
      }

      function bindIframeActivity() {
        try {
          const doc = guideFrame.contentDocument;
          const win = guideFrame.contentWindow;
          if (!doc || !win) return;

          ["pointerdown", "touchstart", "click", "keydown"].forEach((eventName) => {
            doc.addEventListener(eventName, resetIdleTimer, { passive: true });
          });

          win.addEventListener("scroll", resetIdleTimer, { passive: true });
        } catch (error) {
          console.warn("案内画面の操作監視を設定できませんでした。", error);
        }
      }

      durationButtons.forEach((button) => {
        button.addEventListener("pointerdown", (event) => event.stopPropagation());
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          setDuration(Number(button.dataset.minutes));
        });
      });

      clockScreen.addEventListener("click", showGuide);
      manualBack.addEventListener("click", showClock);
      guideFrame.addEventListener("load", bindIframeActivity);

      document.addEventListener("pointerdown", resetIdleTimer, { passive: true });
      document.addEventListener("touchstart", resetIdleTimer, { passive: true });
      document.addEventListener("keydown", resetIdleTimer);

      setDuration(durationMinutes);
      updateClock();
      setInterval(updateClock, 1000);
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#15191d" />
  <title>ASOBooN 何時まであそべる？</title>

  <style>
    :root {
      --yellow: #f5bd22;
      --yellow-light: #ffe16d;
      --red: #d94236;
      --ink: #171a1d;
      --steel: #454d55;
      --white: #ffffff;
      --safe-top: max(24px, env(safe-area-inset-top));
      --safe-bottom: max(24px, env(safe-area-inset-bottom));
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #111418;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
      color: var(--white);
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior: none;
    }

    button, select {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    button:focus-visible,
    select:focus-visible {
      outline: 4px solid #ffffff;
      outline-offset: 3px;
    }

    [hidden] { display: none !important; }

    .clock-screen {
      min-height: 100vh;
      min-height: 100dvh;
      padding: var(--safe-top) 14px var(--safe-bottom);
      background:
        radial-gradient(circle at 50% -10%, rgba(245, 189, 34, .30), transparent 31%),
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px) 0 0 / 72px 72px,
        linear-gradient(0deg, rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 72px 72px,
        linear-gradient(180deg, #3d454d 0%, #222930 44%, #101419 100%);
    }

    .clock-screen::before,
    .clock-screen::after {
      content: "";
      position: fixed;
      left: 0;
      right: 0;
      height: 18px;
      z-index: 10;
      background: repeating-linear-gradient(135deg, var(--yellow) 0 22px, #171a1d 22px 44px);
      box-shadow: 0 4px 12px rgba(0,0,0,.34);
      pointer-events: none;
    }

    .clock-screen::before { top: 0; }
    .clock-screen::after { bottom: 0; transform: rotate(180deg); }

    .panel {
      width: min(100%, 760px);
      min-height: calc(100dvh - var(--safe-top) - var(--safe-bottom));
      margin: 0 auto;
      display: grid;
      align-content: start;
      gap: 12px;
      padding: clamp(16px, 2.4vw, 26px);
      border: 5px solid #0d1013;
      border-radius: 30px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.14), transparent 28%),
        linear-gradient(180deg, rgba(77,86,95,.98), rgba(27,32,38,.98));
      box-shadow:
        inset 0 0 0 3px rgba(255,255,255,.08),
        0 16px 0 rgba(0,0,0,.23),
        0 30px 60px rgba(0,0,0,.42);
    }

    .header {
      text-align: center;
    }

    .header small {
      display: block;
      color: var(--yellow);
      font-size: clamp(.68rem, 1.8vw, .88rem);
      font-weight: 900;
      letter-spacing: .16em;
    }

    .header h1 {
      margin: 4px 0 3px;
      font-size: clamp(1.8rem, 6vw, 3rem);
      line-height: 1.05;
      font-weight: 1000;
    }

    .header p {
      margin: 0;
      color: #dce2e7;
      font-size: clamp(.88rem, 2.6vw, 1.08rem);
      font-weight: 800;
      line-height: 1.45;
    }

    .time-input-card {
      padding: 14px;
      border: 3px solid rgba(255,255,255,.18);
      border-radius: 24px;
      background: rgba(8,11,15,.72);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.04), 0 12px 24px rgba(0,0,0,.22);
    }

    .input-title {
      margin: 0 0 10px;
      text-align: center;
      color: var(--yellow-light);
      font-size: clamp(1.05rem, 3.4vw, 1.35rem);
      font-weight: 1000;
    }

    .time-picker {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      width: min(100%, 520px);
      margin: 0 auto;
    }

    .picker-field {
      display: grid;
      gap: 5px;
      min-width: 0;
    }

    .picker-field label {
      color: #d9e0e5;
      text-align: center;
      font-size: .8rem;
      font-weight: 900;
    }

    .picker-field select {
      width: 100%;
      min-height: 72px;
      border: 4px solid #111418;
      border-radius: 18px;
      appearance: auto;
      background: linear-gradient(180deg, #ffffff, #dfe4e8);
      color: var(--ink);
      text-align: center;
      text-align-last: center;
      font-size: clamp(2rem, 9vw, 4rem);
      font-weight: 1000;
      font-variant-numeric: tabular-nums;
      box-shadow: 0 7px 0 rgba(0,0,0,.28);
      cursor: pointer;
    }

    .picker-colon {
      margin-top: 22px;
      color: var(--yellow-light);
      font-size: clamp(2.3rem, 8vw, 4rem);
      font-weight: 1000;
      line-height: 1;
    }

    .minute-note {
      margin: 10px 0 0;
      text-align: center;
      color: #ffffff;
      font-size: clamp(.82rem, 2.5vw, 1rem);
      font-weight: 900;
    }

    .minute-note strong { color: var(--yellow-light); }

    .adjust-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1.25fr;
      gap: 8px;
      width: min(100%, 520px);
      margin: 11px auto 0;
    }

    .adjust-row button {
      min-height: 48px;
      border: 2px solid rgba(255,255,255,.26);
      border-radius: 14px;
      background: linear-gradient(180deg, #4b545d, #2b3239);
      color: #ffffff;
      font-size: clamp(.86rem, 2.8vw, 1rem);
      font-weight: 1000;
      box-shadow: 0 5px 0 rgba(0,0,0,.26);
      cursor: pointer;
    }

    .adjust-row button:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 rgba(0,0,0,.26);
    }

    .adjust-row .now-button {
      background: linear-gradient(180deg, var(--yellow-light), var(--yellow));
      color: var(--ink);
      border-color: #ffffff;
    }

    .result-card {
      position: relative;
      overflow: hidden;
      padding: clamp(16px, 3vw, 24px);
      border: 5px solid var(--yellow-light);
      border-radius: 28px;
      background:
        radial-gradient(circle at 50% -10%, rgba(255,225,109,.22), transparent 45%),
        linear-gradient(180deg, #292f35, #0e1115);
      text-align: center;
      box-shadow:
        inset 0 0 0 3px rgba(255,255,255,.08),
        0 12px 0 rgba(0,0,0,.25),
        0 18px 34px rgba(0,0,0,.34),
        0 0 34px rgba(245,189,34,.18);
    }

    .result-card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(105deg, transparent 0 38%, rgba(255,255,255,.12) 48%, transparent 58%) -145% 0 / 75% 100% no-repeat;
      animation: sheen 3.2s ease-in-out infinite;
    }

    .result-label,
    .result-time,
    .result-sub {
      position: relative;
      z-index: 1;
    }

    .result-label {
      color: #ffffff;
      font-size: clamp(1rem, 3.3vw, 1.35rem);
      font-weight: 1000;
    }

    .result-time {
      display: block;
      margin: 3px auto 4px;
      color: var(--yellow-light);
      font-size: clamp(5rem, 23vw, 10rem);
      font-weight: 1000;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.05em;
      line-height: .95;
      text-shadow: 0 8px 0 rgba(0,0,0,.35), 0 0 34px rgba(245,189,34,.30);
      white-space: nowrap;
    }

    .result-sub {
      color: #ffffff;
      font-size: clamp(1.1rem, 4vw, 1.65rem);
      font-weight: 1000;
    }

    .result-note {
      position: relative;
      z-index: 1;
      margin: 7px 0 0;
      color: #dce2e7;
      font-size: clamp(.78rem, 2.3vw, .98rem);
      font-weight: 800;
    }

    .now-card {
      display: grid;
      grid-template-columns: auto auto;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: min(100%, 520px);
      margin: 0 auto;
      padding: 10px 17px;
      border: 2px solid rgba(255,255,255,.22);
      border-radius: 18px;
      background: rgba(7,10,13,.55);
    }

    .now-card__digital { text-align: center; }
    .now-card__digital span {
      display: block;
      color: #dbe0e4;
      font-size: .9rem;
      font-weight: 900;
    }

    .now-card__digital time {
      display: block;
      margin-top: 2px;
      color: #ffffff;
      font-size: clamp(2.4rem, 8vw, 3.8rem);
      font-weight: 1000;
      font-variant-numeric: tabular-nums;
      line-height: .95;
      white-space: nowrap;
    }

    .analog-clock {
      position: relative;
      width: clamp(76px, 15vw, 100px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, #fbfbfb 0 58%, #eef1f3 58% 100%);
      box-shadow: inset 0 0 0 3px #1d2228, inset 0 0 0 8px rgba(255,255,255,.48), 0 6px 14px rgba(0,0,0,.26);
      overflow: hidden;
    }

    .analog-clock::before {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: 50%;
      background: repeating-conic-gradient(from -90deg, #21262c 0deg 2deg, transparent 2deg 30deg);
      opacity: .75;
    }

    .analog-clock__hand {
      position: absolute;
      left: 50%;
      bottom: 50%;
      transform-origin: 50% 100%;
      transform: translateX(-50%) rotate(0deg);
      border-radius: 999px;
      z-index: 2;
    }

    .analog-clock__hand--hour { height: 23px; width: 6px; background: #1c2127; }
    .analog-clock__hand--minute { height: 31px; width: 4px; background: #2b3138; }
    .analog-clock__hand--second { height: 35px; width: 2px; background: var(--red); }

    .analog-clock__center {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--red);
      transform: translate(-50%, -50%);
      z-index: 3;
      box-shadow: 0 0 0 3px #fff;
    }

    .switch-wrap {
      display: grid;
      justify-items: center;
      gap: 4px;
    }

    .switch-label {
      color: rgba(255,255,255,.72);
      font-size: .78rem;
      font-weight: 900;
      letter-spacing: .08em;
    }

    .switch {
      width: min(100%, 360px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 5px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 13px;
      background: rgba(7,10,13,.58);
    }

    .switch button {
      min-height: 42px;
      border: 1px solid transparent;
      border-radius: 9px;
      color: #dce1e5;
      background: #343b42;
      font-size: .88rem;
      font-weight: 1000;
      cursor: pointer;
    }

    .switch button[aria-pressed="true"] {
      color: var(--ink);
      border-color: #fff;
      background: linear-gradient(180deg, var(--yellow-light), var(--yellow));
      box-shadow: 0 4px 0 rgba(0,0,0,.24);
    }

    .rotate-message { display: none; }

    @media (orientation: landscape) {
      .panel { display: none; }
      .clock-screen { display: grid; place-items: center; }
      .rotate-message {
        display: grid;
        place-items: center;
        width: min(86vw, 680px);
        min-height: 54vh;
        padding: 40px;
        border: 5px solid var(--yellow);
        border-radius: 28px;
        background: #22282e;
        color: #fff;
        text-align: center;
        font-size: clamp(1.5rem, 4vw, 2.5rem);
        font-weight: 1000;
        line-height: 1.5;
      }
    }

    @media (max-width: 360px) {
      .clock-screen { padding-left: 8px; padding-right: 8px; }
      .panel { padding: 12px 10px; gap: 9px; border-radius: 24px; }
      .time-input-card { padding: 11px 9px; }
      .picker-field select { min-height: 62px; }
      .adjust-row { gap: 5px; }
      .adjust-row button { min-height: 44px; font-size: .78rem; }
      .result-card { padding: 14px 8px; }
      .now-card { gap: 10px; }
    }

    @media (max-height: 760px) and (orientation: portrait) {
      .panel { gap: 8px; padding-top: 10px; padding-bottom: 10px; }
      .header p { display: none; }
      .time-input-card { padding-top: 9px; padding-bottom: 9px; }
      .picker-field select { min-height: 58px; }
      .minute-note { margin-top: 6px; }
      .adjust-row { margin-top: 7px; }
      .adjust-row button { min-height: 40px; }
      .result-card { padding-top: 10px; padding-bottom: 12px; }
      .now-card { padding-top: 7px; padding-bottom: 7px; }
      .switch button { min-height: 38px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }

    @keyframes sheen {
      0%, 55% { background-position: -145% 0; }
      85%, 100% { background-position: 245% 0; }
    }
  </style>
</head>

<body>
  <section class="clock-screen" id="clock-screen" aria-label="何時まであそべるかのご案内">
    <div class="panel">
      <header class="header">
        <small>ASOBooN TIME GUIDE</small>
        <h1>何時まであそべる？</h1>
        <p>入場した時刻を、1分単位で選んでください</p>
      </header>

      <section class="time-input-card" aria-labelledby="input-title">
        <h2 class="input-title" id="input-title">入場した時刻</h2>

        <div class="time-picker">
          <div class="picker-field">
            <label for="entry-hour">時</label>
            <select id="entry-hour" aria-label="入場時刻の時"></select>
          </div>

          <div class="picker-colon" aria-hidden="true">:</div>

          <div class="picker-field">
            <label for="entry-minute">分</label>
            <select id="entry-minute" aria-label="入場時刻の分"></select>
          </div>
        </div>

        <p class="minute-note">分は <strong>00〜59まで、1分ずつ</strong> 選べます</p>

        <div class="adjust-row" aria-label="入場時刻の微調整">
          <button type="button" id="minus-minute">−1分</button>
          <button type="button" id="plus-minute">＋1分</button>
          <button type="button" class="now-button" id="set-now">現在時刻</button>
        </div>
      </section>

      <section class="result-card" aria-live="polite">
        <div class="result-label">あなたのお帰り時間</div>
        <time class="result-time" id="leave-time">--:--</time>
        <div class="result-sub">まで遊べます</div>
        <p class="result-note" id="result-note">利用時間2時間30分で計算しています</p>
      </section>

      <section class="now-card" aria-label="現在時刻">
        <div class="now-card__digital">
          <span>現在時刻</span>
          <time id="current-time">--:--</time>
        </div>
        <div class="analog-clock" aria-hidden="true">
          <div class="analog-clock__hand analog-clock__hand--hour" id="analog-hour"></div>
          <div class="analog-clock__hand analog-clock__hand--minute" id="analog-minute"></div>
          <div class="analog-clock__hand analog-clock__hand--second" id="analog-second"></div>
          <div class="analog-clock__center"></div>
        </div>
      </section>

      <div class="switch-wrap">
        <div class="switch-label">利用時間の設定</div>
        <div class="switch" role="group" aria-label="利用時間を選択">
          <button type="button" data-minutes="150" aria-pressed="true">2時間30分</button>
          <button type="button" data-minutes="180" aria-pressed="false">3時間</button>
        </div>
      </div>
    </div>

    <div class="rotate-message">
      iPadを縦向きにして<br />ご利用ください
    </div>
  </section>

  <script>
    (() => {
      const DURATION_STORAGE_KEY = "asoboon-guide-duration";
      const ENTRY_STORAGE_KEY = "asoboon-guide-entry-time";

      const currentTime = document.getElementById("current-time");
      const leaveTime = document.getElementById("leave-time");
      const resultNote = document.getElementById("result-note");
      const entryHour = document.getElementById("entry-hour");
      const entryMinute = document.getElementById("entry-minute");
      const minusMinute = document.getElementById("minus-minute");
      const plusMinute = document.getElementById("plus-minute");
      const setNowButton = document.getElementById("set-now");
      const analogHour = document.getElementById("analog-hour");
      const analogMinute = document.getElementById("analog-minute");
      const analogSecond = document.getElementById("analog-second");
      const durationButtons = [...document.querySelectorAll(".switch button")];

      let durationMinutes = 150;

      const pad = (number) => String(number).padStart(2, "0");
      const formatTime = (date) => `${pad(date.getHours())}:${pad(date.getMinutes())}`;
      const durationText = (minutes) => minutes === 180 ? "3時間" : "2時間30分";

      function fillTimeOptions() {
        for (let hour = 0; hour < 24; hour += 1) {
          const option = document.createElement("option");
          option.value = String(hour);
          option.textContent = pad(hour);
          entryHour.appendChild(option);
        }

        for (let minute = 0; minute < 60; minute += 1) {
          const option = document.createElement("option");
          option.value = String(minute);
          option.textContent = pad(minute);
          entryMinute.appendChild(option);
        }
      }

      function readInitialDuration() {
        const params = new URLSearchParams(location.search);
        const fromQuery = Number(params.get("minutes"));
        if (fromQuery === 150 || fromQuery === 180) return fromQuery;

        try {
          const stored = Number(localStorage.getItem(DURATION_STORAGE_KEY));
          if (stored === 150 || stored === 180) return stored;
        } catch (error) {
          console.warn("利用時間設定を読み込めませんでした。", error);
        }

        return 150;
      }

      function readInitialEntryTime() {
        const params = new URLSearchParams(location.search);
        const fromQuery = String(params.get("entry") || "").match(/^(\d{1,2}):(\d{2})$/);
        if (fromQuery) {
          const hour = Number(fromQuery[1]);
          const minute = Number(fromQuery[2]);
          if (hour >= 0 && hour <= 23 && minute >= 0 && minute <= 59) {
            return { hour, minute };
          }
        }

        try {
          const stored = String(localStorage.getItem(ENTRY_STORAGE_KEY) || "").match(/^(\d{1,2}):(\d{2})$/);
          if (stored) {
            const hour = Number(stored[1]);
            const minute = Number(stored[2]);
            if (hour >= 0 && hour <= 23 && minute >= 0 && minute <= 59) {
              return { hour, minute };
            }
          }
        } catch (error) {
          console.warn("入場時刻を読み込めませんでした。", error);
        }

        const now = new Date();
        return { hour: now.getHours(), minute: now.getMinutes() };
      }

      function safeSave(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch (error) {
          console.warn("設定を保存できませんでした。", error);
        }
      }

      function updateAnalogClock(now) {
        const seconds = now.getSeconds() + now.getMilliseconds() / 1000;
        const minutes = now.getMinutes() + seconds / 60;
        const hours = (now.getHours() % 12) + minutes / 60;

        analogHour.style.transform = `translateX(-50%) rotate(${hours * 30}deg)`;
        analogMinute.style.transform = `translateX(-50%) rotate(${minutes * 6}deg)`;
        analogSecond.style.transform = `translateX(-50%) rotate(${seconds * 6}deg)`;
      }

      function selectedEntryDate() {
        const now = new Date();
        const date = new Date(now);
        date.setHours(Number(entryHour.value), Number(entryMinute.value), 0, 0);
        return date;
      }

      function updateResult() {
        const entry = selectedEntryDate();
        const leave = new Date(entry.getTime() + durationMinutes * 60 * 1000);
        const entryText = formatTime(entry);
        const leaveText = formatTime(leave);
        const crossesDay = leave.getDate() !== entry.getDate();

        leaveTime.textContent = leaveText;
        leaveTime.setAttribute("datetime", leave.toISOString());
        leaveTime.setAttribute("aria-label", `${leaveText}まで遊べます`);
        resultNote.textContent = `${entryText}入場・利用時間${durationText(durationMinutes)}で計算${crossesDay ? "（翌日）" : ""}`;

        safeSave(ENTRY_STORAGE_KEY, entryText);
      }

      function setEntryTime(hour, minute) {
        const normalized = ((Number(hour) * 60 + Number(minute)) % 1440 + 1440) % 1440;
        entryHour.value = String(Math.floor(normalized / 60));
        entryMinute.value = String(normalized % 60);
        updateResult();
      }

      function shiftEntryTime(deltaMinutes) {
        const total = Number(entryHour.value) * 60 + Number(entryMinute.value) + deltaMinutes;
        setEntryTime(0, total);
      }

      function setDuration(minutes) {
        durationMinutes = minutes === 180 ? 180 : 150;
        safeSave(DURATION_STORAGE_KEY, String(durationMinutes));

        durationButtons.forEach((button) => {
          button.setAttribute(
            "aria-pressed",
            String(Number(button.dataset.minutes) === durationMinutes)
          );
        });

        updateResult();
      }

      function updateCurrentClock() {
        const now = new Date();
        currentTime.textContent = formatTime(now);
        currentTime.setAttribute("datetime", now.toISOString());
        updateAnalogClock(now);
      }

      entryHour.addEventListener("change", updateResult);
      entryMinute.addEventListener("change", updateResult);
      minusMinute.addEventListener("click", () => shiftEntryTime(-1));
      plusMinute.addEventListener("click", () => shiftEntryTime(1));
      setNowButton.addEventListener("click", () => {
        const now = new Date();
        setEntryTime(now.getHours(), now.getMinutes());
      });

      durationButtons.forEach((button) => {
        button.addEventListener("click", () => {
          setDuration(Number(button.dataset.minutes));
        });
      });

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) updateCurrentClock();
      });

      fillTimeOptions();
      durationMinutes = readInitialDuration();
      const initialEntry = readInitialEntryTime();
      setEntryTime(initialEntry.hour, initialEntry.minute);
      setDuration(durationMinutes);
      updateCurrentClock();
      setInterval(updateCurrentClock, 250);
    })();
  </script>
</body>
</html>

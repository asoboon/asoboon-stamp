<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#0f2b46">
<title>ASOBooN｜現地受付テスト</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#efe1bd}#onsiteFrame{display:block;width:100%;height:100%;border:0;background:#efe1bd}</style>
</head>
<body>
<iframe id="onsiteFrame" title="ASOBooN 現地受付テスト"></iframe>
<script>
(()=>{
  'use strict';
  const params=new URLSearchParams(location.search);
  if(params.get('from')!=='miniapp-secret'){
    location.replace('./home.html');
    return;
  }
  const frame=document.getElementById('onsiteFrame');
  frame.src='./yoyaku.html?from=miniapp-secret';
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#6a35a8">
<title>ASOBooN｜LINE呼出通知登録</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:linear-gradient(180deg,#e7d8f6,#faf5ff 55%,#e3cff2);color:#2c2333}.app{width:min(100%,520px);margin:auto;padding:calc(env(safe-area-inset-top) + 16px) 14px calc(env(safe-area-inset-bottom) + 30px)}.head{padding:19px 16px;border:3px solid #d6b7f5;border-radius:23px;background:linear-gradient(145deg,#6b36a8,#3b1769);color:#fff;box-shadow:0 12px 28px rgba(60,23,102,.23)}.head small{display:block;color:#ead8ff;font-size:10px;font-weight:950;letter-spacing:.1em}.head h1{margin:5px 0 0;font-size:23px}.card{margin-top:12px;padding:15px;border:2px solid rgba(91,52,118,.2);border-radius:18px;background:#fffdf8;box-shadow:0 7px 18px rgba(61,34,78,.09)}.card h2{margin:0 0 7px;color:#4b276c;font-size:16px}.msg{margin-top:9px;padding:10px;border-radius:12px;font-size:12px;line-height:1.55;font-weight:850}.info{background:#f0e7f9;color:#583b71}.ok{background:#e8f6ed;color:#285d3d}.bad{background:#fff0eb;color:#7f3028}.warning{background:#fff7d9;color:#6e5615}.summary{margin-top:10px;padding:10px;border:1px solid #dfd1e8;border-radius:13px;background:#f7f0fc}.line{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:#66596e}.line+.line{margin-top:5px}.line strong{color:#33243e}.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:49px;margin-top:10px;padding:10px 12px;border-radius:13px;text-decoration:none;border:0;font-weight:1000}.primary{background:linear-gradient(180deg,#8b55c1,#5b2c8f);color:#fff;box-shadow:0 5px 0 #3c1b61}.secondary{background:#fff;color:#4b2d61;border:2px solid #8a66a4}.support{margin-top:14px;text-align:center;color:#6f6179;font-size:10px;line-height:1.5}
</style>
</head>
<body>
<main class="app">
<section class="head"><small>ASOBooN STAFF TEST / LIFF LINK v5</small><h1>LINE呼出通知を登録</h1></section>
<section class="card"><h2>通知先LINEを確認</h2><div id="status" class="msg info">LINEミニアプリを初期化しています…</div><div id="summary" class="summary"></div><button id="retry" class="btn primary" type="button" hidden>もう一度登録する</button><button id="call" class="btn secondary" type="button" hidden>🔔 この番号の呼出状況を見る</button><a class="btn secondary" href="./staff-test-home.html?v=20260905-5">← 紫のスタッフ検証HOMEへ戻る</a></section>
<div class="support">このページだけがLIFFを初期化します。受付ページではLIFFを起動しません。</div>
</main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="./app/core/app-config.js?v=20260905-1"></script>
<script src="./app/core/auto-bridge.js?v=20260905-5"></script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),CFG=window.ASOBOON_APP_CONFIG,BRIDGE=window.ASOBOON_AUTO_BRIDGE;
let payload=null;
function setStatus(t,c='info'){$('status').className='msg '+c;$('status').textContent=t}
function readPayload(){const p=new URLSearchParams(location.search),clean=v=>String(v||'').trim(),digits=v=>clean(v).replace(/\D/g,'');const x={receiptNo:digits(p.get('receiptNo')),reserveId:digits(p.get('reserveId')),waitTypeId:digits(p.get('waitTypeId')),waitTypeName:clean(p.get('waitTypeName')),operationalDay:clean(p.get('day')),adults:digits(p.get('adults')),paidChildren:digits(p.get('paidChildren')),infants:digits(p.get('infants')),totalPeople:digits(p.get('totalPeople'))};if(!x.receiptNo||!x.reserveId||!/^\d{4}$/.test(x.waitTypeId))throw new Error('受付情報が不足しています。紫の現地受付から開き直してください。');return x}
function renderSummary(x){$('summary').innerHTML=`<div class="line"><span>受付番号</span><strong>${x.receiptNo}番</strong></div><div class="line"><span>waitTypeId</span><strong>${x.waitTypeId}</strong></div><div class="line"><span>受付日</span><strong>${x.operationalDay||'--'}</strong></div>`}
function clearLegacyLinkedFlag(reserveId){try{const key=String(CFG?.autoBridgeSentKey||''),id=BRIDGE.normalizeReserveId(reserveId);if(!key||!id)return;const m=JSON.parse(localStorage.getItem(key)||'{}')||{};if(Object.prototype.hasOwnProperty.call(m,id)){delete m[id];localStorage.setItem(key,JSON.stringify(m))}}catch(e){console.warn('legacy bridge flag clear',e)}}
async function register(){
  $('retry').hidden=true;$('call').hidden=true;
  try{
    if(!window.liff||!CFG?.liffId||!BRIDGE?.queue)throw new Error('LINE連携モジュールを読み込めませんでした。');
    setStatus('LINEミニアプリを初期化しています…','info');
    await liff.init({liffId:CFG.liffId});
    payload=readPayload();renderSummary(payload);
    if(!liff.isInClient())throw new Error('LINEアプリ内から開いてください。');
    if(!liff.isLoggedIn())throw new Error('LINEログイン状態を確認できませんでした。');
    const token=String(liff.getAccessToken()||'');if(!token)throw new Error('LINEアクセストークンを取得できませんでした。');
    clearLegacyLinkedFlag(payload.reserveId);
    setStatus('受付番号とLINEアカウントを紐付けています…','info');
    const result=await BRIDGE.queue({...payload,lineAccessToken:token,source:'asoboon-staff-line-link-v5'});
    if(result?.ok&&result?.lineLinked===true){setStatus('✓ LINE呼出通知の登録が完了しました。呼出時にASOBooN公式LINEへ通知します。','ok');$('call').hidden=false;return}
    if(result?.ok&&result?.lineIdentityLinked===true){setStatus('LINEユーザーは紐付きましたが、公式LINEから通知可能な状態を確認できません。友だち追加状態またはMessaging API設定をご確認ください。','warning');$('retry').hidden=false;$('call').hidden=false;return}
    if(result?.ok){setStatus(`受付台帳には保存されましたがLINEユーザーを紐付けできませんでした。${result?.lineError?' '+result.lineError:''}`,'bad');$('retry').hidden=false;$('call').hidden=false;return}
    throw new Error(result?.error||'LINE通知台帳への登録を確認できませんでした。');
  }catch(e){console.error(e);setStatus(String(e?.message||e),'bad');$('retry').hidden=false;if(payload)$('call').hidden=false}
}
$('retry').addEventListener('click',register);$('call').addEventListener('click',()=>{if(!payload)return;const u=new URL('./staff-callstatus.html',location.href);u.searchParams.set('number',payload.receiptNo);if(payload.operationalDay)u.searchParams.set('date',payload.operationalDay);location.assign(u.href)});register();
})();
</script>
</body>
</html>

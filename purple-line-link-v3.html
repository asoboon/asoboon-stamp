<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#6a35a8"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0"><title>ASOBooN PURPLE｜LINE呼出通知 v3</title>
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:linear-gradient(180deg,#e6d4f7,#fbf7ff 52%,#e0c9f1);color:#2c2333}.app{width:min(100%,520px);margin:auto;padding:calc(env(safe-area-inset-top) + 16px) 14px calc(env(safe-area-inset-bottom) + 30px)}.head{padding:19px 16px;border:3px solid #d6b7f5;border-radius:23px;background:linear-gradient(145deg,#7137ae,#37135f);color:#fff;box-shadow:0 12px 28px rgba(60,23,102,.23)}.head small{display:block;color:#ead8ff;font-size:10px;font-weight:950;letter-spacing:.1em}.head h1{margin:5px 0 0;font-size:23px}.card{margin-top:12px;padding:15px;border:2px solid rgba(91,52,118,.2);border-radius:18px;background:#fffdfd;box-shadow:0 7px 18px rgba(61,34,78,.09)}.msg{margin-top:9px;padding:10px;border-radius:12px;font-size:12px;line-height:1.55;font-weight:850}.info{background:#f0e7f9;color:#583b71}.ok{background:#e8f6ed;color:#285d3d}.bad{background:#fff0eb;color:#7f3028}.summary{margin-top:10px;padding:10px;border:1px solid #dfd1e8;border-radius:13px;background:#f7f0fc}.line{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:#66596e}.line+.line{margin-top:5px}.line strong{color:#33243e}.flow{display:grid;gap:7px;margin-top:10px}.step{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:11px;background:#f2e9fb;color:#5b3a73;font-size:10px;font-weight:900}.step b{display:grid;place-items:center;flex:0 0 24px;width:24px;height:24px;border-radius:50%;background:#6a35a8;color:#fff}.step.done{background:#e8f6ed;color:#285d3d}.step.done b{background:#2e7a52}.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:49px;margin-top:10px;padding:10px 12px;border-radius:13px;text-decoration:none;border:0;font-weight:1000}.primary{background:linear-gradient(180deg,#8b55c1,#5b2c8f);color:#fff;box-shadow:0 5px 0 #3c1b61}.secondary{background:#fff;color:#4b2d61;border:2px solid #8a66a4}.support{margin-top:14px;text-align:center;color:#6f6179;font-size:10px;line-height:1.5}</style>
</head>
<body><main class="app"><section class="head"><small>ASOBooN PURPLE / MANDATORY LINE PUSH v3</small><h1>LINE通知を登録しています</h1></section><section class="card"><div id="status" class="msg info">LINE通知サーバーを確認しています…</div><div id="summary" class="summary"></div><div class="flow"><div id="s1" class="step"><b>1</b>LINEアカウント確認</div><div id="s2" class="step"><b>2</b>受付番号とLINEを紐付け</div><div id="s3" class="step"><b>3</b>受付直後のプッシュ送信を確認</div></div><button id="retry" class="btn primary" type="button" hidden>再試行する</button><a class="btn secondary" href="./staff-test-home.html?v=20260906-4">← 紫HOMEへ戻る</a></section><div class="support">このページはLIFF URLを踏み直さず、紫環境内で直接LINE連携します。</div></main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script src="./app/core/app-config.js?v=20260905-1"></script><script src="./app/core/auto-bridge.js?v=20260905-6"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),CFG=window.ASOBOON_APP_CONFIG,BRIDGE=window.ASOBOON_AUTO_BRIDGE;let payload=null,busy=false;
function setStatus(t,c='info'){$('status').className='msg '+c;$('status').textContent=t}
function done(id){$(id).classList.add('done')}
function readPayload(){const p=new URLSearchParams(location.search),clean=v=>String(v||'').trim(),digits=v=>clean(v).replace(/\D/g,'');const x={receiptNo:digits(p.get('receiptNo')),reserveId:digits(p.get('reserveId')),waitTypeId:digits(p.get('waitTypeId')),waitTypeName:clean(p.get('waitTypeName')),operationalDay:clean(p.get('day')),adults:digits(p.get('adults')),paidChildren:digits(p.get('paidChildren')),infants:digits(p.get('infants')),totalPeople:digits(p.get('totalPeople'))};if(!x.receiptNo||!x.reserveId||!/^\d{4}$/.test(x.waitTypeId))throw new Error('受付情報が不足しています。紫の現地予約から開き直してください。');return x}
function render(x){$('summary').innerHTML=`<div class="line"><span>受付番号</span><strong>${x.receiptNo}番</strong></div><div class="line"><span>受付日</span><strong>${x.operationalDay||'--'}</strong></div><div class="line"><span>連携</span><strong>紫現地予約 v4</strong></div>`}
function goCall(){const u=new URL('./purple-callstatus.html?v=20260906-4',location.href);u.searchParams.set('number',payload.receiptNo);if(payload.operationalDay)u.searchParams.set('date',payload.operationalDay);location.replace(u.href)}
function health(timeout=6500){return new Promise((resolve,reject)=>{const base=String(CFG?.autoBridgeUrl||'');if(!base)return reject(new Error('LINE通知サーバーURLがありません。'));const cb='__purple_health_v3_'+Date.now()+'_'+Math.random().toString(36).slice(2),u=new URL(base),s=document.createElement('script');let finished=false,t;const end=(err,v)=>{if(finished)return;finished=true;clearTimeout(t);try{delete window[cb]}catch{}s.remove();err?reject(err):resolve(v)};window[cb]=v=>end(null,v);u.searchParams.set('action','health');u.searchParams.set('callback',cb);u.searchParams.set('_',Date.now());s.src=u.href;s.onerror=()=>end(new Error('LINE通知サーバーへ接続できません。'));document.head.appendChild(s);t=setTimeout(()=>end(new Error('LINE通知サーバーの応答がありません。')),timeout)})}
function saveLinkedResult(r){try{localStorage.setItem('asoboon_purple_line_link_result_v3',JSON.stringify({date:payload.operationalDay,receiptNo:payload.receiptNo,reserveId:payload.reserveId,lineLinked:true,testPushSent:true,linkedAt:Date.now(),bridge:r||null}))}catch{}}
async function run(){if(busy)return;busy=true;$('retry').hidden=true;['s1','s2','s3'].forEach(id=>$(id).classList.remove('done'));try{payload=readPayload();render(payload);if(!window.liff||!CFG?.liffId||!BRIDGE?.queue)throw new Error('LINE連携モジュールを読み込めませんでした。');setStatus('LINE環境を初期化しています…');await liff.init({liffId:CFG.liffId,withLoginOnExternalBrowser:true});if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return}const token=String(liff.getAccessToken()||'');if(!token)throw new Error('LINEアクセストークンを取得できませんでした。');done('s1');setStatus('LINE通知サーバーを確認しています…');const h=await health();if(!h?.ok)throw new Error('LINE通知サーバーが正常ではありません。');if(!/^21\.4\./.test(String(h.version||'')))throw new Error(`LINE通知サーバーが旧版です（${h.version||'不明'}）。`);if(h.lineTokenConfigured!==true)throw new Error('LINE通知用トークンが設定されていません。');if(BRIDGE.clearLinked)BRIDGE.clearLinked(payload.reserveId);setStatus('受付番号とLINEを紐付けています…');const r=await BRIDGE.queue({...payload,lineAccessToken:token,requireLineLink:true,source:'asoboon-purple-staff-line-link-v3'});if(!(r?.ok&&r?.stored&&r?.lineLinked===true))throw new Error(r?.lineError||r?.error||'LINE通知登録を確認できませんでした。');done('s2');if(r?.testPushSent!==true)throw new Error('LINEとの紐付けはできましたが、受付直後のプッシュ通知の送信確認が取れませんでした。');done('s3');saveLinkedResult(r);setStatus('✓ LINEプッシュ通知を送信しました。紫の呼出状況へ移動します。','ok');setTimeout(goCall,900)}catch(e){console.error(e);setStatus(String(e?.message||e),'bad');$('retry').hidden=false}finally{busy=false}}
$('retry').onclick=run;run();
})();
</script></body></html>

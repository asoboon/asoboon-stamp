<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0f2b46">
<meta name="robots" content="noindex,nofollow">
<title>ASOBooN｜入場受付</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#efe1bd}
#receptionFrame{display:block;width:100%;height:100%;border:0;background:#efe1bd}
#cancelNotice{position:fixed;z-index:50;left:12px;right:12px;top:max(12px,env(safe-area-inset-top));max-width:496px;margin:auto;padding:13px 14px;border:2px solid #84b996;border-radius:15px;background:#edf8f1;color:#205f3b;box-shadow:0 10px 28px rgba(30,80,48,.18);font:900 .78rem/1.55 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
</style>
<script src="./autocall-config.js?v=10"></script>
</head>
<body>
<div id="cancelNotice" hidden>✅ 前の受付はキャンセル済みです。新しい受付を行えます。</div>
<iframe id="receptionFrame" title="ASOBooN 入場受付" hidden></iframe>
<script>
(()=>{
'use strict';
const C=window.ASOBOON_RECEPTION_CONFIG||{};
const FRAME=document.getElementById('receptionFrame');
const NOTICE=document.getElementById('cancelNotice');
const ENGINE='./yoyaku-engine-v10.html?v=10';
const STORAGE_KEY='asoboon_current_reservation_v3';
const API='https://cl.airwait.jp/WCLP/api/external/stateless/reservations';
let checking=false,lastCheck=0;
const receiptKey=v=>String(v??'').normalize('NFKC').replace(/\D/g,'').replace(/^0+(?=\d)/,'');
function current(){try{const r=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');return r&&r.receiptNo&&r.waitTypeId?r:null}catch{return null}}
async function page(waitTypeId,start){const response=await fetch(`${API}?key=${encodeURIComponent(C.airwaitApiKey||'')}`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded; charset=UTF-8'},body:new URLSearchParams({storeId:C.airwaitStoreId||'',waitTypeId:String(waitTypeId),status:'3',sortStatus:'0',isDesc:'1',start:String(start),limit:'100'}),cache:'no-store',credentials:'omit'});if(!response.ok)throw new Error(`HTTP ${response.status}`);const d=await response.json();if(!(d?.success===true||String(d?.resultCode?.code??'')==='0000'))throw new Error('cancel status unavailable');return {rows:Array.isArray(d?.innerDto?.reservations)?d.innerDto.reservations:[],count:Number(d?.innerDto?.count||0)}}
async function cancelled(r){let start=1,scanned=0;const target=receiptKey(r.receiptNo);for(let i=0;i<30;i++){const p=await page(r.waitTypeId,start);if(p.rows.some(x=>String(x?.status??'')==='3'&&String(x?.waitTypeId??'')===String(r.waitTypeId)&&receiptKey(x?.number)===target))return true;scanned+=p.rows.length;if(!p.rows.length||p.rows.length<100||(p.count&&scanned>=p.count))break;start+=p.rows.length}return false}
function showNotice(){NOTICE.hidden=false;clearTimeout(showNotice.t);showNotice.t=setTimeout(()=>NOTICE.hidden=true,6000)}
async function reconcile(force=false){const r=current();if(!r||checking)return false;const now=Date.now();if(!force&&now-lastCheck<10000)return false;lastCheck=now;checking=true;try{if(await cancelled(r)){localStorage.removeItem(STORAGE_KEY);try{localStorage.removeItem('asoboon_callstatus_number_v4')}catch{}showNotice();FRAME.src=`${ENGINE}&_=${Date.now()}`;return true}}catch(e){console.warn('reservation cancellation check failed',e)}finally{checking=false}return false}
FRAME.addEventListener('load',()=>{try{const u=new URL(FRAME.contentWindow.location.href);const enginePath=new URL(ENGINE,location.href).pathname;if(u.origin===location.origin&&u.pathname!==enginePath){top.location.href=u.href;return}}catch{}reconcile(true)});
(async()=>{await reconcile(true);if(!FRAME.getAttribute('src'))FRAME.src=ENGINE;FRAME.hidden=false})();
setInterval(()=>reconcile(false),12000);
window.addEventListener('online',()=>reconcile(true));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)reconcile(true)});
window.addEventListener('pageshow',()=>reconcile(true));
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ja">

<title>ASOBooN｜紫 呼出状況</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e8dcf6}#frame{display:block;width:100%;height:100%;border:0;background:#e8dcf6}#purpleBadge{position:fixed;z-index:2147483647;right:10px;top:max(8px,env(safe-area-inset-top));padding:7px 12px;border:2px solid #fff;border-radius:999px;background:linear-gradient(180deg,#925dcc,#6a35a8);color:#fff;font:1000 11px/1 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;box-shadow:0 6px 18px rgba(62,28,100,.34);pointer-events:none;letter-spacing:.08em}#lineBindBar{position:fixed;z-index:2147483646;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));max-width:520px;margin:auto;padding:10px;border:2px solid #fff;border-radius:16px;background:linear-gradient(145deg,#6a35a8,#3f1c65);color:#fff;box-shadow:0 10px 28px rgba(50,20,82,.35);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}#lineBindBar[hidden]{display:none!important}#lineBindBar.warning{background:linear-gradient(145deg,#805c16,#503708)}#lineBindBar strong{display:block;font-size:13px}#lineBindBar span{display:block;margin-top:3px;font-size:10px;line-height:1.45;color:#efe3fa;font-weight:800}#lineBindButton{width:100%;min-height:42px;margin-top:8px;border:0;border-radius:11px;background:#fff;color:#5b2c8c;font:1000 12px/1 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;box-shadow:0 4px 0 rgba(40,16,66,.24)}#lineBindButton[hidden]{display:none!important}
</style>

</head>
<body>
<div id="purpleBadge">🟣 PURPLE CALL v2</div>
<div id="lineBindBar" hidden><strong id="lineBindTitle">🔔 LINE呼出通知</strong><span id="lineBindText">今の受付番号へLINE通知を登録します。</span><button id="lineBindButton" type="button">Developingで通知を登録</button></div>
<iframe id="frame" title="ASOBooN 紫 呼出状況"></iframe>
<script>
(()=>{'use strict';
const PURPLE_KEY='asoboon_purple_callstatus_number_v1',RES_KEY='asoboon_purple_current_reservation_v1',SERVICE_KEY='asoboon_purple_service_message_v1',PROD_KEY='asoboon_callstatus_number_v4';
const DEV_LIFF_URL='https://miniapp.line.me/2011467470-Gk5C3lWf/',PURPLE_TIME='./purple-timeguide.html?v=20260906-2',PURPLE_HOME='./staff-test-home.html?v=20260906-5';
const SERVICE_CFG=window.ASOBOON_PURPLE_SERVICE_CONFIG||{},frame=document.getElementById('frame'),bar=document.getElementById('lineBindBar'),barTitle=document.getElementById('lineBindTitle'),barText=document.getElementById('lineBindText'),barButton=document.getElementById('lineBindButton'),params=new URLSearchParams(location.search);
const pad=v=>String(v).padStart(2,'0'),today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`},numeric=v=>{const s=String(v==null?'':v).normalize('NFKC').trim();return /^\d{1,12}$/.test(s)?s.replace(/^0+(?=\d)/,''):''},reserveId=v=>{const s=String(v==null?'':v).normalize('NFKC').trim();return /^\d{1,12}$/.test(s)?s.padStart(12,'0'):''},date=v=>{const s=String(v==null?'':v).normalize('NFKC').trim();return /^\d{4}-\d{2}-\d{2}$/.test(s)?s:''};
function readJson(key){try{return JSON.parse(localStorage.getItem(key)||'null')}catch{return null}}
function readReservation(){const x=readJson(RES_KEY);return x&&numeric(x.receiptNo)&&reserveId(x.reserveId)&&date(x.operationalDate)?x:null}
function expectedDate(){return date(params.get('date'))||date(readReservation()?.operationalDate)||today()}
function readPurple(){const x=readJson(PURPLE_KEY);return x&&date(x.date)===expectedDate()&&numeric(x.number)?{date:date(x.date),number:numeric(x.number)}:null}
function savePurple(number,businessDate){const n=numeric(number),d=date(businessDate)||expectedDate();if(!n||!d)return;try{localStorage.setItem(PURPLE_KEY,JSON.stringify({date:d,number:n}))}catch{}}
const queryNumber=numeric(params.get('number'));if(queryNumber)savePurple(queryNumber,params.get('date'));
const initialPurple=readPurple();let original=null,hadOriginal=false;
try{original=localStorage.getItem(PROD_KEY);hadOriginal=original!==null;if(initialPurple)localStorage.setItem(PROD_KEY,JSON.stringify(initialPurple));else localStorage.removeItem(PROD_KEY)}catch{}
function restoreProd(){try{if(hadOriginal)localStorage.setItem(PROD_KEY,original);else localStorage.removeItem(PROD_KEY)}catch{}}
function safeServiceResult(rec,status){try{localStorage.setItem(SERVICE_KEY,JSON.stringify({receiptNo:String(rec.receiptNo),reserveId:reserveId(rec.reserveId),businessDate:String(rec.operationalDate),status:String(status.status||''),remainingCount:Number(status.remainingCount||0),expiresAt:String(status.expiresAt||''),registeredAt:Date.now()}))}catch{}}
function localServiceState(rec){const x=readJson(SERVICE_KEY);if(!x||String(x.receiptNo)!==String(rec.receiptNo)||reserveId(x.reserveId)!==reserveId(rec.reserveId)||date(x.businessDate)!==date(rec.operationalDate))return'';return String(x.status||'')}
function serviceMode(status){if(['TOKEN_READY','FIRST_MESSAGE_SENT','CALL_MESSAGE_SENT','CALL_SEND_PENDING','CALL_SEND_RETRY'].includes(status))return'registered';if(/AMBIGUOUS|GAVE_UP|TOKEN_EXPIRED|TOKEN_EXHAUSTED/.test(status))return'blocked';return'none'}
function sameCurrentReservation(){const rec=readReservation(),p=readPurple();return rec&&p&&String(numeric(rec.receiptNo))===String(p.number)&&date(rec.operationalDate)===expectedDate()?rec:null}
function registrationUrl(rec){const u=new URL(DEV_LIFF_URL);u.searchParams.set('view','register');[['receiptNo',rec.receiptNo],['reserveId',rec.reserveId],['waitTypeId',rec.waitTypeId],['waitTypeName',rec.waitTypeName],['day',rec.operationalDate],['adults',rec.adults],['paidChildren',rec.paidChildren],['infants',rec.infants],['totalPeople',rec.totalPeople]].forEach(([k,v])=>u.searchParams.set(k,String(v??'')));u.searchParams.set('source','purple-callstatus-v2');return u.href}
function renderServiceBar(statusOverride){const rec=sameCurrentReservation();if(!rec){bar.hidden=true;return}const status=String(statusOverride||localServiceState(rec)||''),mode=serviceMode(status);bar.classList.remove('warning');barButton.hidden=false;if(mode==='registered'){bar.hidden=true;return}bar.hidden=false;if(mode==='blocked'){bar.classList.add('warning');barTitle.textContent='⚠️ LINE通知は自動再登録を停止中';barText.textContent='結果不明またはトークン状態に問題があります。二重通知防止のためスタッフ確認が必要です。';barButton.hidden=true;return}barTitle.textContent='🔔 LINE呼出通知を登録';barText.textContent='この受付番号とDeveloping MINI Appを安全に紐づけます。';barButton.onclick=()=>{location.href=registrationUrl(rec)}}
function backendConfigured(){return /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec(?:\?.*)?$/.test(String(SERVICE_CFG.backendUrl||''))}
function jsonp(action,values={},timeout=6000){return new Promise((resolve,reject)=>{if(!backendConfigured())return reject(Error('backend unavailable'));const cb='__pcs_'+Date.now()+'_'+Math.random().toString(36).slice(2),u=new URL(SERVICE_CFG.backendUrl),s=document.createElement('script');let done=false,t;const finish=(e,v)=>{if(done)return;done=true;clearTimeout(t);try{delete window[cb]}catch{}s.remove();e?reject(e):resolve(v)};window[cb]=v=>finish(null,v);u.searchParams.set('action',action);u.searchParams.set('callback',cb);Object.entries(values).forEach(([k,v])=>u.searchParams.set(k,String(v??'')));u.searchParams.set('_',Date.now());s.src=u.href;s.onerror=()=>finish(Error('status failed'));document.head.appendChild(s);t=setTimeout(()=>finish(Error('status timeout')),timeout)})}
let statusBusy=false,lastStatusAt=0;
async function refreshServiceStatus(force=false){const rec=sameCurrentReservation();if(!rec||!backendConfigured()||statusBusy)return;if(!force&&Date.now()-lastStatusAt<12000)return;statusBusy=true;lastStatusAt=Date.now();try{const r=await jsonp('reservationStatus',{receiptNo:rec.receiptNo,reserveId:rec.reserveId,businessDate:rec.operationalDate});if(r&&r.found){safeServiceResult(rec,r);renderServiceBar(r.status)}else renderServiceBar('')}catch(_){renderServiceBar()}finally{statusBusy=false}}
function patchStorage(w){try{if(w.__ASOBOON_PURPLE_STORAGE_V2__)return;const proto=w.Storage&&w.Storage.prototype;if(!proto)return;const get=proto.getItem,set=proto.setItem,remove=proto.removeItem;proto.getItem=function(k){return get.call(this,k===PROD_KEY?PURPLE_KEY:k)};proto.setItem=function(k,v){return set.call(this,k===PROD_KEY?PURPLE_KEY:k,v)};proto.removeItem=function(k){return remove.call(this,k===PROD_KEY?PURPLE_KEY:k)};w.__ASOBOON_PURPLE_STORAGE_V2__=true}catch(e){console.warn('purple storage patch',e)}}
function applyPurpleTheme(){try{const doc=frame.contentDocument;if(!doc||doc.getElementById('purpleCallThemeV2'))return;const s=doc.createElement('style');s.id='purpleCallThemeV2';s.textContent=`:root{--paper:#eee4f8!important;--paper-light:#fcf8ff!important;--paper-deep:#dcc8ef!important;--navy:#5a2d84!important;--navy-deep:#351653!important;--forest:#63368d!important;--forest-deep:#3a1d58!important;--brass:#a274c7!important;--brass-light:#d7b8ef!important;--brass-deep:#714397!important;--orange:#8e58b6!important;--green:#6c3a96!important}body{background:linear-gradient(180deg,#e9def6,#f8f4fc 55%,#decbed)!important}.top{background:linear-gradient(180deg,rgba(238,228,248,.98),rgba(238,228,248,.80),transparent)!important}.back,.submit,.ctrl.primary,.entry-confirm-btn{background:linear-gradient(180deg,#925dcc,#6a35a8)!important;border-color:#4d246d!important;color:#fff!important}.mini-brand,.live,.lookup,.lookup-summary,.waiting-guide,.rounds,.controls,.message{border-color:rgba(106,53,168,.28)!important}.hero{background:radial-gradient(circle at 82% 14%,rgba(224,188,255,.16),transparent 28%),linear-gradient(155deg,#633596,#351653)!important;border-color:#a274c7!important}.hero-emblem{background:linear-gradient(180deg,#fffaff,#eadcf7)!important}.hero h1{color:#512778!important}.hero-route-icon{background:linear-gradient(180deg,#8c58b8,#5b2d87)!important;border-color:#d7b8ef!important}.lookup{background:linear-gradient(180deg,#f8efff,#e4d4f2)!important}.lookup-title,.waiting-guide-main,.rounds h2{color:#512778!important}.personal{border-color:#8f61b2!important}.status{background:linear-gradient(180deg,#f8f0ff,#e8d7f4)!important}.roundchip,.pace,.call-deadline-badge{background:#74439d!important;color:#fff!important}.metric.primary,.forecast,.call-deadline,.entry-action{border-color:rgba(106,53,168,.28)!important;background:linear-gradient(180deg,#fbf7ff,#eee4f8)!important}.rcard{border-color:rgba(106,53,168,.25)!important}.rtoggle{background:linear-gradient(180deg,#fbf7ff,#eee4f8)!important;color:#512778!important}.q.me{border-color:#8c58b8!important;background:#f3e9fb!important}.footer{color:#765b8a!important}`;doc.head.appendChild(s)}catch(e){console.warn('purple call theme',e)}}
function durationForNumber(v){const n=Number(numeric(v));if(n>=1&&n<=799)return 180;if(n>=1001&&n<=2699)return 150;return null}
function patchNavigation(){try{const doc=frame.contentDocument;if(!doc)return;applyPurpleTheme();const entered=doc.getElementById('enteredButton');if(entered&&!entered.dataset.purpleBoundV2){entered.dataset.purpleBoundV2='1';entered.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();const u=new URL(PURPLE_TIME,location.href),mins=durationForNumber(readPurple()?.number);if(mins!=null)u.searchParams.set('minutes',String(mins));top.location.href=u.href},true)}const back=doc.getElementById('backButton');if(back&&!back.dataset.purpleBoundV2){back.dataset.purpleBoundV2='1';back.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();top.location.href=new URL(PURPLE_HOME,location.href).href},true)}const parking=doc.getElementById('parkingLink');if(parking){parking.href=new URL(PURPLE_HOME+'&mode=before&view=parking',location.href).href;parking.target='_top'}}catch(e){console.warn('purple nav patch',e)}}
frame.addEventListener('load',()=>{patchStorage(frame.contentWindow);restoreProd();applyPurpleTheme();patchNavigation();renderServiceBar();refreshServiceStatus(true);setInterval(()=>{patchNavigation();renderServiceBar();refreshServiceStatus(false)},900)});
frame.src='./callstatus-core.html?v=575&wrap=1&purple=9';
window.addEventListener('focus',()=>{renderServiceBar();refreshServiceStatus(true)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){renderServiceBar();refreshServiceStatus(true)}});
window.addEventListener('pagehide',restoreProd,{once:true});
renderServiceBar();
})();
</script>
</body>

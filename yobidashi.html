<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2b46">
<title>ASOBooN｜呼出状況</title>
<style>
:root{
  --bg:#f3e6c8;--paper:#fffaf0;--ink:#2d281f;--muted:#776b57;
  --navy:#102e49;--line:#d6c097;--green:#248655;--red:#ae3f34;
  --yellow:#a96b07;--purple:#67439a
}
*{box-sizing:border-box}
body{
  margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  color:var(--ink);background:linear-gradient(180deg,#e7d3aa,#f8efdd)
}
.app{width:min(100%,520px);margin:auto;padding:14px 13px 46px}
.hero,.card{
  background:var(--paper);border:2px solid var(--line);border-radius:20px;
  padding:16px;box-shadow:0 10px 24px rgba(75,51,19,.10)
}
.hero{background:linear-gradient(145deg,#fff9e9,#f1ddaf)}
.tag{font-size:.68rem;font-weight:950;color:#a05212}
h1{margin:5px 0;color:var(--navy)}
.number{font-size:4.4rem;line-height:1;font-weight:1000;text-align:center;color:var(--navy);margin:10px 0}
.number small{font-size:1rem}
.status{margin-top:12px;padding:16px;border-radius:17px;text-align:center}
.status.wait{background:#e5f1ff;color:#27577d}
.status.near{background:#fff0cb;color:#815306}
.status.call{background:#ffe0d7;color:#982f21}
.status.hold{background:#eee4ff;color:#624092}
.status.done{background:#e5f5ea;color:#256844}
.status.cancel{background:#ededed;color:#5d5d5d}
.status.error{background:#fff0ee;color:#8c352d}
.main{font-size:1.2rem;font-weight:950;margin-bottom:4px}
.sub{font-size:.78rem;line-height:1.65}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.box span{display:block;color:var(--muted);font-size:.65rem}
.box strong{display:block;margin-top:3px;color:var(--navy)}
.note{
  margin-top:12px;border:1px solid var(--line);border-radius:13px;padding:12px;
  background:#fff7e5;color:#705d3e;font-size:.72rem;line-height:1.65
}
.btn{
  display:block;width:100%;margin-top:12px;border:2px solid #b79d6b;border-radius:13px;
  padding:12px;background:#fff7e5;color:var(--navy);font-weight:950;text-align:center;
  text-decoration:none;cursor:pointer
}
.btn.danger{color:#8d342c;border-color:#d0a29d;background:#fff1ef}
.empty{text-align:center;padding:26px 16px;border:2px dashed var(--line);border-radius:18px;background:var(--paper)}
.hidden{display:none!important}
details{margin-top:12px}
summary{font-weight:900;color:#64543d}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#17191c;color:#dce1e7;border-radius:11px;padding:10px;font:11px/1.5 ui-monospace,monospace}
.small{text-align:center;color:var(--muted);font-size:.66rem;margin-top:11px}
</style>
</head>
<body>
<div class="app">
  <section id="emptyView" class="empty hidden">
    <h2>受付情報がありません</h2>
    <p>この端末に有効な受付番号は保存されていません。</p>
    <a class="btn" href="yoyaku.html">外部受付テストへ</a>
  </section>

  <section id="mainView" class="hidden">
    <section class="hero">
      <div class="tag" id="waitTypeLabel">--</div>
      <h1>呼出状況</h1>
      <div style="font-size:.75rem;color:var(--muted)">あなたの受付番号</div>
      <div class="number"><span id="receiptNo">--</span><small>番</small></div>
    </section>

    <section id="statusBox" class="status wait">
      <div id="statusMain" class="main">確認中…</div>
      <div id="statusSub" class="sub">Airウェイトの受付状態を確認しています。</div>
    </section>

    <div class="grid">
      <div class="box"><span>あなたの前</span><strong id="ahead">--</strong></div>
      <div class="box"><span>受付状態</span><strong id="state">--</strong></div>
    </div>

    <div class="note">
      Airウェイト側で<strong>呼出・保留・対応中・完了・取消</strong>にすると、
      この画面も自動で追従します。
    </div>

    <div class="small" id="updated">--</div>

    <details>
      <summary>テスト用</summary>
      <button id="clearBtn" class="btn danger">この端末の受付情報を消す</button>
      <pre id="raw">--</pre>
    </details>
  </section>
</div>

<script>
'use strict';

const AIRWAIT = Object.freeze({
  key:'lYwyf5yYCOSpQjg9xAJ9Fp80phVvYDHI',
  storeId:'KR01205179',
  reservationsUrl:'https://cl.airwait.jp/WCLP/api/external/stateless/reservations'
});

const STORAGE_KEY='asoboon_current_reservation_v2';
const $=id=>document.getElementById(id);

function getReservation(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;

    const r=JSON.parse(raw);

    // 18:00自動リセット
    if(r.expiresAt && Date.now() >= Number(r.expiresAt)){
      localStorage.removeItem(STORAGE_KEY);
      return null;
    }
    return r;
  }catch{
    localStorage.removeItem(STORAGE_KEY);
    return null;
  }
}
function clearReservation(){
  localStorage.removeItem(STORAGE_KEY);
}
function resultCode(data){
  return String(data?.resultCode?.code ?? '');
}
function isSuccess(data){
  return data?.success === true || resultCode(data) === '0000';
}
function setStatus(kind,main,sub){
  $('statusBox').className=`status ${kind}`;
  $('statusMain').textContent=main;
  $('statusSub').textContent=sub;
}
function stateLabel(status){
  return {
    '0':'待ち中',
    '1':'保留中',
    '2':'対応完了',
    '3':'取消',
    '4':'対応中'
  }[String(status)] || `不明 (${status})`;
}
async function fetchPage(r,start){
  const response=await fetch(
    `${AIRWAIT.reservationsUrl}?key=${encodeURIComponent(AIRWAIT.key)}`,
    {
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded; charset=UTF-8'},
      body:new URLSearchParams({
        storeId:AIRWAIT.storeId,
        waitTypeId:String(r.waitTypeId),
        sortStatus:'0',
        isDesc:'0',
        start:String(start),
        limit:'100'
      })
    }
  );

  const text=await response.text();
  let data;
  try{ data=JSON.parse(text); }
  catch{ throw new Error(`JSON以外の応答（HTTP ${response.status}）`); }

  $('raw').textContent=JSON.stringify(data,null,2);
  return data;
}
async function fetchAllReservations(r){
  let rows=[];
  let start=1;
  let total=0;

  do{
    const data=await fetchPage(r,start);

    if(resultCode(data)==='3539'){
      const e=new Error('3539');
      e.code='3539';
      throw e;
    }
    if(!isSuccess(data)){
      throw new Error(`${resultCode(data)||'ERROR'} ${data?.resultCode?.defaultMessage||''}`);
    }

    const page=Array.isArray(data?.innerDto?.reservations)
      ? data.innerDto.reservations
      : [];

    total=Number(data?.innerDto?.count || 0);
    rows.push(...page);

    if(page.length<100) break;
    start+=100;
  }while(rows.length<total && start<=99999);

  return rows;
}
function renderNoReservation(){
  $('emptyView').classList.remove('hidden');
  $('mainView').classList.add('hidden');
}
async function refresh(){
  const r=getReservation();
  if(!r){
    renderNoReservation();
    return;
  }

  $('emptyView').classList.add('hidden');
  $('mainView').classList.remove('hidden');

  $('receiptNo').textContent=r.receiptNo;
  $('waitTypeLabel').textContent=`${r.waitTypeName} / ${r.waitTypeId}`;

  try{
    const rows=await fetchAllReservations(r);

    // APIはreserveIdを返さないため、受付番号＋waitTypeIdで本人を特定。
    const target=rows.find(x =>
      String(x.waitTypeId)===String(r.waitTypeId) &&
      String(x.number)===String(r.receiptNo)
    );

    if(!target){
      $('state').textContent='未検出';
      $('ahead').textContent='--';
      setStatus(
        'wait',
        '受付情報を確認しています',
        'Airウェイトの一覧へ反映されるまで少し時間がかかる場合があります。'
      );
    }else{
      $('state').textContent=stateLabel(target.status);

      const targetIndex=rows.indexOf(target);

      // 自分より先に受付され、現在も「待ち中」のものを実待ち組数として数える。
      const ahead=rows
        .slice(0,targetIndex)
        .filter(x=>String(x.status)==='0')
        .length;

      $('ahead').textContent=`${ahead}組`;

      if(String(target.status)==='3'){
        setStatus('cancel','受付がキャンセルになりました','この受付は取消されています。');
      }else if(String(target.status)==='2'){
        setStatus('done','ご案内済みです','受付対応が完了しています。');
      }else if(String(target.status)==='4'){
        setStatus('done','現在ご案内中です','スタッフが対応しています。');
      }else if(String(target.status)==='1'){
        setStatus('hold','受付は保留中です','スタッフの案内をお待ちください。');
      }else if(String(target.isCalling)==='1'){
        setStatus('call','お呼びしています！','受付までお越しください。');
      }else if(ahead<=5){
        setStatus('near','まもなく順番です',`あなたの前にあと${ahead}組です。待合室でお待ちください。`);
      }else{
        setStatus('wait','まだお待ちください',`あなたの前に${ahead}組お待ちです。`);
      }
    }

    $('updated').textContent=
      '最終更新 '+new Date().toLocaleTimeString('ja-JP',{
        hour:'2-digit',minute:'2-digit',second:'2-digit'
      });

  }catch(err){
    $('ahead').textContent='--';

    if(err.code==='3539' || err.message==='3539'){
      $('state').textContent='API権限待ち';
      setStatus(
        'error',
        '呼出状況APIも権限待ちです',
        'Airウェイト側で外部API利用権限が有効になれば、この画面を変更せずそのまま追跡できます。'
      );
    }else{
      $('state').textContent='取得エラー';
      setStatus('error','呼出状況を取得できませんでした',String(err.message));
    }
  }
}

$('clearBtn').addEventListener('click',()=>{
  if(confirm('この端末に保存したテスト受付情報を削除しますか？')){
    clearReservation();
    location.reload();
  }
});

refresh();
setInterval(refresh,60000);

// ページを開いたまま18:00を迎えた場合も消す。
setInterval(()=>{
  if(!getReservation()) renderNoReservation();
},30000);
</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>ASOBooN 新ミニアプリ｜営業区分チェック</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#15344e;background:#f5ecd7}
*{box-sizing:border-box}body{margin:0;padding:20px}.wrap{max-width:720px;margin:0 auto}.hero{background:#15344e;color:#fff;border-radius:22px;padding:22px}.hero h1{margin:0 0 8px;font-size:1.35rem}.hero p{margin:0;line-height:1.7;font-size:.86rem;color:#e8eef2}.status{margin-top:16px;padding:14px;border-radius:16px;background:#fff;border:1px solid #dfd2b4}.status strong{display:block;font-size:1.1rem}.status small{display:block;margin-top:5px;color:#6b6d70;line-height:1.5}.grid{display:grid;gap:12px;margin-top:16px}.case{background:#fff;border:1px solid #ded3bd;border-radius:18px;padding:15px}.case-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.case h2{margin:0;font-size:1rem}.badge{padding:5px 9px;border-radius:999px;background:#ececec;font-size:.72rem;font-weight:900}.case p{margin:9px 0 0;font-size:.78rem;line-height:1.6;color:#666}.case.ok{border-color:#a7d1b5;background:#f4fbf6}.case.ok .badge{background:#dff3e5;color:#245f3d}.case.ng{border-color:#dea9a2;background:#fff5f3}.case.ng .badge{background:#fbe1dc;color:#8a382e}.case.loading .badge{background:#e8eef4;color:#365b72}.actions{display:grid;gap:10px;margin-top:16px}.btn{min-height:50px;border:0;border-radius:14px;font-weight:950;font-size:.95rem;cursor:pointer}.btn.primary{background:#15344e;color:#fff}.btn.sub{background:#fff;color:#15344e;border:1px solid #cdbf9e}.note{margin-top:16px;padding:14px;border-radius:14px;background:#fff8e8;border:1px solid #dfca97;font-size:.75rem;line-height:1.65;color:#6b5934}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.7rem;word-break:break-all}@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main class="wrap">
  <section class="hero">
    <h1>営業区分 共通基盤チェック</h1>
    <p>新ミニアプリは、曜日ではなく「営業日カレンダー」だけを正本にします。4営業区分すべてが一致したときだけ基盤OKです。</p>
  </section>

  <section id="overall" class="status">
    <strong>確認待ち</strong>
    <small>下の「4区分を確認する」を押してください。</small>
  </section>

  <div id="cases" class="grid"></div>

  <div class="actions">
    <button id="run" class="btn primary" type="button">4区分を確認する</button>
    <button id="clear" class="btn sub" type="button">キャッシュを消して再確認</button>
  </div>

  <div class="note">
    <strong>判定ルール</strong><br>
    曜日フォールバックはありません。API取得失敗、日付不一致、未対応の営業区分はすべてエラーとして止めます。<br><br>
    <span class="mono" id="version"></span>
  </div>
</main>
<script src="./core/business-day.js?v=20260831-1"></script>
<script>
(()=>{
'use strict';
const TESTS=[
  {date:'2026-08-31',expected:'平日',label:'平日'},
  {date:'2026-08-28',expected:'平日特定日',label:'平日特定日'},
  {date:'2026-08-30',expected:'土日祝日',label:'土日祝日'},
  {date:'2026-09-01',expected:'休館',label:'休館'}
];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function drawSkeleton(){
  $('cases').innerHTML=TESTS.map((t,i)=>`<section id="case${i}" class="case"><div class="case-head"><h2>${esc(t.date)}<br>${esc(t.label)}</h2><span class="badge">未確認</span></div><p>期待値：${esc(t.expected)}</p></section>`).join('');
}
function setCase(i,state,text,detail=''){
  const el=$(`case${i}`);el.className=`case ${state}`;
  el.querySelector('.badge').textContent=text;
  el.querySelector('p').innerHTML=detail;
}
function overall(ok,message){
  const el=$('overall');
  el.style.borderColor=ok===true?'#9fcaae':ok===false?'#d99e96':'#dfd2b4';
  el.style.background=ok===true?'#f1faf4':ok===false?'#fff3f1':'#fff';
  el.querySelector('strong').textContent=ok===true?'✅ 営業区分基盤 OK':ok===false?'❌ 営業区分基盤 NG':'確認中…';
  el.querySelector('small').textContent=message;
}
async function run(force=true){
  const B=window.ASOBOON_BUSINESS_DAY;
  if(!B){overall(false,'共通営業日エンジンを読み込めませんでした。');return}
  overall(null,'営業日カレンダーから4区分を確認しています。');
  TESTS.forEach((t,i)=>setCase(i,'loading','確認中',`期待値：${esc(t.expected)}`));
  let all=true;
  for(let i=0;i<TESTS.length;i++){
    const t=TESTS[i];
    try{
      const r=await B.getByDate(t.date,{force});
      const ok=r.businessType===t.expected;
      all=all&&ok;
      setCase(i,ok?'ok':'ng',ok?'一致':'不一致',`期待：<strong>${esc(t.expected)}</strong><br>実際：<strong>${esc(r.businessType)}</strong><br>利用時間：${esc(r.durationLabel)} / 閉館：${esc(r.closingTime??'—')}<br>カレンダー行：${esc(r.row??'—')}`);
    }catch(e){
      all=false;
      setCase(i,'ng','エラー',`期待：<strong>${esc(t.expected)}</strong><br>${esc(e?.message||e)}`);
    }
  }
  overall(all,all?'平日・平日特定日・土日祝日・休館の4区分すべてが営業日カレンダーと一致しました。':'1件以上一致していません。この状態では新ミニアプリの予約機能を作り進めません。');
}
$('run').addEventListener('click',()=>run(true));
$('clear').addEventListener('click',()=>{window.ASOBOON_BUSINESS_DAY?.clearCache();run(true)});
$('version').textContent=`business-day engine: ${window.ASOBOON_BUSINESS_DAY?.version||'not loaded'}`;
drawSkeleton();
})();
</script>
</body>
</html>

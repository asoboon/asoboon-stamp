<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#0f2b46">
<title>あなたの呼出状況｜ASOBooN</title>
<style>
:root{--paper:#efe1bd;--navy:#0f2b46;--line:#d8c49b;--shadow:0 12px 30px rgba(42,31,17,.22)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif}#statusFrame{display:block;width:100%;height:100%;border:0;background:var(--paper)}.empty{position:fixed;z-index:80;inset:0;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 12% 3%,rgba(255,255,255,.72),transparent 20%),linear-gradient(180deg,#eadcb8,#f8efd9 54%,#e6d4aa)}.empty[hidden]{display:none}.empty-card{width:min(100%,430px);padding:24px 18px;border:3px solid #c79a42;border-radius:24px;background:#fffaf0;text-align:center;box-shadow:var(--shadow)}.icon{display:grid;place-items:center;width:66px;height:66px;margin:0 auto 10px;border-radius:50%;background:#e4d2a6;color:#0f2b46;font-size:1.8rem;font-weight:1000}.empty h2{margin:0;color:var(--navy)}.empty p{margin:8px 0 0;color:#6d6353;font-size:.76rem;line-height:1.6}.btn{display:block;margin-top:12px;padding:13px;border-radius:13px;text-decoration:none;font-weight:950}.primary{background:linear-gradient(180deg,#f0d581,#b87c2d);border:2px solid #332311;color:#281d0e;box-shadow:0 5px 0 rgba(61,41,15,.25)}.home{background:linear-gradient(180deg,#315069,#102e49);color:#fff;box-shadow:0 4px 0 #081c2c}
</style>
</head>
<body>
<iframe id="statusFrame" title="ASOBooN 呼出状況" hidden></iframe>
<div id="empty" class="empty" hidden>
  <div class="empty-card">
    <div class="icon">🔔</div>
    <h2 id="emptyTitle">受付番号がありません</h2>
    <p id="emptyText">この端末には本日の受付情報がありません。</p>
    <a class="btn primary" href="./reserve.html">🎫 入場受付へ</a>
    <a class="btn home" href="./">🏠 ミニアプリへ戻る</a>
  </div>
</div>
<script src="./core/business-day.js?v=20260831-2"></script>
<script src="./core/reservation-store.js?v=20260831-1"></script>
<script>
(()=>{
'use strict';
const frame=document.getElementById('statusFrame'),empty=document.getElementById('empty'),title=document.getElementById('emptyTitle'),text=document.getElementById('emptyText'),B=window.ASOBOON_BUSINESS_DAY,STORE=window.ASOBOON_RESERVATION_STORE;
async function boot(){
  try{
    const day=await B.getCurrent();
    const rec=STORE.readForDate(day.operationalDate);
    if(!rec){empty.hidden=false;return}
    const url=STORE.safeAirwaitUrl(rec.shortUrl);
    if(!url){title.textContent=`受付番号 ${rec.receiptNo}番`;text.textContent='呼出状況ページを取得できませんでした。受付番号をスタッフへお伝えください。';empty.hidden=false;return}
    frame.hidden=false;frame.src=url;
  }catch(e){title.textContent='呼出状況を確認できません';text.textContent='通信状態をご確認のうえ、もう一度お試しください。';empty.hidden=false}
}
boot();
})();
</script>
</body>
</html>

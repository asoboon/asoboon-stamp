<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#0f2b46"><title>ASOBooN｜呼出状況</title><link rel="stylesheet" href="./app.css"></head><body><main class="app"><section class="hero"><span class="kicker">🔔 ASOBooN</span><h1>呼出状況</h1><p>この端末で受付した番号を確認します。</p><div class="day"><div><small>営業日カレンダー</small><strong id="businessType">確認中</strong></div><div id="duration" class="day-use">—</div></div></section><section id="noReservation" class="card" hidden><h2>受付番号がありません</h2><p>この端末には本日の受付情報がありません。</p><a class="btn primary" href="./reserve.html">🎫 入場受付へ</a><a class="btn light" href="./">🏠 HOMEへ戻る</a></section><section id="status" class="card status-big" hidden><strong>あなたの受付番号</strong><div class="number"><span id="number">--</span><small>番</small></div><p id="detail"></p><div id="summary" class="summary"></div><a id="airwaitLink" class="btn secondary" href="#" rel="noopener">AirWAITで現在の呼出状況を見る</a><a class="btn light" href="./">🏠 HOMEへ戻る</a></section><section id="error" class="card" hidden><h2>営業日情報を確認できません</h2><div id="errorMsg" class="msg bad"></div><a class="btn light" href="./">HOMEへ戻る</a></section><div class="footer">呼出状況のリアルタイム表示はAirWAITのお客様用URLを利用します。ミニアプリ側から受付一覧APIを定期ポーリングしません。</div></main><script src="./core/app-config.js?v=20260831-1"></script><script src="./core/business-day.js?v=20260831-1"></script><script src="./core/reservation-store.js?v=20260831-1"></script><script>(()=>{'use strict';const $=id=>document.getElementById(id),B=window.ASOBOON_BUSINESS_DAY,S=window.ASOBOON_RESERVATION_STORE,esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function boot(){try{const d=await B.getCurrent();$('businessType').textContent=d.businessType;$('duration').textContent=d.isClosed?'休館日':d.durationLabel;const r=S.readForDate(d.operationalDate);if(!r){$('noReservation').hidden=false;return}$('status').hidden=false;$('number').textContent=r.receiptNo;$('detail').textContent=`${r.waitTypeLabel||r.waitTypeName||'入場受付'} / ${r.totalPeople||''}名で受付済みです。`;$('summary').innerHTML=`<div class="line"><span>営業区分</span><strong>${esc(r.businessType||d.businessType)}</strong></div><div class="line"><span>入場する回</span><strong>${esc(r.waitTypeLabel||r.waitTypeName||'入場受付')}</strong></div><div class="line"><span>人数</span><strong>おとな${Number(r.adults||0)} / こども${Number(r.paidChildren||0)} / 0〜5ヶ月${Number(r.infants||0)}</strong></div>`;const u=S.safeAirwaitUrl(r.shortUrl);if(u){$('airwaitLink').href=u;$('airwaitLink').target='_self'}else{$('airwaitLink').hidden=true;$('summary').insertAdjacentHTML('afterend','<div class="msg">呼出状況URLを取得できていません。受付番号をスタッフへお伝えください。</div>')}}catch(e){$('error').hidden=false;$('errorMsg').textContent=String(e?.message||e)}}boot()})();</script></body></html>

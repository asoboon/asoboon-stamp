<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><title>ASOBooN｜営業カレンダーチェック</title><link rel="stylesheet" href="../app.css?v=20260831-2"></head><body><main class="app"><section class="hero"><span class="kicker">🧪 DIAGNOSTICS</span><h1>営業カレンダー 4区分チェック</h1><p>曜日ではなく営業カレンダーだけを正本にします。4区分すべて一致したときだけOKです。</p></section><section id="overall" class="card"><h2>確認待ち</h2><p>下のボタンで4区分を確認します。</p></section><div id="cases" class="grid two"></div><button id="run" class="btn primary" type="button">4区分を確認する</button><button id="clear" class="btn light" type="button">キャッシュを消して再確認</button><a class="btn secondary" href="../">← 新ミニアプリHOME</a><div class="footer" id="version"></div></main><script src="../core/business-day.js?v=20260831-3"></script><script>(()=>{'use strict';const TESTS=[{date:'2026-08-31',expected:'平日'},{date:'2026-08-28',expected:'平日特定日'},{date:'2026-08-30',expected:'土日祝日'},{date:'2026-09-01',expected:'休館'}],$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function skeleton(){$('cases').innerHTML=TESTS.map((t,i)=>`<section id="case${i}" class="card"><h2>${esc(t.date)}</h2><p>期待値：<strong>${esc(t.expected)}</strong><br><span data-result>未確認</span></p></section>`).join('')}function mark(i,ok,html){const el=$(`case${i}`);el.style.borderColor=ok?'#a7d1b5':'#dea9a2';el.style.background=ok?'#f4fbf6':'#fff5f3';el.querySelector('[data-result]').innerHTML=html}async function run(){const B=window.ASOBOON_BUSINESS_DAY;$('overall').querySelector('h2').textContent='確認中…';let all=true;for(let i=0;i<TESTS.length;i++){const t=TESTS[i];try{const r=await B.getByDate(t.date,{force:true}),ok=r.businessType===t.expected;all=all&&ok;mark(i,ok,`${ok?'✅ 一致':'❌ 不一致'}<br>実際：<strong>${esc(r.businessType)}</strong><br>${esc(r.durationLabel)} / 閉館 ${esc(r.closingTime??'—')}`)}catch(e){all=false;mark(i,false,`❌ エラー<br>${esc(e?.message||e)}`)}}$('overall').querySelector('h2').textContent=all?'✅ 営業カレンダー OK':'❌ 営業カレンダー NG';$('overall').querySelector('p').textContent=all?'4営業区分すべて営業カレンダーと一致しました。':'接続または区分に問題があります。この状態では本番受付へ進めません。'}$('run').addEventListener('click',run);$('clear').addEventListener('click',()=>{window.ASOBOON_BUSINESS_DAY?.clearCache();run()});$('version').textContent=`business-day ${window.ASOBOON_BUSINESS_DAY?.version||'not loaded'}`;skeleton()})();</script></body></html>

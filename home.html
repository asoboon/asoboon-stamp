<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
  <meta name="theme-color" content="#10283f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ASOBooN 冒険基地ナビ｜公式LINEミニアプリ</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#efe1bd}#miniappCore{display:block;width:100%;height:100%;border:0;background:#efe1bd}</style>
</head>
<body>
  <iframe id="miniappCore" title="ASOBooN 冒険基地ナビ"></iframe>
  <script>
    (()=>{
      const frame=document.getElementById('miniappCore');
      const coreBase=new URL('./home-core.html',location.href);
      let lastSynced='';
      function coreUrlFromParent(){const url=new URL(coreBase.href);url.search=location.search;url.hash=location.hash;return url}
      function patchCustomerLinks(){try{const win=frame.contentWindow,doc=frame.contentDocument;const clean='./yoyaku.html?v=11';if(win.ASOBOON_CONFIG)win.ASOBOON_CONFIG.reservationUrl=clean;doc?.querySelectorAll('a[href*="yoyaku-autocall-test"],a[href*="yoyaku-test"]').forEach(a=>a.setAttribute('href',clean));const quick=doc?.getElementById('reservationQuickLink');if(quick)quick.setAttribute('href',clean)}catch{}}
      function promoteChildNavigation(){try{const childUrl=new URL(frame.contentWindow.location.href);if(childUrl.origin!==location.origin)return;if(childUrl.pathname===coreBase.pathname){patchCustomerLinks();const desired=location.pathname+childUrl.search+childUrl.hash;if(desired!==lastSynced){lastSynced=desired;history.replaceState(history.state,'',desired)}return}if(/\/(?:yoyaku-autocall-test|yoyaku-test)\.html$/.test(childUrl.pathname)){top.location.href=new URL('./yoyaku.html?v=11',location.href).href;return}top.location.href=childUrl.href}catch{}}
      frame.addEventListener('load',promoteChildNavigation);
      frame.src=coreUrlFromParent().href;
      setInterval(promoteChildNavigation,450);
      window.addEventListener('popstate',()=>{try{frame.contentWindow.location.replace(coreUrlFromParent().href)}catch{}});
    })();
  </script>
</body>
</html>

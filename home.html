<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
  <meta name="theme-color" content="#10283f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ASOBooN 冒険基地ナビ｜公式LINEミニアプリ</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#efe1bd}#miniappCore{display:block;width:100%;height:100%;border:0;background:#efe1bd}</style>
  <script src="./app/core/app-config.js?v=20260831-1"></script>
  <script src="./app/core/business-day.js?v=20260831-3"></script>
</head>
<body>
  <iframe id="miniappCore" title="ASOBooN 冒険基地ナビ"></iframe>
  <script>
  (()=>{
    'use strict';

    const frame=document.getElementById('miniappCore');
    const coreBase=new URL('./home-core.html',location.href);
    const callStatusUrl=new URL('./callstatus.html',location.href).href;
    const webReservationUrl='https://airwait.jp/WCSP/storeDetail?storeNo=AKR2298124918';
    const secretTarget=new URL('./admin.html?v=20260905-6',location.href).href;
    const PLAYTIME_KEY='asoboon-adventure-time';
    let tapTimes=[],businessDay=null,businessError='',syncing=false;

    function childUrl(){
      const u=new URL(coreBase.href);
      u.search=location.search;
      u.hash=location.hash;
      return u.href;
    }

    function ensureReservationStyles(doc){
      if(doc.getElementById('asoboonCustomerReservationStyle'))return;
      const style=doc.createElement('style');
      style.id='asoboonCustomerReservationStyle';
      style.textContent=`
        #reservationQuickLink{display:flex!important}
        .reservation-start-section>h3{font-size:.92rem!important;margin-bottom:6px!important}
        .reservation-start-grid{grid-template-columns:1fr!important}
        .reservation-start-card{position:relative;cursor:pointer;touch-action:manipulation;transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease}
        .reservation-start-card::after{content:'›';position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:1.55rem;font-weight:1000;color:#8b652c}
        .reservation-start-card strong{padding-right:19px}
        .reservation-start-card:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(80,57,27,.08)}
        .reservation-start-card.web{border-color:rgba(28,112,160,.30);background:linear-gradient(180deg,#f6fcff,#e3f3fb)}
        .reservation-start-card.local{display:none!important}
        .asoboon-web-notice{margin:0 0 10px;padding:8px 10px;border-radius:11px;background:#edf7fb;border:1px solid #b7d8e6;color:#315869;font-size:.67rem;line-height:1.55;font-weight:850}
      `;
      doc.head.appendChild(style);
    }

    function patchReservationMethods(){
      try{
        const doc=frame.contentDocument;
        if(!doc)return;
        ensureReservationStyles(doc);

        const quick=doc.getElementById('reservationQuickLink');
        if(quick){
          quick.style.display='flex';
          quick.href=webReservationUrl;
          quick.target='_top';
          quick.rel='noopener noreferrer';
        }

        const section=doc.querySelector('.reservation-start-section');
        const title=section?.querySelector('h3');
        if(title){
          title.textContent='WEB受付';
          let note=doc.getElementById('asoboonCustomerWebNotice');
          if(!note){
            note=doc.createElement('p');
            note.id='asoboonCustomerWebNotice';
            note.className='asoboon-web-notice';
            note.textContent='当日の整理券はWEB受付をご利用ください。';
            title.insertAdjacentElement('afterend',note);
          }
        }

        doc.querySelectorAll('.reservation-start-card.local').forEach(el=>el.remove());

        const web=doc.querySelector('.reservation-start-card.web');
        if(web&&!web.dataset.asoboonCustomerBound){
          web.dataset.asoboonCustomerBound='1';
          web.setAttribute('role','link');
          web.setAttribute('tabindex','0');
          web.setAttribute('aria-label','WEB受付を開く');
          const label=web.querySelector('span');if(label)label.textContent='WEB受付';
          const time=web.querySelector('strong');if(time)time.textContent='7:00〜';
          const go=()=>top.location.href=webReservationUrl;
          web.addEventListener('click',go);
          web.addEventListener('keydown',e=>{
            if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}
          });
        }

        doc.querySelectorAll('a').forEach(a=>{
          const href=String(a.getAttribute('href')||'');
          if(/(?:app\/reserve\.html|onsite-reception)/i.test(href)){
            a.removeAttribute('href');
            a.style.display='none';
            a.setAttribute('aria-hidden','true');
          }
        });
      }catch{}
    }

    function bindCustomerSafetyGuard(){
      try{
        const doc=frame.contentDocument;
        if(!doc||doc.documentElement.dataset.asoboonCustomerGuard==='1')return;
        doc.documentElement.dataset.asoboonCustomerGuard='1';
        doc.addEventListener('click',e=>{
          const target=e.target.closest?.('.reservation-start-card.local,a[href*="app/reserve.html"],a[href*="onsite-reception"]');
          if(!target)return;
          e.preventDefault();
          e.stopPropagation();
          if(typeof e.stopImmediatePropagation==='function')e.stopImmediatePropagation();
        },true);
      }catch{}
    }

    function bindDirectCallStatus(){
      try{
        const doc=frame.contentDocument;
        if(!doc||doc.documentElement.dataset.asoboonDirectCall==='1')return;
        doc.documentElement.dataset.asoboonDirectCall='1';
        doc.addEventListener('click',e=>{
          if(doc.body?.classList.contains('inside'))return;
          const target=e.target.closest?.('[data-before-view="call"],[data-open-view="call"],#callStatusLink,#reservationCallLink');
          if(!target)return;
          e.preventDefault();
          e.stopPropagation();
          if(typeof e.stopImmediatePropagation==='function')e.stopImmediatePropagation();
          top.location.href=callStatusUrl;
        },true);
      }catch{}
    }

    function patchNavigation(){
      try{
        const win=frame.contentWindow,doc=frame.contentDocument;
        if(!doc||!win)return;

        if(win.ASOBOON_CONFIG){
          win.ASOBOON_CONFIG.reservationUrl=webReservationUrl;
          win.ASOBOON_CONFIG.callStatusUrl=callStatusUrl;
        }

        const call=doc.getElementById('callStatusLink');
        if(call){call.href=callStatusUrl;call.target='_top'}

        const reservationCall=doc.getElementById('reservationCallLink');
        if(reservationCall){reservationCall.href=callStatusUrl;reservationCall.target='_top'}

        doc.querySelectorAll('a').forEach(a=>{
          const href=String(a.getAttribute('href')||'');
          if(/callstatus\.html/i.test(href)){a.href=callStatusUrl;a.target='_top'}
        });

        bindDirectCallStatus();
        bindCustomerSafetyGuard();
        patchReservationMethods();
      }catch{}
    }

    function bindSecret(){
      try{
        const target=frame.contentDocument?.querySelector('.title-badge');
        if(!target||target.dataset.asoboonV2Secret==='1')return;
        target.dataset.asoboonV2Secret='1';
        target.addEventListener('click',()=>{
          const now=Date.now();
          tapTimes=tapTimes.filter(t=>now-t<4000);
          tapTimes.push(now);
          if(tapTimes.length>=7){tapTimes=[];top.location.href=secretTarget}
        },{passive:true});
      }catch{}
    }

    function ensureBusinessBadge(doc){
      let badge=doc.getElementById('asoboonV2BusinessBadge');
      if(badge)return badge;
      const durationSwitch=doc.querySelector('.duration-switch');
      if(!durationSwitch)return null;
      badge=doc.createElement('div');
      badge.id='asoboonV2BusinessBadge';
      badge.setAttribute('role','status');
      badge.style.cssText=['margin:0 0 10px','padding:11px 12px','border-radius:13px','border:2px solid rgba(239,210,127,.45)','background:linear-gradient(180deg,#263a34,#172923)','color:#fff7dd','box-shadow:0 4px 0 rgba(0,0,0,.16)','font-size:.72rem','line-height:1.5','font-weight:850'].join(';');
      durationSwitch.parentNode.insertBefore(badge,durationSwitch);
      return badge;
    }

    function applyBusinessDay(){
      try{
        const doc=frame.contentDocument,win=frame.contentWindow;
        if(!doc||!win)return;
        const durationSwitch=doc.querySelector('.duration-switch');
        const badge=ensureBusinessBadge(doc);
        const calc=doc.getElementById('calcBtn');

        if(businessError&&!businessDay){
          if(durationSwitch)durationSwitch.style.display='none';
          if(calc)calc.disabled=true;
          if(badge){
            badge.style.background='linear-gradient(180deg,#6a3b31,#43251f)';
            badge.style.borderColor='rgba(197,105,83,.55)';
            badge.innerHTML='<strong style="display:block;font-size:.82rem">営業カレンダーを確認できません</strong><span>安全のため利用時間の自動設定を停止しています。</span>';
          }
          return;
        }

        if(!businessDay)return;
        win.ASOBOON_BUSINESS_DAY=businessDay;
        if(durationSwitch)durationSwitch.style.display='none';

        if(businessDay.isClosed){
          localStorage.removeItem(PLAYTIME_KEY);
          if(calc)calc.disabled=true;
          if(badge){
            badge.style.background='linear-gradient(180deg,#6a3b31,#43251f)';
            badge.style.borderColor='rgba(197,105,83,.55)';
            badge.innerHTML='<strong style="display:block;font-size:.82rem">本日は休館日です</strong><span>営業カレンダーから自動判定しています。</span>';
          }
          return;
        }

        if(badge){
          badge.style.background='linear-gradient(180deg,#263a34,#172923)';
          badge.style.borderColor='rgba(239,210,127,.45)';
          badge.innerHTML=`<strong style="display:block;font-size:.82rem">本日は「${businessDay.businessType}」</strong><span>利用時間 ${businessDay.durationLabel}${businessDay.closingTime?`｜${businessDay.closingTime}閉館`:''}</span>`;
        }

        const target=doc.querySelector(`.duration-btn[data-duration="${businessDay.durationMinutes}"]`);
        if(target&&!target.classList.contains('active'))target.click();
        if(calc)calc.disabled=false;
      }catch{}
    }

    async function syncBusinessDay(force=false){
      if(syncing)return;
      syncing=true;
      try{
        const B=window.ASOBOON_BUSINESS_DAY;
        if(!B?.getCurrent)throw new Error('営業カレンダーを読み込めませんでした');
        businessDay=await B.getCurrent({force});
        businessError='';
        applyBusinessDay();
      }catch(e){
        businessDay=null;
        businessError=String(e?.message||e);
        applyBusinessDay();
      }finally{
        syncing=false;
      }
    }

    frame.addEventListener('load',()=>{
      patchNavigation();
      bindSecret();
      applyBusinessDay();
      syncBusinessDay(false);
    });

    frame.src=childUrl();
    setInterval(()=>{patchNavigation();bindSecret();applyBusinessDay()},700);
    setInterval(()=>syncBusinessDay(false),10*60*1000);
    window.addEventListener('focus',()=>syncBusinessDay(false));
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncBusinessDay(false)});
    window.addEventListener('online',()=>syncBusinessDay(false));
  })();
  </script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- Keep the field NFC/QR deep-link bridge BEFORE any HOME rendering or LIFF initialization. -->
  <script src="./miniapp-v2/shared/asoquest-deeplink.js?v=20261006-03"></script>
  <script>
  (()=>{
    'use strict';
    const PRODUCTION_HOME_LIVE=true;
    function paramsFromLiffState(){
      const raw=new URLSearchParams(location.search).get('liff.state');
      if(!raw)return new URLSearchParams();
      let value=raw;
      for(let i=0;i<2;i+=1){try{const next=decodeURIComponent(value);if(next===value)break;value=next}catch{break}}
      const q=value.includes('?')?value.slice(value.indexOf('?')+1):value.replace(/^\?/, '');
      return new URLSearchParams(q);
    }
    const direct=new URLSearchParams(location.search),state=paramsFromLiffState();
    const preview=direct.get('production_preview')==='1'||state.get('production_preview')==='1';
    window.ASOBOON_PRODUCTION_PREVIEW=preview;
    window.ASOBOON_PRODUCTION_SHELL=PRODUCTION_HOME_LIVE||preview;
    if(window.ASOBOON_PRODUCTION_SHELL)document.documentElement.classList.add('asoboon-production-shell');
  })();
  </script>
  <!-- Once QR/NFC handoff has run, start downloading the two HOME assets immediately.
       This avoids the extra waterfall hop through the tiny shell-loader. -->
  <script>
  if(window.ASOBOON_PRODUCTION_SHELL&&!window.ASOBOON_ASOQUEST_HANDOFF){
    for(const [kind,src] of [
      ['style','./miniapp-v2/production/production-app.css?v=d2f432b8e79b'],
      ['script','./miniapp-v2/production/production-app.js?v=122303fc733b']
    ]){
      const link=document.createElement('link');
      link.rel='preload';link.as=kind;link.href=src;document.head.appendChild(link);
    }
  }
  </script>
  <!-- Warm read-only public business-day and capacity requests. No reservation calls. -->
  <link rel="preconnect" href="https://asoboon-miniapp-v2-production-gateway.asoboon425.workers.dev" crossorigin>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F7EFE5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>ASOBooN｜公式LINEミニアプリ</title>
  <!-- A tiny neutral loading screen, not the retired HOME or an iframe. -->
  <style>
    html,body{margin:0;min-height:100%;background:#F7EFE5}
    #app{display:block;min-height:100vh}
    .asoboon-boot{padding:24px;text-align:center;font:500 14px/1.5 system-ui,sans-serif;color:#163D3A}
  </style>
</head>
<body data-asoboon-app="miniapp-v2" data-environment="production">
  <div id="app" class="app" aria-live="polite"><div class="asoboon-boot" role="status">ASOBooNを読み込み中…</div></div>
  <script>
  if(window.ASOBOON_PRODUCTION_SHELL){
    const s=document.createElement('script');
    s.src='./miniapp-v2/production/production-shell-loader.js?v=f412612d0bab';
    s.async=false;
    document.head.appendChild(s);
  }
  </script>
  <!-- Last in DOM: saturated chocolate/mint visuals override legacy pale layers. -->
  <script defer src="./miniapp-v2/production/language-switch-ux-v1.js?v=20261113-02"></script>
<script defer src="./miniapp-v2/production/i18n-ko-kmr-completion-v2.js?v=20261113-02"></script>
<link rel="stylesheet" href="./miniapp-v2/production/choco-mint-rich-v12.css?v=20261113-lang02">
</body>
</html>

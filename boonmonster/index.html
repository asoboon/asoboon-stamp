<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#253241">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="boonmonster-build" content="2026-08-29-hidden-game-hotfix-1">
  <title>BOON MONSTER｜Playable Prototype v0.3.1</title>
  <link rel="stylesheet" href="./styles.css?v=20260829-1335">
</head>
<body>
  <main class="app" id="app">
    <section class="status-zone">
      <div class="build" id="build">BOON MONSTER TEST v0.3.1</div>
      <div class="status-grid">
        <div class="status-line"><div><span>FUEL</span><b id="fuelVal">72</b></div><div class="bar"><i id="fuelBar"></i></div></div>
        <div class="status-line"><div><span>CONDITION</span><b id="conditionVal">84</b></div><div class="bar"><i id="conditionBar"></i></div></div>
        <div class="status-line"><div><span>MOOD</span><b id="moodVal">78</b></div><div class="bar"><i id="moodBar"></i></div></div>
      </div>
      <div class="growth-status"><span>GROWTH</span><b id="growthVal">0/5</b><div class="bar growth"><i id="growthBar"></i></div></div>
    </section>

    <section class="room-zone">
      <div class="pet-meta"><span class="stage" id="stageLabel">幼体</span><span id="specId">BM-BABY-MOF</span></div>
      <button id="monsterStage" class="monster-stage" aria-label="モンスターに触れる">
        <div id="aura" class="aura"></div>
        <div id="particles" class="particles" aria-hidden="true"></div>
        <div id="monsterMotion" class="monster-motion">
          <canvas id="monsterCanvas" width="96" height="96" aria-label="BOON MONSTER"></canvas>
          <div id="lockedFallback" class="locked-fallback" hidden></div>
        </div>
      </button>
      <div class="identity"><strong id="monsterName">もふーん</strong><span id="maturityHint">幼体 0 / 5</span></div>
      <div class="message" id="message">今日はなにしよう？</div>
      <div class="prototype-badge">HIDDEN GAME · VERTICAL SLICE TEST</div>
    </section>

    <nav class="main-nav" aria-label="メインメニュー">
      <button id="playBtn" class="active"><span>🏁</span><b>育てる</b></button>
      <button id="careBtn"><span>🫶</span><b>おせわ</b></button>
      <button id="dexBtn"><span>📖</span><b>図鑑</b></button>
    </nav>

    <div class="utility"><button id="newBtn">NEW</button><button id="loadBtn">LOAD</button><span id="saveState">SAVED</span></div>

    <div id="sheetBackdrop" class="backdrop" hidden></div>
    <section id="sheet" class="sheet" aria-live="polite" hidden>
      <div class="sheet-head"><div><small id="sheetKicker">BOON MONSTER</small><h2 id="sheetTitle">体験を選ぶ</h2></div><button id="sheetClose" aria-label="閉じる">×</button></div>
      <div id="sheetBody" class="sheet-body"></div>
    </section>
  </main>
  <script>
    (function(){
      var HOTFIX='20260829-1335';
      function showBootError(message){
        if(document.getElementById('boonBootError'))return;
        var box=document.createElement('div');
        box.id='boonBootError';
        box.style.cssText='position:fixed;z-index:99999;left:12px;right:12px;bottom:18px;max-width:406px;margin:auto;padding:14px;border-radius:16px;background:#253241;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;box-shadow:0 12px 36px #0006;text-align:center;font-size:12px;line-height:1.6';
        box.innerHTML='<b style="display:block;font-size:14px;margin-bottom:5px">BOON MONSTERを更新してください</b><span>'+message+'</span><button id="boonReload" style="display:block;width:100%;margin-top:10px;padding:11px;border:0;border-radius:12px;background:#78dfbd;color:#17232d;font-weight:800">再読込</button>';
        document.body.appendChild(box);
        document.getElementById('boonReload').onclick=function(){location.replace(location.pathname+'?v='+HOTFIX+'&t='+Date.now())};
      }
      window.__boonShowBootError=showBootError;
      window.addEventListener('error',function(e){
        if(!window.BoonMonsterPrototype){showBootError('ゲームプログラムの起動に失敗しました。新しい版を読み込み直します。')}
      });
      setTimeout(function(){
        if(!window.BoonMonsterPrototype)showBootError('古いキャッシュが残っている可能性があります。');
      },1800);
    })();
  </script>
  <script src="./game.js?v=20260829-1335"></script>
</body>
</html>

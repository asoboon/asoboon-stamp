<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>ASOBooN STAFF WAIT</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">ASOBooN STAFF</p>
        <h1>呼出管理</h1>
      </div>
      <div class="header-actions">
        <span id="connectionBadge" class="badge badge-demo">未設定</span>
        <button id="settingsBtn" class="icon-btn" type="button">API設定</button>
        <button id="refreshBtn" class="icon-btn" type="button" aria-label="更新">更新</button>
      </div>
    </header>

    <div id="notice" class="notice" hidden></div>

    <nav id="slotTabs" class="slot-tabs" aria-label="入場枠"></nav>

    <main>
      <section class="summary-grid" aria-label="状況">
        <article class="summary-card"><span>待機</span><strong id="waitingCount">0</strong></article>
        <article class="summary-card"><span>呼出中</span><strong id="callingCount">0</strong></article>
        <article class="summary-card"><span>保留</span><strong id="holdCount">0</strong></article>
        <article class="summary-card"><span>案内済</span><strong id="guidedCount">0</strong></article>
      </section>

      <section id="nextCard" class="next-card" aria-live="polite">
        <div class="next-card-top">
          <div>
            <p class="section-kicker">予約順で次</p>
            <h2 id="nextNumber">—</h2>
          </div>
          <div id="nextStatus" class="people-pill">—</div>
        </div>
        <p id="nextMeta" class="muted">受付情報を読み込んでいます</p>
        <button id="callNextBtn" class="primary-call" type="button" disabled>🔔 呼び出す</button>
        <p class="action-note">※ 受付番号はAirウェイト実データ。呼出・保留・案内の書込みは予約ID取得方法の確認後に接続します。</p>
      </section>

      <section class="list-section">
        <div class="list-heading">
          <div>
            <p class="section-kicker">受付一覧</p>
            <h2 id="listTitle">10:00枠</h2>
          </div>
          <p id="lastUpdated" class="muted small">未更新</p>
        </div>
        <div id="reservationList" class="reservation-list"></div>
      </section>
    </main>
  </div>

  <div id="settingsModal" class="modal-backdrop" hidden>
    <form id="settingsForm" class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="modal-header">
        <div>
          <p class="section-kicker">初回のみ</p>
          <h2 id="settingsTitle">AirウェイトAPI設定</h2>
        </div>
        <button id="closeSettingsBtn" class="icon-btn" type="button">閉じる</button>
      </div>
      <p class="settings-help">GitHubにはAPIキーを保存しません。この端末のブラウザ内だけに保存します。</p>
      <label class="field-label">APIキー<input id="apiKeyInput" class="field-input" type="password" autocomplete="off" required /></label>
      <label class="field-label">店舗ID（KR〜）<input id="storeIdInput" class="field-input" type="text" autocomplete="off" /></label>
      <div class="or">または</div>
      <label class="field-label">店舗NO（AKR〜）<input id="storeNoInput" class="field-input" type="text" autocomplete="off" /></label>
      <button class="primary-call" type="submit">保存して実データを取得</button>
      <button id="clearSettingsBtn" class="secondary-wide" type="button">この端末のAPI設定を削除</button>
    </form>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="./config.js"></script>
  <script src="./airwait-adapter.js"></script>
  <script src="./app.js"></script>
</body>
</html>

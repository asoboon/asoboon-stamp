<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#08151d">
<title>ASOBooN STAFF｜自動呼出 v15.0</title>
<style>
:root{--line:#35515d;--ink:#f7f3e8;--muted:#a9bdc5;--green:#6cdd99;--orange:#f0bd59;--red:#f08378}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;background:linear-gradient(180deg,#071219,#102832 55%,#071219);color:var(--ink)}body{padding:14px 10px 46px}.app{width:min(100%,900px);margin:auto}.hero,.card{border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,#173743,#102832);box-shadow:0 12px 28px rgba(0,0,0,.18)}.hero{padding:17px}.hero small{color:#e1c374;font-weight:950;letter-spacing:.08em}.hero h1{margin:5px 0 0;font-size:clamp(1.45rem,5vw,2.15rem)}.hero p{margin:7px 0 0;color:#bed0d7;font-size:.78rem;line-height:1.6;font-weight:700}.statusbar{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.status{padding:9px 7px;border-radius:12px;background:#091d26;border:1px solid #2f4a55;text-align:center}.status small{display:block;color:#91aab4;font-size:.57rem;font-weight:900}.status strong{display:block;margin-top:4px;font-size:.9rem}.ok{color:var(--green)}.warn{color:var(--orange)}.bad{color:var(--red)}.card{margin-top:11px;padding:14px}.card h2{margin:0;font-size:1rem}.sub{margin-top:5px;color:var(--muted);font-size:.69rem;line-height:1.55}.notice{margin-top:10px;padding:10px 11px;border-radius:11px;border-left:4px solid #d2a653;background:#2d2617;color:#eadbb2;font-size:.69rem;line-height:1.55;font-weight:800}.notice.green{border-left-color:#4e9b6b;background:#102b1d;color:#bfe9cd}.actions{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:11px}.btn{min-height:49px;border:1px solid #5a737d;border-radius:12px;color:#fff;background:#213d49;font-weight:1000;padding:0 14px;cursor:pointer}.btn.on{background:linear-gradient(180deg,#4c7b61,#315e48);border-color:#82ab91}.btn.off{background:linear-gradient(180deg,#9a4c3f,#6e3028);border-color:#c86d5e}.slot{margin-top:11px;border:1px solid #36515d;border-radius:16px;overflow:hidden;background:#0a2029}.slot.test{border-color:#a67e32}.slothead{padding:12px;background:#12303b}.slot.test .slothead{background:linear-gradient(180deg,#3a3018,#272012)}.slottop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.slotname{font-size:1rem;font-weight:1000}.badge{padding:5px 8px;border-radius:999px;background:#203540;color:#c0d2d9;font-size:.62rem;font-weight:1000;white-space:nowrap}.badge.running{background:#173d29;color:#79dda0}.badge.wait{background:#473817;color:#f2cf70}.badge.stop{background:#4b211f;color:#f49a8f}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}.metric{padding:8px 6px;border-radius:10px;background:#0a222c;text-align:center;border:1px solid #304b56}.metric small{display:block;color:#90a9b3;font-size:.54rem}.metric strong{display:block;margin-top:3px;font-size:.92rem}.schedule{margin-top:9px;padding-top:9px;border-top:1px solid #36515d;color:#b9cad1;font-size:.67rem}.rows{display:grid}.row{display:grid;grid-template-columns:90px minmax(0,1fr) 88px;gap:8px;align-items:center;padding:10px 11px;border-top:1px solid rgba(73,101,113,.35)}.num{font-size:1.06rem;font-weight:1000}.meta{color:#b9cad1;font-size:.65rem;word-break:break-all}.state{justify-self:start;padding:4px 8px;border-radius:999px;font-size:.59rem;font-weight:1000;background:#26313a}.state.calling{background:#153724;color:#75db9e}.state.hold{background:#473817;color:#f2cf70}.state.serving{background:#19344b;color:#8ac5ee}.empty{padding:13px;color:#9eb2bb;font-size:.72rem}.log{margin-top:9px;max-height:270px;overflow:auto;border-radius:12px;background:#06151b;border:1px solid #2e4852;padding:10px;font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#d1e0e6;white-space:pre-wrap}.tiny{margin-top:8px;color:#8eb9cb;font-size:.62rem;line-height:1.5}@media(max-width:700px){.statusbar,.metrics{grid-template-columns:1fr 1fr}.actions{grid-template-columns:1fr 1fr}.actions .refresh{grid-column:1/-1}.row{grid-template-columns:72px minmax(0,1fr)}.row .state{grid-column:2}.slottop{flex-direction:column}}
</style>
<script src="./autocall-config-v13.js?v=150"></script>
</head>
<body>
<main class="app">
<header class="hero">
  <small>ASOBooN STAFF / AIRWAIT DIRECT</small>
  <h1>自動呼出 v15.0</h1>
  <p>軽量単体版。共有台帳・STAFF_KEY・iframe・旧監視パッチは使用しません。</p>
  <div class="statusbar">
    <div class="status"><small>AUTO</small><strong id="autoTop">OFF</strong></div>
    <div class="status"><small>AirWAIT</small><strong id="airTop">--</strong></div>
    <div class="status"><small>監視周期</small><strong id="pollTop">--</strong></div>
    <div class="status"><small>最終更新</small><strong id="updatedTop">--:--</strong></div>
  </div>
</header>
<section class="card">
  <h2>自動呼出</h2>
  <div id="modeNotice" class="notice">AUTOは初期状態OFFです。</div>
  <div class="actions">
    <button id="onBtn" class="btn on" type="button">▶ AUTO ON</button>
    <button id="offBtn" class="btn off" type="button">■ AUTO OFF</button>
    <button id="refreshBtn" class="btn refresh" type="button">↻ 今すぐ更新</button>
  </div>
  <div class="tiny">9600「テスト入場不可」は8:00〜18:00。テスト枠稼働中は10秒監視、それ以外は30秒監視。</div>
</section>
<section class="card"><h2>受付状況</h2><div class="sub">AirWAITの現地受付枠を直接表示します。</div><div id="slots"><div class="empty">読み込んでいます…</div></div></section>
<section class="card"><h2>動作ログ</h2><div id="log" class="log">v15.0 起動しました。</div></section>
</main>
<script src="./staff-autocall-v15.js?v=150"></script>
</body>
</html>

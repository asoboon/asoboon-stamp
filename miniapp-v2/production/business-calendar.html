<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f0e7">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>営業日カレンダー｜ASOBooN</title>
<link rel="stylesheet" href="./business-calendar.css?v=1">
<script defer src="./env-facility.js"></script>
<script defer src="../shared/business-day.js"></script>
<script defer src="./business-day-resilience-v23.js"></script>
<script defer src="./business-day-cutoff-v26.js"></script>
<script defer src="./business-calendar.js?v=1"></script>
</head>
<body>
<main class="bc-page">
  <a class="bc-back" href="../../home.html" aria-label="ホームへ戻る">‹ <span>ホームへ戻る</span></a>
  <header class="bc-header"><small>ASOBooN｜川口ハイウェイオアシス</small><h1>営業日カレンダー</h1><p>定休日や臨時の営業変更をご確認いただけます。</p></header>
  <section class="bc-calendar" aria-label="営業日カレンダー">
    <div class="bc-monthbar"><button id="bcPrev" class="bc-month-arrow" type="button" aria-label="前の月">‹</button><h2 id="bcMonth" aria-live="polite">読み込み中</h2><button id="bcNext" class="bc-month-arrow" type="button" aria-label="次の月">›</button></div>
    <div class="bc-weekdays" aria-hidden="true"><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="weekend">土</span><span class="weekend">日</span></div>
    <div id="bcGrid" class="bc-grid" aria-label="日付"></div>
    <div class="bc-legend" aria-label="営業区分の色分け"><span><i class="type-weekday"></i>平日</span><span><i class="type-special"></i>平日特定日</span><span><i class="type-weekend"></i>土日祝日</span><span><i class="closed"></i>休館</span><span><i class="today"></i>今日</span></div>
  </section>
  <p id="bcStatus" class="bc-status" role="status" aria-live="polite">営業予定を確認しています…</p>
  <section id="bcDetail" class="bc-detail" aria-live="polite"><h2>日付を選択してください</h2></section>
  <p class="bc-note">火曜日は定休日です。特別営業・臨時休業は営業日程に反映します。<br>営業予定は変更になる場合があります。</p>
  <footer>ASOBooN事務局　<a href="tel:0484209780">048-420-9780</a></footer>
</main>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>ASOBooN 呼出状況</title>
  <link rel="stylesheet" href="./board.css?v=1">
</head>
<body>
  <main class="board" aria-label="ASOBooN 呼出状況掲示板">
    <header class="board-header">
      <div class="brand"><strong>ASOBooN</strong><span>呼出状況</span></div>
      <div class="slot-title">
        <div><strong id="slotLabel">10:00の回</strong><span id="slotCount"></span></div>
        <p>受付した順番に並んでいます　ご自身の受付番号をご確認ください</p>
      </div>
    </header>

    <section class="legend" aria-label="表示の見方">
      <span class="legend-item waiting"><i></i>呼出前</span>
      <span class="legend-item calling"><i></i>呼出中</span>
      <span class="legend-item done"><i>✓</i>案内済み</span>
      <span class="legend-item hold"><i>!</i>保留</span>
      <span class="legend-item canceled"><i>×</i>取消</span>
    </section>

    <section class="queue-shell" aria-label="受付番号一覧">
      <div id="queueGrid" class="queue-grid"></div>
      <div id="emptyState" class="empty-state" hidden>
        <strong id="emptyTitle">現在、表示する受付はありません</strong>
        <p id="emptyText">受付が入ると自動で表示されます。</p>
      </div>
    </section>

    <footer class="board-footer">
      <div id="connection" class="connection"><span class="live-dot"></span>接続を確認しています</div>
      <div class="updated">最終更新 <time id="updatedAt">--:--:--</time></div>
    </footer>
  </main>
  <script src="../env.js"></script>
  <script src="./board.js?v=1"></script>
</body>
</html>

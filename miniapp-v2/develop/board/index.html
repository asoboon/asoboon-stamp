<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>ASOBooN 呼出状況</title>
  <link rel="stylesheet" href="./board.css?v=15">
</head>
<body>
  <main class="board" aria-label="ASOBooN 呼出状況掲示板">
    <header class="hero">
      <div class="brand-block">
        <div class="brand-mark">ASOBooN</div>
        <div class="board-name">呼出状況</div>
        <div class="board-sub">受付番号案内</div>
      </div>

      <div class="session-sign" aria-label="現在表示中の利用回">
        <span id="sessionKicker" class="session-kicker">本日のご案内</span>
        <div class="session-main">
          <strong id="slotLabel">10:00</strong>
          <span id="slotSuffix">の回</span>
        </div>
        <small id="slotCount"></small>
      </div>
    </header>

    <section class="route-strip" aria-label="掲示板の見方">
      <div class="route-copy">
        <strong>受付番号を確認</strong>
        <span>受付した順番に並んでいます</span>
      </div>
      <div class="road" aria-hidden="true">
        <span class="road-start">受付順</span>
        <i></i><i></i><i></i><i></i><i></i>
        <span class="road-goal">ご案内 →</span>
      </div>
      <div class="legend">
        <span class="legend-item waiting"><i></i>呼出前</span>
        <span class="legend-item calling"><i>▶</i>呼出中</span>
        <span class="legend-item done"><i>✓</i>案内済</span>
        <span class="legend-item hold"><i>Ⅱ</i>保留</span>
      </div>
    </section>

    <section class="queue-shell" aria-label="受付番号一覧">
      <div class="queue-caption"><span>受付番号</span><strong id="liveCaption">呼出状況</strong></div>
      <div id="queueGrid" class="queue-grid"></div>
      <div id="emptyState" class="empty-state" hidden>
        <div class="empty-icon">↗</div>
        <strong id="emptyTitle">ただいま準備中</strong>
        <p id="emptyText">受付が入ると、ここに番号が並びます。</p>
      </div>
    </section>

    <footer class="board-footer">
      <div id="connection" class="connection"><span class="live-dot"></span>接続を確認しています</div>
      <div class="footer-center">川口ハイウェイオアシス</div>
      <div id="boardDiagnostics" class="board-diagnostics" hidden></div>
      <div class="updated">最終更新 <time id="updatedAt">--:--:--</time></div>
    </footer>
  </main>
  <script src="../env.js"></script>
  <script src="./board-effects-runtime.js?v=15"></script>
  <script src="./board-world.js?v=15"></script>
  <script src="./board-character-assets.js?v=15"></script>
  <script src="./board-source-effects.js?v=15"></script>
  <script src="./board-character-events.js?v=15"></script>
  <script src="./board-animations.js?v=15"></script>
  <script src="./board-idle-events.js?v=15"></script>
  <script src="./board-entertainment-director.js?v=15"></script>
  <script src="./board.js?v=15"></script>
</body>
</html>
